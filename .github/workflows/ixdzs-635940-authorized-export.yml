name: IXDZS 635940 new-edition authorized collection

on:
  push:
    branches: [feat/ixdzs-635940-new-edition-20261121]
    paths:
      - "tools/novel-ingest/ixdzs_635940_export.py"
      - ".github/workflows/ixdzs-635940-authorized-export.yml"
  workflow_dispatch:
    inputs:
      rights_confirmed:
        description: "I confirm permission to copy the Chinese source text (1-355)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ixdzs-635940-new-edition-collection
  cancel-in-progress: false

jobs:
  export:
    if: github.event_name == 'push' || inputs.rights_confirmed == true
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Verify offline parser, chapter numbering, and archive logic
        run: python tools/novel-ingest/ixdzs_635940_export.py --selftest
      - name: Collect authorized IXDZS8 snapshot (355 Chinese chapters)
        run: |
          python tools/novel-ingest/ixdzs_635940_export.py \
            --rights-confirmed --delay 2.0 \
            --out out/authorized-ixdzs-635940
      - name: Upload collection status even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixdzs-635940-collection-status
          path: out/authorized-ixdzs-635940/status.json
          retention-days: 30
          if-no-files-found: warn
      - name: Upload validated full-text ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ixdzs-635940-new-edition-cn-001-355
          path: out/authorized-ixdzs-635940/ixdzs-635940-1-355-cn.zip
          retention-days: 30
          if-no-files-found: error
