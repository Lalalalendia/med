name: Rulate 171081 - verified RU 40 chapters

on:
  push:
    branches:
      - research/rulate-171081-ru40-20261023
    paths:
      - "tools/novel-ingest/rulate_171081_ingest.py"
      - "tools/novel-ingest/test_rulate_171081_ingest.py"
      - "sources/rulate-171081/chapters.json"
      - ".github/workflows/rulate-171081-ru40.yml"

permissions:
  contents: read

concurrency:
  group: rulate-171081-ru40
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded reader dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate 40 fixed IDs, fail-closed parser, no-text-on-error
        run: python -m unittest discover -s tools/novel-ingest -p test_rulate_171081_ingest.py -v
      - name: Collect exact RU reader chapters 1..40
        id: ingest
        continue-on-error: true
        shell: bash
        run: |
          python tools/novel-ingest/rulate_171081_ingest.py \
            --index sources/rulate-171081/chapters.json \
            --delay 2 --out-dir out/rulate-171081
      - name: Publish only metadata into logs (never story content)
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('out/rulate-171081/receipt.json')
          if p.exists():
              d=json.loads(p.read_text(encoding='utf-8'))
              print('BOOK', d['book_id'], 'STATUS',d['status'],
                    'CHAPTERS',d['collected'],'/',d['expected'])
              fail=next((r for r in d['chapters'] if r['status']!='OK'), None)
              if fail: print('FIRST_FAILURE',fail['ordinal'],fail['status'])
              if d.get('blocker'): print('BLOCKER', d['blocker']['status'])
          else:
              print('NO_RECEIPT')
          PY
      - name: Upload metadata-only receipt (also after access restriction)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rulate-171081-ru40-receipt
          path: out/rulate-171081/receipt.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload complete 40-chapter ZIP only after all pass
        if: steps.ingest.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: rulate-171081-ru-001-040
          path: out/rulate-171081/rulate-171081-ru-001-040.zip
          if-no-files-found: error
          retention-days: 7
      - name: Reject incomplete corpus
        if: steps.ingest.outcome != 'success'
        run: exit 1
