name: Probe aiks68 Gotham tail

on:
  push:
    paths:
      - ".github/workflows/aiks68-gotham-tail-probe.yml"
      - "tools/aiks68/probe_gotham_tail.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/aiks68/probe_gotham_tail.py
