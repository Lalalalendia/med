name: Faloo 1239043 persist first artifact

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/faloo-1239043-persist-artifact.yml"

permissions:
  actions: read
  contents: write

jobs:
  persist-artifact:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download successful acquisition artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf artifact
          mkdir -p artifact
          gh run download 37659108767             --repo "${{ github.repository }}"             --name "faloo-1239043-1-235"             --dir artifact

      - name: Build canonical RAW 1-54 from artifact
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path("artifact/chapters")
          dst = Path("novels/faloo/1239043/raw")
          dst.mkdir(parents=True, exist_ok=True)

          for p in dst.glob("*.txt"):
              p.unlink()
          manifest_path = dst / "manifest.tsv"
          if manifest_path.exists():
              manifest_path.unlink()
          combined_path = dst / "combined.txt"
          if combined_path.exists():
              combined_path.unlink()

          stop_markers = {
              "飞卢小说，飞要你好看！",
              "读书三件事：阅读，收藏，加打赏！",
              "开启懒人阅读模式",
          }

          manifest = []
          combined = []
          found = 0

          for chapter in range(1, 55):
              p = src / f"{chapter:03d}.txt"
              if not p.exists():
                  raise SystemExit(f"missing artifact chapter: {p}")
              lines = p.read_text(encoding="utf-8").splitlines()
              source = next((x.split("Source: ", 1)[1] for x in lines if x.startswith("Source: ")), "")
              title_meta = next((x.split("Title: ", 1)[1] for x in lines if x.startswith("Title: ")), "")

              try:
                  start = lines.index("从本章开始听") + 1
              except ValueError:
                  raise SystemExit(f"start marker missing in {p}")

              end = len(lines)
              for i in range(start, len(lines)):
                  if lines[i].strip() in stop_markers:
                      end = i
                      break

              body = [x.rstrip() for x in lines[start:end]]
              while body and not body[0].strip():
                  body.pop(0)
              while body and not body[-1].strip():
                  body.pop()

              if not body:
                  raise SystemExit(f"empty cleaned body in {p}")

              m = re.search(r"(第\d+章[:：][^（]+)", title_meta)
              cn_title = m.group(1).strip() if m else f"第{chapter}章"

              out = [
                  f"Chapter: {chapter}",
                  f"Source: {source}",
                  f"CN-Title: {cn_title}",
                  "",
                  *body,
                  "",
              ]
              text = "\n".join(out)
              (dst / f"{chapter:03d}.txt").write_text(text, encoding="utf-8")
              manifest.append(f"{chapter:03d}\t{cn_title}\t{source}")
              combined.append(text.rstrip())
              found += 1

          if found != 54:
              raise SystemExit(f"expected 54 chapters, got {found}")

          (dst / "manifest.tsv").write_text("\n".join(manifest) + "\n", encoding="utf-8")
          (dst / "combined.txt").write_text(
              ("\n\n" + "=" * 72 + "\n\n").join(combined) + "\n",
              encoding="utf-8",
          )
          print(f"persisted {found} chapters")
          PY

      - name: Commit canonical RAW corpus
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add novels/faloo/1239043/raw
          if git diff --cached --quiet; then
            echo "No corpus changes"
            exit 0
          fi
          git commit -m "Persist complete Faloo 1239043 RAW 1-54 from artifact"
          git push
