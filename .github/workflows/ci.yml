name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings


  kaycie-private-importer:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'docs/chemistry-kaycie-elements-20261119' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image parser and PDF reader
        run: python -m pip install --disable-pip-version-check Pillow PyMuPDF
      - name: Test private importer with synthetic images only
        run: python tools/chemistry_comics/import_kaycie_private.py --selftest
