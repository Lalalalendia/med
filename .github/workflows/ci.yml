name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check
        run: cargo check --workspace
      - name: Test
        run: cargo test --workspace
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  katieb-science-collection:
    if: ${{ github.event_name == 'pull_request' && github.head_ref == 'feat/chemistry-katieb-knights-20261119' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install libraries
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 Pillow
      - name: Offline parser smoke test
        run: python tools/chemistry_comics/collect_katieb_science.py --selftest
      - name: Collect original science cartoon images for personal reading
        run: python tools/chemistry_comics/collect_katieb_science.py --out out/katieb-science
      - name: Pack offline collection
        if: success()
        run: |
          cd out
          zip -qr katieb-science-personal-reader.zip katieb-science
      - name: Upload completed reader
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: katieb-science-personal-reader
          path: out/katieb-science-personal-reader.zip
          if-no-files-found: error
          retention-days: 30
      - name: Upload diagnostics on any failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: katieb-science-diagnostics
          path: out/katieb-science/catalog.json
          if-no-files-found: ignore
          retention-days: 7
