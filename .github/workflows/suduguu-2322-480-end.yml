name: Suduguu 2322 RAW 480-end

on:
  push:
    paths:
      - ".github/workflows/suduguu-2322-480-end.yml"
      - "tools/suduguu/fetch_2322_range.py"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch 480 through current end
        run: |
          python tools/suduguu/fetch_2322_range.py \
            --start 480 \
            --end 0 \
            --out-dir novels/suduguu/2322
      - name: Persist RAW
        if: success()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add novels/suduguu/2322
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Persist Suduguu 2322 RAW chapters 480-end"
          git push
