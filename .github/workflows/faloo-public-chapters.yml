name: Faloo public chapters - manual

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: "Faloo book ID"
        required: true
        default: "1046066"
      start:
        description: "First chapter number"
        required: true
        default: "1"
      end:
        description: "Last chapter number"
        required: true
        default: "77"
      delay_seconds:
        description: "Delay between public requests"
        required: true
        default: "2.0"
      save_html:
        description: "Also keep returned HTML for debugging"
        required: true
        type: boolean
        default: false
  push:
    branches:
      - main
    paths:
      - ".github/triggers/faloo-public-1046066.txt"

permissions:
  contents: read

jobs:
  fetch-public-chapters:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch publicly accessible chapter pages
        env:
          BOOK_ID: ${{ inputs.book_id || '1046066' }}
          START: ${{ inputs.start || '1' }}
          END: ${{ inputs.end || '77' }}
          DELAY: ${{ inputs.delay_seconds || '2.0' }}
          SAVE_HTML: ${{ inputs.save_html || false }}
        run: |
          set -euo pipefail

          extra=()
          if [ "$SAVE_HTML" = "true" ]; then
            extra+=(--save-html)
          fi

          python tools/faloo-public/fetch_public_chapters.py \
            --book-id "$BOOK_ID" \
            --start "$START" \
            --end "$END" \
            --delay "$DELAY" \
            --out-dir out/faloo \
            "${extra[@]}"

      - name: Job summary
        if: always()
        run: |
          if [ -f out/faloo/summary.md ]; then
            cat out/faloo/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faloo-${{ inputs.book_id || '1046066' }}-${{ inputs.start || '1' }}-${{ inputs.end || '77' }}
          path: out/faloo/**
          if-no-files-found: warn
          retention-days: 7
