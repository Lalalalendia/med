
name: Witch skill-tree tail rendered-page diagnostics
on:
  push:
    branches: [collect/wizard-skill-tree-500-tail-20261116]
    paths: [.github/workflows/witch-skill-tail-page-probe.yml]
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: |
          python - <<'PY'
          import requests,re
          from urllib.parse import urljoin
          from bs4 import BeautifulSoup
          urls=[
            "https://www.wxff.net/zdzdmu/waxwmavv.html",
            "https://www.wxff.net/zdzdmu/waxwmavv_2.html",
            "https://www.wxff.net/zdzdmu/waxwmavv_3.html",
            "https://www.wxff.net/zdzdmu/waxwmamd.html",
            "https://www.suduguu.com/2024/4878266.html"
          ]
          sess=requests.Session()
          sess.headers.update({"User-Agent":"Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36"})
          for url in urls:
            try:
              r=sess.get(url,timeout=20);r.raise_for_status()
              p=BeautifulSoup(r.content,"html.parser",from_encoding=r.apparent_encoding)
              print("URL",url,"STATUS",r.status_code,"SIZE",len(r.content),"TITLE",p.title.get_text(" ",strip=True)[:100] if p.title else "",flush=True)
              for sel in ["#content",".content",".reading-content","div#chaptercontent","article","main"]:
                for el in p.select(sel)[:1]:
                  t=el.get_text(" ",strip=True)
                  print("ELEMENT",sel,"LEN",len(t),"TEXT",t[:175],"HTML_START",str(el)[:300],flush=True)
              nav=[(x.get_text(' ',strip=True)[:50],urljoin(r.url,x.get("href",""))) for x in p.select("a[href]") if "下一页" in x.get_text(" ",strip=True) or "上一章" in x.get_text(" ",strip=True)]
              print("NAV",nav[:10],flush=True)
              scripts=[x.get("src") or "INLINE:"+((x.get_text(" ",strip=True) or "")[:120]) for x in p.select("script")]
              print("SCRIPTS",scripts[:10],flush=True)
              print("BODY_CHARS",len(p.get_text(" ",strip=True)),flush=True)
            except Exception as exc:print("ERROR",url,str(exc),flush=True)
          PY

      - name: Decode Wxff in-page Base64 text and compare chapter overlap
        run: |
          python - <<'PY'
          import requests,re,base64,hashlib
          from bs4 import BeautifulSoup
          urls=[
            'https://www.wxff.net/zdzdmu/waxwmavd.html',
            'https://www.wxff.net/zdzdmu/waxwmavv.html',
            'https://www.wxff.net/zdzdmu/waxwmamd.html'
          ]
          session=requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36'})
          for url in urls:
            try:
              r=session.get(url,timeout=25);r.raise_for_status()
              p=BeautifulSoup(r.content,'html.parser',from_encoding=r.apparent_encoding)
              htmls=[]
              for el in p.select('#booktxt script'):
                raw=el.get_text(" ",strip=True)
                m=re.search(r"""['"]([A-Za-z0-9+/]{35,}={0,2})['"]""",raw)
                if not m:continue
                rawbytes=base64.b64decode(m.group(1),validate=True)
                htmls.append(rawbytes.decode("utf-8","replace"))
              body=BeautifulSoup("".join(htmls),'html.parser')
              texts=[e.get_text(' ',strip=True) for e in body.select('p') if e.get_text(' ',strip=True)]
              text='\n'.join(texts)
              print('DECODED',url,'SCRIPTS',len(p.select('#booktxt script')),'BLOCKS',len(htmls),'P',len(texts),'CHARS',len(text),'SHA',hashlib.sha256(text.encode()).hexdigest()[:16],flush=True)
              print('BEGIN',text[:320],flush=True)
              print('END',text[-260:],flush=True)
            except Exception as e:print('DECODE_ERROR',url,repr(e),flush=True)
          idx=session.get('https://www.wxff.net/zdzdmu/mulu_10.html',timeout=20)
          p=BeautifulSoup(idx.content,'html.parser',from_encoding=idx.apparent_encoding)
          for a in p.select('a[href]'):
            t=a.get_text(' ',strip=True)
            if any(n in t for n in ['第九百四十二章','第九百四十三章','第九百四十四章','第九百五十二章']):
              print('INDEX_LINK',t,a.get('href'),flush=True)
          PY
