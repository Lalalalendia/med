name: Authorized public chapter TXT export

on:
  push:
    branches: [feature/authorized-chapter-text-export]
    paths:
      - 'tools/novel-ingest/authorized_chapter_export.py'
      - 'tools/novel-ingest/test_authorized_chapter_export.py'
      - 'tools/novel-ingest/test_authorized_export_integration.py'
      - '.github/workflows/authorized-chapter-text-export.yml'
  pull_request:
    paths:
      - 'tools/novel-ingest/authorized_chapter_export.py'
      - 'tools/novel-ingest/test_authorized_chapter_export.py'
      - 'tools/novel-ingest/test_authorized_export_integration.py'
      - '.github/workflows/authorized-chapter-text-export.yml'
  workflow_dispatch:
    inputs:
      source_index:
        description: 'Public index URL for a source you have rights to copy'
        type: string
        required: true
      start:
        description: 'First chapter number'
        required: true
        type: string
        default: '635'
      end:
        description: 'Last chapter number (50 maximum)'
        required: true
        type: string
        default: '684'
      rights_confirmed:
        description: 'I hold rights or permission to reproduce these chapter texts'
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/novel-ingest/test_authorized_chapter_export.py
      - name: Smoke-test real exporter with 50 synthetic HTML chapters
        run: python tools/novel-ingest/test_authorized_export_integration.py --out out/authorized-smoke
      - name: Upload synthetic 50-chapter TXT bundle
        uses: actions/upload-artifact@v4
        with:
          name: authorized-export-SYNTHETIC-SMOKE-635-684
          path: out/authorized-smoke/
          if-no-files-found: error
          retention-days: 2

  export:
    if: github.event_name == 'workflow_dispatch' && inputs.rights_confirmed == true
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install requirements
        run: python -m pip install requests beautifulsoup4 playwright
      - name: Export and validate chapter texts
        env:
          SOURCE: ${{ inputs.source_index }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
        run: |
          python tools/novel-ingest/authorized_chapter_export.py \
            --index "$SOURCE" --start "$START" --end "$END" \
            --authorized --out out/authorized-book --delay 2.0
      - name: Upload authorized source archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: authorized-chapters-${{ inputs.start }}-${{ inputs.end }}
          path: out/authorized-book/
          if-no-files-found: error
          retention-days: 1
