name: One Piece MTL chapter 55 - one shot

on:
  push:
    paths:
      - ".github/workflows/onepiece-fanmtl-055.yml"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch chapter 55
        run: |
          python tools/onepiece-fanmtl/fetch_chapter.py \
            --chapter 55 \
            --out novels/faloo/1239043/mtl/055.txt
      - name: Persist chapter
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add novels/faloo/1239043/mtl/055.txt
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Fetch One Piece fanfic chapter 55 MTL bridge"
          git push
