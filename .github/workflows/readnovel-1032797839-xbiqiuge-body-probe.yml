name: Marvel Uzumaki xbiqiuge chapter body and catalog
on:
  push:
    paths: [.github/workflows/readnovel-1032797839-xbiqiuge-body-probe.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Check complete public text in middle and ending chapters
        run: |
          python - <<'PY'
          import requests,json,re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from urllib.robotparser import RobotFileParser
          base="http://www.xbiqiuge.net/biquge_143731/"
          s=requests.Session();s.headers.update({"User-Agent":"AuthorizedBookCensus/1.0","Accept-Language":"zh-CN,zh;q=0.9"})
          rb=s.get("http://www.xbiqiuge.net/robots.txt",timeout=20)
          robot=RobotFileParser();robot.parse(rb.text.splitlines() if rb.status_code==200 else ["User-agent: *","Disallow: /"])
          urls=[base,base+"66126148.html",base+"66126148_2.html",base+"66695261.html",base+"66695261_2.html",base+"66695262.html",base+"66695262_2.html"]
          results=[]
          for u in urls:
            item={"url":u}
            if not robot.can_fetch(s.headers["User-Agent"],u):
              item["status"]="robots_disallowed";results.append(item);continue
            try:
              r=s.get(u,timeout=30,allow_redirects=False);r.encoding=r.apparent_encoding or "utf-8"
              soup=BeautifulSoup(r.text,"html.parser")
              item.update(status=r.status_code,size=len(r.content),title=soup.title.get_text(" ",strip=True) if soup.title else "",
                          headings=[x.get_text(" ",strip=True)[:90] for x in soup.select("h1,h2")[:5]])
              if u==base:
                links=[]
                for a in soup.select("a[href]"):
                  t=a.get_text(" ",strip=True)
                  if re.search(r"第.{1,13}章|尾声|完结",t) and "biquge_143731" in urljoin(base,a["href"]):
                    links.append({"title":t[:100],"url":urljoin(base,a["href"])})
                item["link_count"]=len(links);item["first"]=links[:8];item["last"]=links[-8:]
              else:
                for sel in ["#content","#chaptercontent",".content","#chapter_content",".showtxt","#read_content","article","div#txt"]:
                  el=soup.select_one(sel)
                  if el:
                    txt=el.get_text(" ",strip=True)
                    item[sel]={"len":len(txt),"hanzi":len(re.findall(r"[\u3400-\u9fff]",txt)),
                               "paragraphs":len(el.find_all("p")),"sample_start":txt[:120],"sample_end":txt[-120:]}
                item["navigation"]=[{"name":a.get_text(" ",strip=True)[:40],"url":urljoin(u,a["href"])}
                                    for a in soup.select("a[href]") if re.search(r"下一页|上一页|下一章|章节目录|回目录|下一頁|上一頁",a.get_text(" ",strip=True))][:14]
            except Exception as e:item["error"]=repr(e)[:250]
            results.append(item)
          print(json.dumps(results,ensure_ascii=False,indent=2))
          PY
