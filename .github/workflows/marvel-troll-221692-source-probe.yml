name: Marvel Troll 221692 - source availability probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/marvel-troll-221692-source-probe.yml"
      - "tools/novel-ingest/marvel_troll_source_probe.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Test chapter source accessibility
        run: python tools/novel-ingest/marvel_troll_source_probe.py
      - name: Upload source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marvel-troll-221692-source-availability
          path: out/marvel-troll-221692/probe.json
          if-no-files-found: warn
          retention-days: 7
