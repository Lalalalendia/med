name: Persist witch corpus

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/witch-corpus-persist.yml"

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: witch-clean-corpus-504
          path: work
          run-id: 37806756433
          github-token: ${{ github.token }}

      - name: Split and persist corpus
        run: |
          set -euo pipefail
          mkdir -p "sources/witch-75248/chapters"
          cp work/witch-clean-504.txt "sources/witch-75248/full-504.txt"
          cp work/clean-summary.json "sources/witch-75248/clean-summary.json"

          python - <<'PY'
          import importlib.util
          import json
          from pathlib import Path
          import sys

          source=Path("tools/novel-ingest/extract_chapter.py")
          spec=importlib.util.spec_from_file_location("extract_chapter",source)
          mod=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=mod
          assert spec.loader is not None
          spec.loader.exec_module(mod)

          root=Path("sources/witch-75248")
          text=(root/"full-504.txt").read_text(encoding="utf-8")
          entries=mod.parse_book(text)
          numbered=[x for x in entries if x.entry_type=="chapter"]
          service=[x for x in entries if x.entry_type=="service"]

          assert len(entries)==504
          assert len(numbered)==497
          assert len(service)==7

          manifest=[]
          for ch in numbered:
              n=ch.author_number
              path=root/"chapters"/f"{n:03d}.txt"
              path.write_text(ch.text,encoding="utf-8")
              manifest.append({
                  "author_number":n,
                  "ordinal_in_jiangchen_corpus":ch.ordinal,
                  "heading":ch.heading,
                  "chars":ch.chars,
                  "sha256":ch.sha256,
                  "path":str(path),
              })

          service_records=[
              {
                  "official_ordinal":70,
                  "heading":"上架感言",
                  "body_source":"Jiangchen",
              },
              {
                  "official_ordinal":71,
                  "heading":"群炸了，请前往评论区",
                  "body_source":None,
                  "official_url":"https://www.qidian.com/chapter/1043611747/890168560/",
                  "note":"Official catalog confirmed; body blocked by Qidian WAF and absent from Jiangchen.",
              },
          ]
          known_after=[
              "电脑炸了……请假",
              "请假条",
              "没办法再请天假，顺便说下近况",
              "罪己诏",
              "新书已发，《司教大人深不可测》",
              "群炸了，转至备用群，加群方式见评论区",
          ]
          for heading in known_after:
              service_records.append({"heading":heading,"body_source":"Jiangchen"})

          (root/"numbered-manifest.json").write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          (root/"service-records.json").write_text(
              json.dumps(service_records,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )

          full_numbered="\n\n".join(ch.text.strip() for ch in numbered)+"\n"
          (root/"numbered-497.txt").write_text(full_numbered,encoding="utf-8")

          print("numbered",len(numbered))
          print("service_with_body",len(service))
          print("chapter_files",len(list((root/"chapters").glob("*.txt"))))
          print("numbered_chars",len(full_numbered))
          PY

      - name: Commit corpus
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/witch-75248
          if git diff --cached --quiet; then
            echo "No corpus changes."
            exit 0
          fi
          git commit -m "Persist witch novel RAW corpus"
          git push
