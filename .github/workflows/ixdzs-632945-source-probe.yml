name: IXDZS 632945 source ZIP inspection

on:
  push:
    branches: [feat/ixdzs-632945-authorized-20261120]
    paths: [".github/workflows/ixdzs-632945-source-probe.yml"]

permissions:
  contents: read

jobs:
  source-zip:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Retrieve original official ZIP for authorized structure inspection
        run: |
          python -m pip install --disable-pip-version-check requests
          python - <<'PY'
          import hashlib
          from pathlib import Path
          from urllib.parse import urlsplit
          import requests
          url = "https://down7.ixdzs8.com/632945.zip"
          response = requests.get(url, timeout=(10, 90), stream=True)
          response.raise_for_status()
          dest = urlsplit(response.url)
          if dest.scheme != "https" or dest.netloc != "down7.ixdzs8.com":
              raise ValueError("Unexpected redirect")
          Path("out").mkdir(exist_ok=True)
          p = Path("out/ixdzs-632945-source.zip")
          with p.open("wb") as fp:
              size = 0
              for chunk in response.iter_content(131072):
                  size += len(chunk)
                  if size > 50*1024*1024:
                      raise ValueError("Archive over 50 MiB")
                  fp.write(chunk)
          data = p.read_bytes()
          if not data.startswith(b"PK"):
              raise ValueError("Downloaded file is not a ZIP")
          print("OFFICIAL_SOURCE_ZIP_BYTES",len(data),"SHA256",hashlib.sha256(data).hexdigest())
          PY
      - name: Save original source ZIP, temporary authorized artifact
        uses: actions/upload-artifact@v4
        with:
          name: ixdzs-632945-original-source-zip
          path: out/ixdzs-632945-source.zip
          retention-days: 7
          if-no-files-found: error
