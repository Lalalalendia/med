name: CZBooks uk0ff first 50 verified TXT
on:
  push:
    branches:
      - feature/bingfong-736-audit
    paths:
      - ".github/workflows/czbooks-uk0ff-first50.yml"
      - "tools/novel-ingest/czbooks_uk0ff.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect-50:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Collect chapters 1-50 with rights confirmed
        run: |
          python -u tools/novel-ingest/czbooks_uk0ff.py \
            --mode collect --rights-confirmed --start 1 --end 50 \
            --delay 1.5 --out out/czbooks-first50
      - name: Validate chapter file hashes, continuous ordinals and assemble ZIP
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED

          root = Path("out/czbooks-first50")
          data = json.loads((root / "manifests/part-0001.json").read_text(encoding="utf-8"))
          assert data["status"] == "PASS", data.get("errors")
          assert data["rights_attested"] is True
          assert data["range"] == [1, 50]
          assert [row["number"] for row in data["chapters"]] == list(range(1, 51))
          assert len({r["body_sha256"] for r in data["chapters"]}) == 50
          contents = []
          for i, row in enumerate(data["chapters"], 1):
              path = root / f"chapters/{i:04d}.txt"
              raw = path.read_bytes()
              assert raw and hashlib.sha256(raw).hexdigest() == row["file_sha256"], i
              contents.append(raw.decode("utf-8"))
          combined = "\n\n".join(contents)
          (root / "combined.txt").write_text(combined, encoding="utf-8")
          digest = hashlib.sha256(combined.encode("utf-8")).hexdigest()
          (root / "summary.md").write_text(
              "# 修真网络时代: chapters 1–50\n\n"
              "- Status: PASS; 50/50 continuous chapters\n"
              "- Source: https://czbooks.net/n/uk0ff\n"
              f"- Combined SHA-256: {digest}\n", encoding="utf-8")
          archive = root / "xiuzhen-wangluo-shidai-001-050-cn.zip"
          with ZipFile(archive, "w", ZIP_DEFLATED) as zipped:
              for i in range(1, 51):
                  file = root / f"chapters/{i:04d}.txt"
                  zipped.write(file, f"chapters/{i:04d}.txt")
              zipped.write(root / "combined.txt", "combined.txt")
              zipped.write(root / "manifests/part-0001.json", "manifest.json")
              zipped.write(root / "summary.md", "summary.md")
          print("FULL_PASS 50/50; archive:", archive, "combined_sha256:", digest)
          PY
      - name: Publish result summary
        if: always()
        run: |
          if [ -f out/czbooks-first50/summary.md ]; then cat out/czbooks-first50/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Upload verified archive and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiuzhen-wangluo-shidai-001-050-cn
          path: |
            out/czbooks-first50/xiuzhen-wangluo-shidai-001-050-cn.zip
            out/czbooks-first50/manifests/
            out/czbooks-first50/summary.md
          retention-days: 14
          if-no-files-found: warn
