name: Finalize witch corpus

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/witch-corpus-finalize.yml"

permissions:
  contents: read
  actions: read

jobs:
  finalize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: witch-pages-*
          path: work/pages
          merge-multiple: true
          run-id: 37806479709
          github-token: ${{ github.token }}

      - uses: actions/download-artifact@v4
        with:
          name: witch-manifest
          path: work
          run-id: 37806479709
          github-token: ${{ github.token }}

      - name: Build clean 504-entry TXT
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json, re, hashlib

          rows=json.loads(Path("work/manifest.json").read_text(encoding="utf-8"))

          OFFICIAL_TITLES = {
              173: "第173章 情感带师（万字大章）",
              259: "第259章 难道你也背叛了吗（）",
              300: "第300章 情报及时的重要性（居然都三百章了）",
              328: "第328章 黄金树之影（）",
              351: "第351章 一路向北，离开有你的季节（）",
          }

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_content=False
                  self.content_depth=0
                  self.in_p=False
                  self.pbuf=[]
                  self.paras=[]
              def handle_starttag(self,tag,attrs):
                  tag=tag.lower(); d=dict(attrs)
                  if tag=="div" and d.get("id")=="content":
                      self.in_content=True; self.content_depth=1; return
                  if not self.in_content: return
                  if tag=="div": self.content_depth+=1
                  elif tag=="p":
                      self.in_p=True; self.pbuf=[]
                  elif tag=="br" and self.in_p:
                      self.pbuf.append("\n")
              def handle_data(self,data):
                  if self.in_content and self.in_p:
                      self.pbuf.append(data)
              def handle_endtag(self,tag):
                  tag=tag.lower()
                  if self.in_content and tag=="p" and self.in_p:
                      text="".join(self.pbuf).strip()
                      if text: self.paras.append(text)
                      self.in_p=False; self.pbuf=[]
                  if self.in_content and tag=="div":
                      self.content_depth-=1
                      if self.content_depth==0:self.in_content=False

          def clean_paras(paras):
              out=[]
              for x in paras:
                  x=re.sub(r"\s+"," ",x).strip()
                  if not x: continue
                  if x.startswith("如果此书侵犯了您的权益"): continue
                  if x.startswith("小主子，这个章节后面还有哦"): continue
                  if x.startswith("喜欢魔女大人，请按剧本黑化！请大家收藏"): continue
                  if x=="魔女大人，请按剧本黑化！江辰小说更新速度全网最快。": continue
                  out.append(x)
              return out

          blocks=[]
          numbered=0
          services=[]
          empty=[]
          for row in rows:
              html=Path(f"work/pages/{row['ordinal']:03d}.html").read_text(encoding="utf-8",errors="replace")
              p=P(); p.feed(html)
              paras=clean_paras(p.paras)
              if not paras: empty.append(row["ordinal"])
              heading=row["heading"]
              m=re.match(r"^第\s*(\d+)\s*章",heading)
              if m:
                  n=int(m.group(1)); numbered+=1
                  heading=OFFICIAL_TITLES.get(n,heading)
              else:
                  services.append(heading)
              blocks.append(heading+"\n\n"+"\n".join(paras))

          assert not empty, empty
          assert len(blocks)==504
          assert numbered==497
          assert len(services)==7

          txt="\n\n".join(blocks)+"\n"
          Path("out/witch-clean-504.txt").write_text(txt,encoding="utf-8")
          Path("out/clean-summary.json").write_text(json.dumps({
              "entries":len(blocks),
              "numbered":numbered,
              "service":len(services),
              "chars":len(txt),
              "bytes":len(txt.encode("utf-8")),
              "sha256":hashlib.sha256(txt.encode("utf-8")).hexdigest(),
              "services":services,
          },ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(Path("out/clean-summary.json").read_text(encoding="utf-8"))
          PY

      - name: Verify with production parser
        run: |
          set -euo pipefail
          python tools/novel-ingest/extract_chapter.py out/witch-clean-504.txt --author-number 497 --out-dir out/parser-check             | tee out/parser-summary.json
          python - <<'PY'
          import json
          x=json.load(open("out/parser-summary.json",encoding="utf-8"))
          assert x["numbered_chapters"]==497, x
          assert x["service_entries"]==7, x
          assert x["extra_entries"]==0, x
          assert x["max_author_number"]==497, x
          assert x["missing_author_numbers"]==[], x
          print("production_parser_ok")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: witch-clean-corpus-504
          path: |
            out/witch-clean-504.txt
            out/clean-summary.json
            out/parser-summary.json
          retention-days: 7
