name: CZBooks Marvel array master authorized export
on:
  push:
    branches:
      - collect/czbooks-marvel-array-master-20261125
    paths:
      - '.github/workflows/czbooks-marvel-array-master.yml'
      - 'tools/novel-ingest/czbooks_marvel_array_master.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Synthetic regression tests
        run: python tools/novel-ingest/czbooks_marvel_array_master.py --selftest
      - name: Collect explicitly authorized catalog entries
        run: python -u tools/novel-ingest/czbooks_marvel_array_master.py --rights-confirmed
      - name: Summary
        if: always()
        run: |
          if test -f out/czbooks-marvel-array-master/summary.md; then
            cat out/czbooks-marvel-array-master/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload verified ZIP and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marvel-array-master-cn-001-303
          path: |
            out/czbooks-marvel-array-master/*.zip
            out/czbooks-marvel-array-master/manifest.json
            out/czbooks-marvel-array-master/catalog.json
            out/czbooks-marvel-array-master/summary.md
          if-no-files-found: warn
          retention-days: 14
