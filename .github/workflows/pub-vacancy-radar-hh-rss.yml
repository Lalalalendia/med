name: PUB vacancy radar HH RSS

on:
  push:
    branches:
      - main
      - feature/pub-market-hh-rss-discovery
    paths:
      - "tools/pub-market/hh_rss_discovery.py"
      - "tools/pub-market/test_hh_rss_discovery.py"
      - ".github/workflows/pub-vacancy-radar-hh-rss.yml"
  pull_request:
    paths:
      - "tools/pub-market/hh_rss_discovery.py"
      - "tools/pub-market/test_hh_rss_discovery.py"
      - ".github/workflows/pub-vacancy-radar-hh-rss.yml"
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: RSS discovery contract tests
        run: python tools/pub-market/test_hh_rss_discovery.py

  scan:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/feature/pub-market-hh-rss-discovery')
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Discover Russian Publisher candidates through HH RSS
        run: |
          python tools/pub-market/hh_rss_discovery.py \
            --area 113 \
            --output-dir out/pub-market-hh-rss

      - name: Add discovery report to job summary
        run: cat out/pub-market-hh-rss/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload RSS discovery artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pub-vacancy-radar-hh-rss-${{ github.run_id }}
          path: out/pub-market-hh-rss/**
          if-no-files-found: error
          retention-days: 30
