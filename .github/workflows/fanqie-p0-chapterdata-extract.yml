name: Fanqie P0 chapterData extract
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fanqie-p0-chapterdata-extract.yml"
permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Extract chapterData payloads
        run: |
          set -euo pipefail
          mkdir -p tools/novel-ingest
          python - <<'PY'
          import json,re,html as htmllib,subprocess
          from pathlib import Path

          samples=[
            ("仙界基建",122,"7629306266275283481","修仙界第一通电话"),
            ("程序员仙门基建",120,"7602510590015177278","仙网1.0测试版上线"),
          ]

          def fetch(url):
              p=subprocess.run([
                "curl","--compressed","--location","--silent","--show-error",
                "--connect-timeout","10","--max-time","30","--retry","3",
                "--user-agent","Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36",
                url
              ],capture_output=True,text=True,check=True)
              return p.stdout

          def longest_cjk_strings(s):
              vals=[]
              for m in re.finditer(r'"([^"\\]*(?:\\.[^"\\]*)*)"',s):
                  raw=m.group(1)
                  try:
                      v=json.loads('"'+raw+'"')
                  except Exception:
                      continue
                  cjk=len(re.findall(r'[\u3400-\u9fff]',v))
                  if cjk>=20:
                      vals.append((cjk,len(v),v))
              vals.sort(reverse=True)
              return vals[:12]

          out=[]
          for book,ch,rid,title in samples:
              src=fetch(f"https://fanqienovel.com/reader/{rid}")
              idx=src.find("chapterData")
              window=src[max(0,idx-2000):idx+200000] if idx>=0 else src
              vals=longest_cjk_strings(window)
              rec={
                "book":book,"chapter":ch,"reader_id":rid,
                "chapterData_index":idx,
                "candidate_strings":[
                  {"cjk":a,"chars":b,"prefix":c[:240]} for a,b,c in vals
                ]
              }
              out.append(rec)
          path=Path("tools/novel-ingest/fanqie-p0-chapterdata-report.json")
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Commit report
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/novel-ingest/fanqie-p0-chapterdata-report.json
          git diff --cached --quiet && exit 0
          git commit -m "Inspect Fanqie P0 chapterData payloads"
          git push
