name: Ahintek B - offline simulation

on:
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test workload'
        required: true
        default: standard
        type: choice
        options:
          - smoke
          - standard
          - stress
          - paired
      seed:
        description: 'Deterministic random seed'
        required: true
        default: '20261121'
        type: string
  pull_request:
    paths:
      - 'tools/ahintech_sim/**'
      - '.github/workflows/ahintech-b-offline-simulation.yml'

permissions:
  contents: read

concurrency:
  group: ahintek-b-sim-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-compare:
    name: Validate simulator and compare solutions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check independent simulator and exact oracle
        run: python3 -m unittest discover -s tools/ahintech_sim/tests -v
      - name: Generate reproducible cases
        env:
          SUITE: ${{ github.event_name == 'workflow_dispatch' && inputs.suite || 'smoke' }}
          SEED: ${{ github.event_name == 'workflow_dispatch' && inputs.seed || '20261121' }}
        run: |
          python3 tools/ahintech_sim/generator.py --suite "$SUITE" --seed "$SEED" --out /tmp/ahintech_cases
      - name: Compile, run and independently validate contestants
        run: |
          python3 tools/ahintech_sim/bench.py \
            --cases /tmp/ahintech_cases \
            --out /tmp/ahintech_results \
            --time-limit-ms 2000 --memory-mb 256 --oracle --reachability-bound \
            --solver v12=tools/ahintech_sim/solvers/v12_cache.cpp \
            --solver v21=tools/ahintech_sim/solvers/v21_p0.cpp \
            --solver v24=tools/ahintech_sim/solvers/v24_reachable.cpp
      - name: Publish summary to GitHub Actions
        if: always()
        run: |
          if [ -f /tmp/ahintech_results/report.md ]; then
            cat /tmp/ahintech_results/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save inputs, scores, and failing outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ahintek-b-simulator-${{ github.run_id }}
          path: |
            /tmp/ahintech_cases
            /tmp/ahintech_results/results.json
            /tmp/ahintech_results/results.csv
            /tmp/ahintech_results/summary.json
            /tmp/ahintech_results/report.md
            /tmp/ahintech_results/failures
          if-no-files-found: warn
          retention-days: 30
