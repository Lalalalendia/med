name: Probe Hongyushu Gotham source

on:
  push:
    paths:
      - ".github/workflows/hongyushu-gotham-probe.yml"
      - "tools/hongyushu/probe_gotham.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/hongyushu/probe_gotham.py
