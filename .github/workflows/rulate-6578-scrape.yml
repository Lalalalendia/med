name: Rulate 6578 scrape

on:
  push:
    paths:
      - '.github/workflows/rulate-6578-scrape.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: python -m pip install --quiet requests beautifulsoup4
      - name: Scrape via Wayback
        run: |
          python - <<'PY'
          import csv, html, re, requests, time
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse

          S=requests.Session()
          S.headers.update({"User-Agent":"Mozilla/5.0"})
          cdx='https://web.archive.org/cdx/search/cdx'
          params={
              'url':'tl.rulate.ru/users/6578*',
              'output':'json',
              'filter':['statuscode:200','mimetype:text/html'],
              'fl':'timestamp,original,statuscode,digest',
              'collapse':'digest',
              'limit':'1000',
              'from':'2025',
          }
          r=S.get(cdx,params=params,timeout=60)
          print('CDX',r.status_code,len(r.text),r.url)
          print(r.text[:3000])
          r.raise_for_status()
          data=r.json()
          rows=data[1:] if data and isinstance(data[0],list) else []
          print('CDX ROWS',len(rows))

          snaps={}
          for ts,orig,*rest in rows:
              if '/users/6578' not in orig:
                  continue
              m=re.search(r'GroupMember_page=(\d+)',orig)
              if '/books' in orig and not m:
                  page=1
              elif m:
                  page=int(m.group(1))
              elif orig.rstrip('/').endswith('/users/6578'):
                  page=1
              else:
                  continue
              if page not in snaps or ts>snaps[page][0]:
                  snaps[page]=(ts,orig)

          print('PAGES',snaps)
          books={}

          def clean(label):
              label=html.unescape(re.sub(r'\s+',' ',label)).strip()
              label=re.sub(r'\s*\(создатель\)\s*$','',label,flags=re.I).strip()
              if ' / ' in label:
                  label=label.rsplit(' / ',1)[-1].strip()
              return label

          for page,(ts,orig) in sorted(snaps.items()):
              u=f'https://web.archive.org/web/{ts}id_/{orig}'
              q=S.get(u,timeout=60)
              print('SNAP',page,q.status_code,len(q.text),u)
              if q.status_code!=200:
                  continue
              soup=BeautifulSoup(q.text,'html.parser')
              found={}
              for a in soup.find_all('a',href=True):
                  href=urljoin(orig,a.get('href',''))
                  m=re.search(r'https?://tl\.rulate\.ru/book/(\d+)(?:/)?(?:$|[?#])',href)
                  if not m:
                      m=re.search(r'/book/(\d+)(?:/)?(?:$|[?#])',a.get('href',''))
                  if not m:
                      continue
                  bid=int(m.group(1))
                  label=' '.join(a.stripped_strings).strip()
                  title=clean(label)
                  if not title or title.lower() in {'читать','подробнее','оглавление','переводчики','блог','анонсы'}:
                      continue
                  if len(title)>len(found.get(bid,'')):
                      found[bid]=title
              before=len(books)
              books.update(found)
              print('PAGE',page,'found',len(found),'added',len(books)-before,'total',len(books))
              time.sleep(1)

          out='rulate-6578-books.csv'
          final=sorted((bid,title,f'https://tl.rulate.ru/book/{bid}') for bid,title in books.items())
          with open(out,'w',encoding='utf-8-sig',newline='') as f:
              w=csv.writer(f); w.writerow(['ID','Название','Ссылка']); w.writerows(final)
          print('FINAL',len(final))
          print('SAMPLE',final[:10],final[-10:])
          if len(final)<200:
              raise SystemExit(f'Wayback incomplete: {len(final)}')
          PY
      - name: Commit scraped list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rulate-6578-books.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Rulate user 6578 book list"
            git push
          fi
