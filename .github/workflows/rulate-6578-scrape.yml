name: Rulate 6578 scrape

on:
  push:
    paths:
      - '.github/workflows/rulate-6578-scrape.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install scraper deps
        run: python -m pip install --quiet requests beautifulsoup4

      - name: Scrape Atarax book list
        run: |
          python - <<'PY'
          import csv
          import html
          import re
          from urllib.parse import urljoin, urlparse

          import requests
          from bs4 import BeautifulSoup

          USER_ID = 6578
          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                            "(KHTML, like Gecko) Chrome/124.0 Safari/537.36",
              "Accept-Language": "ru-RU,ru;q=0.9,en;q=0.8",
          })

          def parse_page(url):
              r = session.get(url, timeout=40)
              print("GET", url, r.status_code, len(r.text))
              r.raise_for_status()
              soup = BeautifulSoup(r.text, "html.parser")
              text = soup.get_text(" ", strip=True)
              em = re.search(r"Участвует\s+в\s+(\d+)\s+перевод", text)
              expected = int(em.group(1)) if em else None

              by_id = {}
              for a in soup.find_all("a", href=True):
                  href = urljoin(url, a.get("href", ""))
                  path = urlparse(href).path.rstrip("/")
                  m = re.fullmatch(r"/book/(\d+)", path)
                  if not m:
                      continue
                  book_id = int(m.group(1))
                  label = " ".join(a.stripped_strings).strip()
                  if not label:
                      continue
                  low = label.lower()
                  if low in {"оглавление", "переводчики", "блог", "анонсы", "читать", "подробнее"}:
                      continue
                  old = by_id.get(book_id, "")
                  # Title anchors are normally the longest meaningful label for a book id.
                  if (" / " in label, len(label)) > (" / " in old, len(old)):
                      by_id[book_id] = label
              return expected, by_id

          books = {}
          expected = None
          empty_streak = 0

          for page in range(1, 31):
              candidates = [
                  f"https://tl.rulate.ru/users/{USER_ID}/books?GroupMember_page={page}",
                  f"https://tl.rulate.ru/users/{USER_ID}?GroupMember_page={page}",
              ]
              best_expected = None
              best = {}
              last_error = None
              for url in candidates:
                  try:
                      exp, found = parse_page(url)
                  except Exception as e:
                      last_error = e
                      continue
                  if len(found) > len(best):
                      best_expected, best = exp, found
              if not best and last_error:
                  print("page failed:", page, repr(last_error))
              if best_expected:
                  expected = max(expected or 0, best_expected)

              before = len(books)
              books.update(best)
              added = len(books) - before
              print(f"PAGE {page}: anchors={len(best)}, added={added}, total={len(books)}, expected={expected}")

              if added == 0:
                  empty_streak += 1
              else:
                  empty_streak = 0

              if expected and len(books) >= expected:
                  break
              if page >= 2 and empty_streak >= 2:
                  break

          def ru_title(label):
              label = html.unescape(re.sub(r"\s+", " ", label)).strip()
              if " / " in label:
                  label = label.rsplit(" / ", 1)[-1].strip()
              label = re.sub(r"\s*\(создатель\)\s*$", "", label, flags=re.I).strip()
              return label

          rows = []
          for book_id, label in books.items():
              rows.append((book_id, ru_title(label), f"https://tl.rulate.ru/book/{book_id}"))
          rows.sort(key=lambda x: x[0])

          out = "rulate-6578-books.csv"
          with open(out, "w", encoding="utf-8-sig", newline="") as f:
              w = csv.writer(f)
              w.writerow(["id", "Название", "Ссылка"])
              w.writerows(rows)

          print("FINAL", len(rows), "expected", expected)
          print("MIN/MAX", rows[0][0] if rows else None, rows[-1][0] if rows else None)

          if expected and len(rows) != expected:
              raise SystemExit(f"Expected {expected} books, scraped {len(rows)}")
          if len(rows) < 200:
              raise SystemExit(f"Suspiciously low count: {len(rows)}")
          PY

      - name: Commit scraped list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rulate-6578-books.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Rulate user 6578 book list"
            git push
          fi
