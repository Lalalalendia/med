name: Rulate 6578 scrape

on:
  push:
    paths:
      - '.github/workflows/rulate-6578-scrape.yml'

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deps
        run: python -m pip install --quiet requests

      - name: Scrape Atarax list through Jina Reader
        run: |
          python - <<'PY'
          import csv
          import html
          import re
          import time
          import requests
          from urllib.parse import urlparse

          USER_ID = 6578
          S = requests.Session()
          S.headers.update({
              "User-Agent": "Mozilla/5.0",
              "X-Engine": "cf-browser-rendering",
              "X-No-Cache": "true",
              "X-Timeout": "30",
          })

          books = {}
          expected = None
          empty = 0

          def clean_title(label):
              label = html.unescape(re.sub(r"\s+", " ", label)).strip()
              label = re.sub(r"\s*\(создатель\)\s*$", "", label, flags=re.I).strip()
              if " / " in label:
                  label = label.rsplit(" / ", 1)[-1].strip()
              return label.strip(" -*")

          for page in range(1, 16):
              target = f"https://tl.rulate.ru/users/{USER_ID}"
              if page > 1:
                  target += f"?GroupMember_page={page}"
              url = "https://r.jina.ai/" + target
              r = S.get(url, timeout=90)
              print("GET", page, r.status_code, len(r.text), url)
              if r.status_code != 200:
                  print(r.text[:1500])
                  time.sleep(4)
                  continue
              text = r.text
              if page == 1:
                  print("PAGE1_HEAD", text[:2000].replace("\n", " | "))
              m = re.search(r"Участвует\s+в\s+(\d+)\s+перевод", text)
              if m:
                  expected = int(m.group(1))
              found = {}
              # Markdown links produced by Reader.
              for mm in re.finditer(r"\[([^\]]+)\]\((https?://tl\.rulate\.ru/book/(\d+)(?:/)?(?:\?[^)]*)?)\)", text):
                  label, href, sid = mm.groups()
                  bid = int(sid)
                  if "/ready_new" in href or "/members" in href or "/announces" in href:
                      continue
                  title = clean_title(label)
                  if not title or title.lower() in {"читать", "подробнее", "оглавление", "переводчики", "блог", "анонсы"}:
                      continue
                  old = found.get(bid, "")
                  if len(title) > len(old):
                      found[bid] = title

              # Fallback: Reader sometimes keeps relative links.
              for mm in re.finditer(r"\[([^\]]+)\]\(/book/(\d+)(?:/)?\)", text):
                  label, sid = mm.groups()
                  bid = int(sid)
                  title = clean_title(label)
                  if title and len(title) > len(found.get(bid, "")):
                      found[bid] = title

              before = len(books)
              books.update(found)
              added = len(books) - before
              print("PAGE", page, "found", len(found), "added", added, "total", len(books), "expected", expected)

              if added == 0:
                  empty += 1
              else:
                  empty = 0
              if expected and len(books) >= expected:
                  break
              if page >= 10 and empty >= 2:
                  break
              time.sleep(4)

          rows = [(bid, title, f"https://tl.rulate.ru/book/{bid}") for bid, title in books.items()]
          rows.sort(key=lambda x: x[0])

          with open("rulate-6578-books.csv", "w", encoding="utf-8-sig", newline="") as f:
              w = csv.writer(f)
              w.writerow(["ID", "Название", "Ссылка"])
              w.writerows(rows)

          print("FINAL", len(rows), "expected", expected)
          if rows:
              print("MIN/MAX", rows[0][0], rows[-1][0])
              print("SAMPLE", rows[:5], rows[-5:])

          # Keep the result even if count is slightly stale, but fail if obviously broken.
          if len(rows) < 200:
              raise SystemExit(f"Suspiciously low count: {len(rows)}")
          PY

      - name: Commit scraped list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rulate-6578-books.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Rulate user 6578 book list"
            git push
          fi
