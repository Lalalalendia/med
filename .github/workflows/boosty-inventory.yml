name: Boosty public inventory discovery
on:
  pull_request:
    paths:
      - '.github/workflows/boosty-inventory.yml'
      - 'tools/boosty-inventory/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Diagnose public HTML and navigation only
        run: python tools/boosty-inventory/discover.py
      - name: Check public metadata pagination when robots permit
        run: python tools/boosty-inventory/probe_api.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boosty-discovery
          path: out/boosty-discovery
          retention-days: 10
