name: Slime - reproducible conservative clean candidate
on:
  push:
    branches:
      - feat/slime-true-immortal-220-545-20261119
    paths:
      - tools/novel-ingest/slime_clean_candidate.py
      - tools/novel-ingest/test_slime_clean_candidate.py
      - .github/workflows/slime-clean-candidate.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest tools/novel-ingest/test_slime_archive_quality.py -v
      - run: python -m unittest tools/novel-ingest/test_slime_clean_candidate.py -v
