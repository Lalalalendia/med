name: Tongren 3233353 source structure probe
on:
  pull_request:
    paths:
      - ".github/workflows/tongren-3233353.yml"
      - "tools/novel-ingest/tongren_3233353_probe.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate probe syntax
        run: python -m py_compile tools/novel-ingest/tongren_3233353_probe.py
      - name: Inspect catalog and chapter pagination without writing RAW
        run: python -u tools/novel-ingest/tongren_3233353_probe.py
