name: Probe witch 69shuba tail

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/witch-corpus-parallel.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Fetch directory and latest chapter
        run: |
          set -euo pipefail
          mkdir -p out
          for url in "https://www.69shuba.com/book/89395.htm" "https://www.69shuba.com/book/89395/"; do
            echo "=== $url ==="
            curl --compressed --location --silent --show-error --retry 3 \
              --user-agent "Mozilla/5.0" "$url" -o out/page.html || true
            wc -c out/page.html || true
            python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.href=None; self.text=[]; self.rows=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=="a":
                      self.href=dict(attrs).get("href"); self.text=[]
              def handle_data(self,data):
                  if self.href is not None:self.text.append(data)
              def handle_endtag(self,tag):
                  if tag.lower()=="a" and self.href is not None:
                      if "/txt/89395/" in self.href:
                          self.rows.append((urljoin("https://www.69shuba.com/",self.href),"".join(self.text).strip()))
                      self.href=None;self.text=[]

          s=Path("out/page.html").read_text(encoding="utf-8",errors="replace")
          p=P();p.feed(s)
          print("chapter_links",len(p.rows))
          for row in p.rows[-15:]:print(row)
          PY
          done

          curl --compressed --fail --location --retry 3 \
            --user-agent "Mozilla/5.0" \
            "https://www.69shuba.com/txt/89395/40940814" \
            -o out/latest.html
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json

          s=Path("out/latest.html").read_text(encoding="utf-8",errors="replace")
          print("latest_bytes",len(s))
          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]; self.h1=[]; self.in_h1=False; self.data={}
              def handle_starttag(self,tag,attrs):
                  tag=tag.lower(); d=dict(attrs)
                  self.stack.append((tag,d))
                  if tag=="h1":self.in_h1=True
                  if tag in ("div","article","main","section"):
                      ident=d.get("id","");cls=d.get("class","")
                      if ident or cls:self.data.setdefault((tag,ident,cls),[])
              def handle_data(self,x):
                  if self.in_h1:self.h1.append(x)
                  for tag,d in self.stack:
                      k=(tag,d.get("id",""),d.get("class",""))
                      if k in self.data:self.data[k].append(x)
              def handle_endtag(self,tag):
                  tag=tag.lower()
                  if tag=="h1":self.in_h1=False
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i][0]==tag:
                          self.stack=self.stack[:i];break
          p=P();p.feed(s)
          print("h1","".join(p.h1).strip())
          ranked=[]
          for k,v in p.data.items():
              text="".join(v).strip()
              if len(text)>300:ranked.append((len(text),k,text[:160].replace("\n"," ")))
          ranked.sort(reverse=True)
          print(json.dumps(ranked[:20],ensure_ascii=False,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: witch-69shuba-probe
          path: out/
          retention-days: 1
