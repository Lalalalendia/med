name: Never Decrypt 184 chapter personal copy (one-shot)

on:
  push:
    branches:
      - collect/never-decrypt-184-20261016
    paths:
      - .github/workflows/never-decrypt-184-once.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing scraper dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Existing ingestion regression tests
        run: python -m unittest discover -s tools/novel-ingest -p test_source_ingest.py -v
      - name: Collect Chinese chapters 1 through 184 using existing ingest
        run: |
          python tools/novel-ingest/source_ingest.py \
            --source uukanshu \
            --book-url https://uukanshu.cc/book/4618/ \
            --book-key never-decrypt \
            --start 1 --end 184 --delay 3 \
            --min-chars 400 --out-dir out/novel-source \
            --notion-book-url https://app.notion.com/p/3fa32a84beec81a5a9b0ed615548ff92
      - name: Validate receipts and assemble ZIP only for a complete corpus
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          root = Path("out/novel-source")
          manifest = json.loads((root/"manifest.json").read_text(encoding="utf-8"))
          rows = manifest["chapters"]
          assert manifest["source"] == "uukanshu"
          assert manifest["book_id"] == "4618"
          assert manifest["catalog_count"] == 184, manifest["catalog_count"]
          assert manifest["catalog_gaps"] == [], manifest["catalog_gaps"]
          assert manifest["status"] == "PASS", manifest["status"]
          assert manifest["ok_count"] == 184 and manifest["failed_count"] == 0
          assert [r["ordinal"] for r in rows] == list(range(1,185))
          assert len(set(r["sha256"] for r in rows)) == 184
          for r in rows:
              content = (root/r["raw_file"]).read_bytes()
              assert hashlib.sha256(content).hexdigest() == r["sha256"], r["ordinal"]
          assert (root/"combined.txt").is_file()
          assert len((root/"combined.txt").read_text(encoding="utf-8")) > 100000
          out = Path("final/never-decrypt-184.zip")
          out.parent.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED, compresslevel=8) as z:
              for path in sorted(root.rglob("*")):
                  if path.is_file():
                      z.write(path, path.relative_to(root))
          print("VERIFIED: 184/184 chapter files, 0 gaps, 0 duplicate hashes")
          print("Final personal ZIP bytes:", out.stat().st_size)
          PY
      - name: Save report without story text in step summary
        if: always()
        run: |
          if test -f out/novel-source/summary.md; then
            cat out/novel-source/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload chapter archive and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: never-decrypt-184-${{ github.run_id }}
          path: |
            final/never-decrypt-184.zip
            out/novel-source/manifest.json
            out/novel-source/summary.md
            out/novel-source/handoff.json
          if-no-files-found: warn
          retention-days: 7
