name: Faloo public reviews - manual

on:
  workflow_dispatch:
    inputs:
      book_id:
        description: "Faloo book ID"
        required: true
        default: "1046066"
  push:
    branches:
      - main
    paths:
      - ".github/triggers/faloo-reviews-threads-1046066.txt"

permissions:
  contents: read

jobs:
  fetch-reviews:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch public review pages
        env:
          BOOK_ID: ${{ inputs.book_id || '1046066' }}
        run: |
          python tools/faloo-reviews/fetch_public_reviews.py \
            --book-id "$BOOK_ID" \
            --out-dir out/faloo-reviews
      - name: Summary
        if: always()
        run: |
          if [ -f out/faloo-reviews/summary.md ]; then
            cat out/faloo-reviews/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: faloo-reviews-${{ inputs.book_id || '1046066' }}
          path: out/faloo-reviews/**
          if-no-files-found: warn
          retention-days: 7
