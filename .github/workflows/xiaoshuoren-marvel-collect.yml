name: Xiaoshuoren Marvel - verified RAW collection
on:
  pull_request:
    paths:
      - "tools/novel-ingest/xiaoshuoren_marvel.py"
      - ".github/workflows/xiaoshuoren-marvel-collect.yml"
  push:
    branches:
      - "collect/xiaoshuoren-marvel-20261121"
    paths:
      - "tools/novel-ingest/xiaoshuoren_marvel.py"
      - ".github/workflows/xiaoshuoren-marvel-collect.yml"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of chapters (0 = full book)"
        required: true
        default: "0"
        type: string
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install requirements
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Syntax and fixture checks
        run: |
          python -m py_compile tools/novel-ingest/xiaoshuoren_marvel.py
          python tools/novel-ingest/xiaoshuoren_marvel.py --self-test
      - name: Collect user-authorized Chinese novel
        id: collect
        env:
          REQUESTED_LIMIT: ${{ inputs.limit }}
        run: |
          set -euo pipefail
          if [ -z "${REQUESTED_LIMIT:-}" ]; then
            REQUESTED_LIMIT=0
          fi
          python tools/novel-ingest/xiaoshuoren_marvel.py --limit "$REQUESTED_LIMIT" --delay 0.8 --output out/xiaoshuoren-marvel
      - name: Publish report
        if: always()
        run: |
          if [ -f out/xiaoshuoren-marvel/summary.md ]; then
            cat out/xiaoshuoren-marvel/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload chapter texts and verification manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaoshuoren-marvel-${{ github.run_id }}
          path: |
            out/xiaoshuoren-marvel/**
            out/xiaoshuoren-marvel-*.zip
          retention-days: 14
          if-no-files-found: warn
