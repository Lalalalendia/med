name: Xiaoshuoren alternate-source metadata probe
on:
  push:
    branches: ["collect/xiaoshuoren-marvel-20261121"]
    paths: [".github/workflows/xiaoshuoren-pagination-probe.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Diagnose public mirrors without downloading entire works
        run: |
          python - <<'PY'
          import requests,re
          from bs4 import BeautifulSoup
          urls = [
            "https://www.txtpai.com/126/126855/353552.html",
            "https://www.lmshu.com/daizhezhanshimobanhunmanwei/353552/",
            "https://www.17177.cc/daizhezhanshimobanhunmanwei/353552/",
            "https://www.69shuba.com/tag/%E6%88%98%E5%A3%AB/2/",
            "https://czbooks.net/n/up9ac"
          ]
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0","Accept-Language":"zh-CN,zh;q=0.9"})
          for url in urls:
              try:
                  r=s.get(url,timeout=20)
                  r.encoding = r.apparent_encoding or 'utf-8'
                  soup=BeautifulSoup(r.text,'html.parser')
                  title=soup.title.get_text(" ",strip=True) if soup.title else ''
                  nodes=[soup.select_one('article.font_max'),soup.select_one('article'),soup.select_one('#content'),soup.select_one('.content')]
                  nodes=[x for x in nodes if x]
                  big=max(nodes,key=lambda e:len(e.get_text(" ",strip=True))) if nodes else None
                  body=big.get_text(" ",strip=True) if big else ''
                  print("PROBE",r.status_code,r.url,"HTML",len(r.text),"TITLE",title[:80],"BODY",len(body),"SNIP",body[:80],flush=True)
                  if '69shuba.com' in url or 'czbooks.net' in url:
                      candidates=[(a.get_text(" ",strip=True),a.get('href','')) for a in soup.select("a[href]") if ('带着战士模板混漫威' in a.get_text(" ",strip=True) or '人形无限手套' in a.get_text(" ",strip=True) or '被打击' in a.get_text(" ",strip=True) or '人形無限手套' in a.get_text(" ",strip=True) or '被打擊' in a.get_text(" ",strip=True))]
                      print("LINKS",candidates[:20],flush=True)
                      print("ALL_LINKS",len(soup.select('a[href]')),flush=True)
              except Exception as e:
                  print("ERROR",url,str(e)[:200],flush=True)
          PY
