name: Slime True Immortal - collect verified CN 220-544
# Manual full recollection only. Use the targeted continuation job for 450–544.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    name: Collect CN ${{ matrix.start }}-${{ matrix.end }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 220, end: 299}
          - {start: 300, end: 379}
          - {start: 380, end: 459}
          - {start: 460, end: 544}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Collector unit tests
        run: python -m unittest tools/novel-ingest/test_slime_true_immortal.py -v
      - name: Collect from permitted public sources
        id: ingest
        continue-on-error: true
        shell: bash
        env:
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          python -u tools/novel-ingest/slime_true_immortal.py collect \
            --rights-confirmed --start "$START" --end "$END" \
            --delay 1.2 --min-chars 2500 --out out/slime-"$START"-"$END"
      - name: Publish verified RAW and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: slime-v2-cn-${{ matrix.start }}-${{ matrix.end }}
          path: out/slime-${{ matrix.start }}-${{ matrix.end }}/
          if-no-files-found: warn
          retention-days: 7
      - name: Report incomplete shard
        if: steps.ingest.outcome != 'success'
        run: exit 1
  merge:
    name: Merge all verified shards; show missing
    if: always()
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - uses: actions/download-artifact@v4
        with:
          pattern: slime-v2-cn-*
          path: out/shards
      - name: Merge and verify full sequence
        id: merge
        continue-on-error: true
        run: |
          python -u tools/novel-ingest/slime_true_immortal.py merge \
            --rights-confirmed --inputs out/shards --out out/merged
      - name: Summary
        if: always()
        run: |
          if [ -f out/merged/summary.md ]; then
            cat out/merged/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slime-v2-cn-220-544-combined
          path: out/merged/
          if-no-files-found: warn
          retention-days: 7
      - name: Reject incomplete collection
        if: steps.merge.outcome != 'success'
        run: exit 1
