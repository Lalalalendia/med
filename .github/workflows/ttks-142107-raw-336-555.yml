name: TTKS 142107 RAW 336-555

on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/novel-ingest/ttks_142107.py
      - tools/novel-ingest/test_ttks_142107.py
      - .github/workflows/ttks-142107-raw-336-555.yml

permissions:
  contents: read

concurrency:
  group: ttks-142107-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m unittest discover -s tools/novel-ingest -p test_ttks_142107.py -v

  chapters:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {start: 336, end: 365}
          - {start: 366, end: 395}
          - {start: 396, end: 425}
          - {start: 426, end: 455}
          - {start: 456, end: 485}
          - {start: 486, end: 515}
          - {start: 516, end: 545}
          - {start: 546, end: 555}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Acquire and validate public chapter text
        id: acquire
        continue-on-error: true
        run: >-
          python tools/novel-ingest/ttks_142107.py fetch
          --start ${{ matrix.start }} --end ${{ matrix.end }}
          --delay 1.5 --out-dir out/ttks-shard
      - name: Receipt
        if: always()
        run: |
          if [ -f out/ttks-shard/summary.md ]; then
            cat out/ttks-shard/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload shard and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-raw-${{ matrix.start }}-${{ matrix.end }}
          path: out/ttks-shard/**
          if-no-files-found: warn
          retention-days: 7
      - name: Gate incomplete chapters
        if: steps.acquire.outcome != 'success'
        run: exit 1

  assemble:
    if: always() && needs.tests.result == 'success'
    needs: [tests, chapters]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - uses: actions/download-artifact@v4
        with:
          pattern: dao-raw-*
          path: out/shards
      - name: Verify all 220 chapters, then assemble
        id: assemble
        continue-on-error: true
        run: >-
          python tools/novel-ingest/ttks_142107.py combine
          --in-dir out/shards --out-dir out/complete
          --start 336 --end 555
      - name: Summary
        if: always()
        run: |
          if [ -f out/complete/summary.md ]; then
            cat out/complete/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload combined corpus and manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dao-142107-chapters-336-555
          path: out/complete/**
          if-no-files-found: warn
          retention-days: 7
      - name: Reject incomplete corpus
        if: steps.assemble.outcome != 'success'
        run: exit 1
