name: Verify witch official catalog

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/witch-readnovel-probe.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Fetch all 34 ReadNovel catalog pages
        run: |
          set -euo pipefail
          mkdir -p work/official out
          for n in $(seq 1 34); do
            if [ "$n" = "1" ]; then
              url="https://www.readnovel.com/bqx/qbdykg"
            else
              url="https://www.readnovel.com/bqx/qbdykg/p$n"
            fi
            curl --compressed --fail --location --retry 3 \
              --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36" \
              "$url" -o "work/official/$n.html"
          done
          echo "official_pages=$(find work/official -name '*.html' | wc -l)"

      - name: Parse official catalog and compare Jiangchen
        run: |
          set -euo pipefail
          curl --compressed --fail --location --retry 3 \
            --user-agent "Mozilla/5.0" \
            "https://www.jiangchenxs.com/du_75248/" \
            -o work/jiangchen.html
          python - <<'PY' | tee out/catalog-diff.json
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin
          import json
          import re

          class SectionParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_chapterlist = False
                  self.section_depth = 0
                  self.href = None
                  self.text = []
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  tag = tag.lower()
                  if tag == "section" and "chapterlist" in d.get("class", "").split():
                      self.in_chapterlist = True
                      self.section_depth = 1
                      return
                  if self.in_chapterlist:
                      if tag == "section":
                          self.section_depth += 1
                      elif tag == "a":
                          href = d.get("href")
                          if href and "qidian.com/chapter/" in href:
                              self.href = href
                              self.text = []
              def handle_data(self, data):
                  if self.href is not None:
                      self.text.append(data)
              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if self.in_chapterlist and tag == "a" and self.href is not None:
                      title = "".join(self.text).strip()
                      if title:
                          self.rows.append((self.href, title))
                      self.href = None
                      self.text = []
                  if self.in_chapterlist and tag == "section":
                      self.section_depth -= 1
                      if self.section_depth == 0:
                          self.in_chapterlist = False

          official = []
          for n in range(1, 35):
              html = Path(f"work/official/{n}.html").read_text(
                  encoding="utf-8", errors="replace"
              )
              p = SectionParser()
              p.feed(html)
              print(f"page_{n}_entries={len(p.rows)}")
              official.extend(
                  {"page": n, "url": href, "heading": title}
                  for href, title in p.rows
              )

          class JiangParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_dd = False
                  self.href = None
                  self.text = []
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  if tag == "dd":
                      self.in_dd = True
                  elif tag == "a" and self.in_dd:
                      self.href = dict(attrs).get("href")
                      self.text = []
              def handle_data(self, data):
                  if self.href is not None:
                      self.text.append(data)
              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag == "a" and self.href is not None:
                      self.rows.append((self.href, "".join(self.text).strip()))
                      self.href = None
                      self.text = []
                  elif tag == "dd":
                      self.in_dd = False

          jhtml = Path("work/jiangchen.html").read_text(encoding="utf-8")
          marker = "《魔女大人，请按剧本黑化！》正文"
          main = jhtml.split(marker, 1)[1]
          jp = JiangParser()
          jp.feed(main)
          jiangchen = []
          seen = set()
          for href, title in jp.rows:
              if href and href not in seen:
                  seen.add(href)
                  jiangchen.append({
                      "url": urljoin("https://www.jiangchenxs.com/du_75248/", href),
                      "heading": title,
                  })

          off_titles = [r["heading"] for r in official]
          j_titles = [r["heading"] for r in jiangchen]
          numbered = [t for t in off_titles if re.match(r"^第\s*\d+\s*章", t)]
          non_numbered = [t for t in off_titles if not re.match(r"^第\s*\d+\s*章", t)]
          nums = [
              int(re.match(r"^第\s*(\d+)\s*章", t).group(1))
              for t in numbered
          ]
          missing_nums = [
              n for n in range(1, max(nums) + 1) if n not in set(nums)
          ]
          official_only = [t for t in off_titles if t not in j_titles]
          jiangchen_only = [t for t in j_titles if t not in off_titles]

          positions = []
          for idx, row in enumerate(official, 1):
              if row["heading"] in official_only:
                  positions.append({
                      "official_ordinal": idx,
                      "heading": row["heading"],
                      "url": row["url"],
                      "previous": official[idx - 2]["heading"] if idx > 1 else None,
                      "next": official[idx]["heading"] if idx < len(official) else None,
                  })

          result = {
              "official_total": len(official),
              "official_numbered": len(numbered),
              "official_non_numbered": len(non_numbered),
              "official_max_author_number": max(nums),
              "official_missing_author_numbers": missing_nums,
              "official_non_numbered_headings": non_numbered,
              "jiangchen_total": len(jiangchen),
              "official_only": official_only,
              "official_only_positions": positions,
              "jiangchen_only": jiangchen_only,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))

          assert len(official) == 505, result
          assert len(numbered) == 497, result
          assert len(non_numbered) == 8, result
          assert max(nums) == 497 and not missing_nums, result
          assert len(jiangchen) == 504, result
          assert len(official_only) == 1, result
          PY

      - name: Save official catalog
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.active=False
                  self.depth=0
                  self.href=None
                  self.text=[]
                  self.rows=[]
              def handle_starttag(self, tag, attrs):
                  d=dict(attrs)
                  if tag=="section" and "chapterlist" in d.get("class","").split():
                      self.active=True; self.depth=1; return
                  if self.active:
                      if tag=="section": self.depth+=1
                      elif tag=="a":
                          href=d.get("href")
                          if href and "qidian.com/chapter/" in href:
                              self.href=href; self.text=[]
              def handle_data(self,data):
                  if self.href is not None:self.text.append(data)
              def handle_endtag(self,tag):
                  if self.active and tag=="a" and self.href is not None:
                      self.rows.append({"url":self.href,"heading":"".join(self.text).strip()})
                      self.href=None;self.text=[]
                  if self.active and tag=="section":
                      self.depth-=1
                      if self.depth==0:self.active=False

          rows=[]
          for n in range(1,35):
              p=P()
              p.feed(Path(f"work/official/{n}.html").read_text(encoding="utf-8",errors="replace"))
              for row in p.rows:
                  row["official_ordinal"]=len(rows)+1
                  rows.append(row)
          Path("out/official-catalog.json").write_text(
              json.dumps(rows,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          PY

      - name: Upload catalog verification
        uses: actions/upload-artifact@v4
        with:
          name: witch-official-catalog-verification
          path: |
            out/catalog-diff.json
            out/official-catalog.json
          if-no-files-found: error
          retention-days: 7
