name: Probe witch ReadNovel catalog

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/witch-readnovel-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Fetch official ReadNovel page
        run: |
          set -euo pipefail
          curl --compressed --fail --location --retry 3 \
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/140 Safari/537.36" \
            "https://www.readnovel.com/bqx/qbdykg" \
            -o official.html
          echo "bytes=$(wc -c < official.html)"
          python - <<'PY'
          from pathlib import Path
          import re
          html=Path("official.html").read_text(encoding="utf-8",errors="replace")
          print("numbered_heading_mentions", len(re.findall(r"第\s*\d+\s*章", html)))
          for needle in [
              "505章","上架感言","电脑炸了……请假","请假条",
              "没办法再请天假，顺便说下近况","罪己诏",
              "新书已发，《司教大人深不可测》",
              "群炸了，转至备用群，加群方式见评论区",
              "番外","完结感言","作者的话",
          ]:
              idx=html.find(needle)
              print(f"needle={needle!r} index={idx}")
              if idx >= 0:
                  print(html[max(0,idx-500):idx+1000])
          for pat in [
              r"chapterName",
              r"chapterId",
              r"catalog",
              r"chapterList",
              r"volume",
              r"bookId",
          ]:
              print(pat, len(re.findall(pat, html, flags=re.I)))
          PY

      - name: Upload official page
        uses: actions/upload-artifact@v4
        with:
          name: witch-readnovel-official-page
          path: official.html
          if-no-files-found: error
          retention-days: 1
