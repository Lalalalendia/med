name: Slime - two-page source metadata probe
on:
  push:
    branches:
      - feat/slime-true-immortal-220-545-20261119
    paths:
      - tools/novel-ingest/slime_paginated_source_probe.py
      - tools/novel-ingest/test_slime_paginated_source_probe.py
      - .github/workflows/slime-paginated-source-metadata.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Offline parser and scope tests
        run: python -m unittest tools/novel-ingest/test_slime_paginated_source_probe.py -v
      - name: Public metadata only; never export prose
        run: python -u tools/novel-ingest/slime_paginated_source_probe.py
