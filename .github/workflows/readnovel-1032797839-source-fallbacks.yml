name: Marvel Uzumaki - normal alternate host diagnostic
on:
  push:
    paths: [.github/workflows/readnovel-1032797839-source-fallbacks.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Test only normal public hosts
        run: |
          python - <<'PY'
          import requests,json,re
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          from urllib.robotparser import RobotFileParser
          req=requests.Session()
          req.headers.update({"User-Agent":"AuthorizedBookCensus/1.0","Accept-Language":"zh-CN,zh;q=0.9"})
          targets=[
            "https://69shuba.com/book/9959500.htm",
            "https://69shuba.com/robots.txt",
            "http://www.xbiqiuge.net/robots.txt",
            "http://www.xbiqiuge.net/biquge_143731/",
            "http://xbiqiuge.net/biquge_143731/"
          ]
          records=[]
          for url in targets:
            row={"url":url}
            try:
              r=req.get(url,timeout=20,allow_redirects=False)
              row.update(status=r.status_code,bytes=len(r.content),location=r.headers.get("location"),content_type=r.headers.get("content-type"))
              if "robots.txt" in url:
                row["robots_preview"]=r.text[:700] if r.status_code==200 else ""
              elif r.status_code==200:
                r.encoding=r.apparent_encoding or "utf-8"
                soup=BeautifulSoup(r.text,"html.parser")
                row["title"]=soup.title.get_text(" ",strip=True) if soup.title else ""
                row["chapter_links"]=[{"name":a.get_text(" ",strip=True)[:70],"href":urljoin(url,a["href"])}
                for a in soup.select("a[href]") if re.search(r"第.{1,12}章|尾声|完结",a.get_text(" ",strip=True)) and len(a.get_text(" ",strip=True))<80][:7]
                row["h1"]=[x.get_text(" ",strip=True) for x in soup.select("h1")[:2]]
            except Exception as e:
              row["error"]=repr(e)[:350]
            records.append(row)
          print(json.dumps(records,ensure_ascii=False,indent=2))
          PY
