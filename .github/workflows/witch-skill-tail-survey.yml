name: Witch skill-tree later chapter source survey
on:
  push:
    branches: [collect/wizard-skill-tree-500-tail-20261116]
    paths: [.github/workflows/witch-skill-tail-survey.yml]
permissions:
  contents: read
jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --disable-pip-version-check requests beautifulsoup4
      - name: Survey indexes and sample bodies
        run: |
          python - <<'PY'
          import requests,re,time
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin,urlparse
          names=('巫师：从技能树开始肝经验','巫師：從技能樹開始肝經驗','巫师：我有一棵技能树')
          urls=[
            'https://www.ppwx.net/49/49309/',
            'https://www.cbiquge.com/49/49309/',
            'https://www.xbiquge.info/49/49309/',
            'https://www.wxff.net/zdzdmu/mulu_10.html',
            'https://www.wxff.net/zdzdmu/',
            'https://www.chyntn.com/',
            'https://www.jumeichai.com/',
            'https://www.suduguu.com/2024/',
            'https://www.69shuba.com/'
          ]
          sess=requests.Session()
          sess.headers.update({'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/131.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          known=set()
          def get(url):
            try:
              r=sess.get(url,timeout=18); r.raise_for_status()
              soup=BeautifulSoup(r.content,'html.parser',from_encoding=r.apparent_encoding)
              return soup,r.url,len(r.content)
            except Exception as e:
              print('ERROR',url,repr(e),flush=True)
              return None,url,0
          for url in urls:
            p,link,sz=get(url)
            if not p:continue
            print('INDEX',link,'BYTES',sz,'TITLE',p.title.get_text(' ',strip=True)[:100] if p.title else '',flush=True)
            if 'chyntn.com' in url or 'jumeichai.com' in url:
              a=[(x.get_text(' ',strip=True)[:70],urljoin(link,x.get('href'))) for x in p.select('a[href]') if '巫师：从技能树开始' in x.get_text(' ',strip=True)]
              print('BOOK_LINKS',a[:15],flush=True)
              for _,b in a[:2]:
                if b not in urls and b not in known:known.add(b)
            anchors=[(x.get_text(' ',strip=True),urljoin(link,x['href'])) for x in p.select('a[href]')]
            m=[(t[:75],u) for t,u in anchors if re.search(r'第(?:九百|9[4-9][0-9]|９)',t) and ('章' in t)]
            print('MATCHED_TAIL',len(m),'FIRST',m[:5],'LAST',m[-5:],flush=True)
            pag=[(t[:25],u) for t,u in anchors if re.search(r'((80[1-9]|90[0-9]|1000)|下一页|下一頁|末页|尾页|后100|后100章)',t)]
            print('PAGES',pag[:12],flush=True)
            samples=[(t,u) for t,u in m if re.search(r'(九百四十三|九百八十|九百八十四|943|980|984)',t)]
            if samples:
              for title,href in samples[:2]:
                sp,_,size=get(href)
                if not sp:continue
                candidates=[]
                for sel in ['#content','#chaptercontent','.content','.read-content','#chapter-content','article','main','#nr1','.txtnav']:
                  el=sp.select_one(sel)
                  if el:
                    txt=el.get_text(' ',strip=True)
                    candidates.append((sel,len(txt),txt[:180]))
                print('BODY_SAMPLE',title,href,'SIZE',size,'TITLE',sp.title.get_text(' ',strip=True)[:100] if sp.title else '',candidates[:4],flush=True)
            time.sleep(.5)
          for url in list(known)[:2]:
            p,link,sz=get(url)
            if not p:continue
            print('BOOK_DETAIL',link,'BYTES',sz,'TITLE',p.title.get_text(' ',strip=True)[:100] if p.title else '')
            matching=[(x.get_text(' ',strip=True)[:70],urljoin(link,x['href'])) for x in p.select('a[href]') if re.search('第九百|984|980|943',x.get_text(' ',strip=True)) ]
            print('DETAIL_TAIL',len(matching),matching[:7],matching[-7:],flush=True)
          PY
