name: Marvel Taylor - verified Chinese RAW

on:
  push:
    branches: [book/marvel-taylor-raw-20261026]
    paths:
      - tools/novel-ingest/marvel_taylor_collect.py
      - tools/novel-ingest/test_marvel_taylor_collect.py
      - .github/workflows/marvel-taylor-corpus.yml
      - tools/novel-ingest/marvel_taylor_mirror_probe.py
      - tools/novel-ingest/test_marvel_taylor_mirror_probe.py
  pull_request:
    paths:
      - tools/novel-ingest/marvel_taylor_collect.py
      - tools/novel-ingest/test_marvel_taylor_collect.py
      - .github/workflows/marvel-taylor-corpus.yml
      - tools/novel-ingest/marvel_taylor_mirror_probe.py
      - tools/novel-ingest/test_marvel_taylor_mirror_probe.py
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        required: true
        default: full
        options: [catalog, pilot, full]
      delay_seconds:
        type: number
        required: true
        default: 3

permissions:
  contents: read

concurrency:
  group: marvel-taylor-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m unittest discover -s tools/novel-ingest -p test_marvel_taylor_collect.py -v
  mirror-probe:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m unittest discover -s tools/novel-ingest -p test_marvel_taylor_mirror_probe.py -v
      - name: Probe mirrors (robots-aware; metadata only)
        run: python tools/novel-ingest/marvel_taylor_mirror_probe.py
      - name: Upload public metadata report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marvel-taylor-mirror-probe-${{ github.run_number }}
          path: out/marvel-taylor/mirror-probe.json
          if-no-files-found: warn
          retention-days: 7
  collect:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch verified public chapters
        id: fetch
        continue-on-error: true
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_MODE: ${{ inputs.mode }}
          REQUESTED_DELAY: ${{ inputs.delay_seconds }}
        run: |
          set -euo pipefail
          mode=full
          delay=3
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            mode="$REQUESTED_MODE"
            delay="$REQUESTED_DELAY"
          fi
          args=(--out-dir out/marvel-taylor --expected 318 --delay "$delay")
          case "$mode" in
            catalog) args+=(--catalog-only) ;;
            pilot) args+=(--start 1 --end 5) ;;
            full) args+=(--start 1 --end 318) ;;
            *) echo "Invalid mode" >&2; exit 2 ;;
          esac
          python tools/novel-ingest/marvel_taylor_collect.py "${args[@]}"
      - name: Metadata-only summary
        if: always()
        shell: bash
        run: |
          if [[ -f out/marvel-taylor/summary.md ]]; then
            cat out/marvel-taylor/summary.md >> "$GITHUB_STEP_SUMMARY"
          elif [[ -f out/marvel-taylor/manifest.json ]]; then
            python -c 'import json; d=json.load(open("out/marvel-taylor/manifest.json")); print(d["status"], d["catalog_count"], d["catalog_error"])'
          fi
      - name: Upload temporary RAW artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marvel-taylor-zh-raw-${{ github.run_number }}
          path: out/marvel-taylor/
          if-no-files-found: warn
          retention-days: 1
      - name: Fail on incomplete collection
        if: steps.fetch.outcome != 'success'
        run: exit 1
