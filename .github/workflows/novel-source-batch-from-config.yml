name: Novel verified RAW batch from config

on:
  pull_request:
    paths:
      - '.github/novel-batches/aura-farming.json'
      - '.github/workflows/novel-source-batch-from-config.yml'
      - 'tools/novel-ingest/source_ingest.py'
      - 'tools/novel-ingest/test_source_ingest.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fetch dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Regression tests
        run: python -m unittest discover -s tools/novel-ingest -p test_source_ingest.py -v
      - name: Fetch public numbered story chapter batch
        id: ingest
        run: |
          python - <<'PY'
          import json
          import subprocess
          import sys
          from pathlib import Path

          config = json.loads(Path(".github/novel-batches/aura-farming.json").read_text(encoding="utf-8"))
          start, end = int(config["start"]), int(config["end"])
          if not 1 <= start <= end or end - start + 1 > 30:
              raise SystemExit("Unsafe range")
          cmd = [
              sys.executable, "tools/novel-ingest/source_ingest.py",
              "--source", config["source"], "--book-url", config["book_url"],
              "--book-key", config["book_key"],
              "--start", str(start), "--end", str(end),
              "--delay", str(config.get("delay", 1.5)),
              "--min-chars", str(config.get("min_chars", 400)),
              "--rulate-url", config.get("rulate_url", ""),
              "--notion-book-url", config.get("notion_book_url", ""),
              "--out-dir", "out/novel-source",
          ]
          raise SystemExit(subprocess.call(cmd))
          PY
      - name: Read batch receipt
        if: always()
        run: |
          if [ -f out/novel-source/summary.md ]; then
            cat out/novel-source/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/novel-source/manifest.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("out/novel-source/manifest.json").read_text(encoding="utf-8"))
          print("STATUS:", data["status"], "CATALOG:", data["catalog_count"], "GAPS:", data["catalog_gaps"])
          for row in data["chapters"]:
              print("CHAPTER", row["ordinal"], row["status"], row.get("chars"), row.get("sha256"), row.get("error", ""))
          PY
          fi
      - name: Archive verified RAW and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel-raw-source-batch
          path: out/novel-source/**
          if-no-files-found: warn
          retention-days: 7
