name: Rulate title mapper
on:
  push:
    paths:
      - '.github/workflows/rulate-title-map.yml'
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - run: python scripts/rulate_title_map.py
      - name: Commit map
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rulate-title-map.csv
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Map Atarax titles to Rulate links"
            git push
          fi
