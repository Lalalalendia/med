name: FIPI OGE chemistry 46 selected qids

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum number of selected qids (1-46)"
        required: false
        default: "46"
  push:
    branches:
      - feat/fipi-oge-chemistry-46-20261119
    paths:
      - "tools/fipi_oge_chemistry_46.py"
      - ".github/workflows/fipi-oge-chemistry-46.yml"

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Collect exactly selected FIPI OGE chemistry qids
        shell: bash
        env:
          TASK_LIMIT: ${{ github.event.inputs.limit || '46' }}
        run: |
          python tools/fipi_oge_chemistry_46.py --out artifacts/fipi-oge-chemistry-46 --limit "$TASK_LIMIT"
      - name: Upload result and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fipi-oge-chemistry-46
          path: artifacts/fipi-oge-chemistry-46/
          if-no-files-found: warn
          retention-days: 30
