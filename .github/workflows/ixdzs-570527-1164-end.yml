name: IXDZS 570527 authorized Chinese RAW 1164-end
on:
  push:
    branches:
      - raw/ixdzs-570527-1164-end-20261112
    paths:
      - ".github/workflows/ixdzs-570527-1164-end.yml"
      - "tools/novel-ingest/ixdzs_570527_authorized_export.py"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ixdzs-570527-1164-end-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate parser without network
        run: |
          python -m py_compile tools/novel-ingest/ixdzs_570527_authorized_export.py
          python tools/novel-ingest/ixdzs_570527_authorized_export.py --selftest
      - name: Collect authorized RAW 1164 through the newest indexed chapter
        run: |
          python tools/novel-ingest/ixdzs_570527_authorized_export.py \
            --rights-confirmed --start 1164 --delay 1.1 \
            --output novels/ixdzs/570527
      - name: Show chapter integrity report
        if: always()
        shell: bash
        run: |
          if [ -f novels/ixdzs/570527/summary.md ]; then
            cat novels/ixdzs/570527/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f novels/ixdzs/570527/failure-audit.json ]; then
            cat novels/ixdzs/570527/failure-audit.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Save verified source corpus as artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ixdzs-570527-chinese-1164-end-\${{ github.run_id }}
          path: novels/ixdzs/570527/
          retention-days: 30
          if-no-files-found: error
      - name: Commit all verified chapters to working branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -f novels/ixdzs/570527/manifest.json
          test -f novels/ixdzs/570527/summary.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add novels/ixdzs/570527/
          git diff --cached --quiet && exit 0
          git commit -m "Persist verified IXDZS 570527 Chinese chapters 1164-latest"
          git push
      - name: Save source failure report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ixdzs-570527-failure-\${{ github.run_id }}
          path: novels/ixdzs/570527/failure-audit.json
          retention-days: 14
          if-no-files-found: warn
