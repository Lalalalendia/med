name: IXDZS 632945 qbxsw tail catalog audit
on:
  push:
    branches: [feat/ixdzs632945-qbxsw-check-20261120]
    paths:
      - 'tools/novel-ingest/qbxsw_430452_tail_probe.py'
      - '.github/workflows/qbxsw-430452-tail-probe.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/novel-ingest/qbxsw_430452_tail_probe.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qbxsw-430452-tail-catalog-audit
          path: out/ixdzs632945-qbxsw-probe.json
          if-no-files-found: warn
          retention-days: 7
