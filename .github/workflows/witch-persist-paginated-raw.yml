name: Persist witch paginated RAW

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/witch-persist-paginated-raw.yml"

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download verified paginated corpus artifact
        run: |
          set -euo pipefail
          mkdir -p work
          gh run download 37825482184 \
            --repo "${{ github.repository }}" \
            --name witch-fullraw-paginated \
            --dir work
          test -s work/witch-jiangchen-paginated-504.txt
          test -s work/summary.json
          cat work/summary.json

      - name: Split and persist canonical numbered chapters
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, re, hashlib, shutil

          root=Path("sources/witch-75248/paginated")
          chapters=root/"chapters"
          chapters.mkdir(parents=True,exist_ok=True)

          src=Path("work/witch-jiangchen-paginated-504.txt")
          text=src.read_text(encoding="utf-8")
          summary=json.loads(Path("work/summary.json").read_text(encoding="utf-8"))

          assert summary["entries"]==504
          assert summary["numbered"]==497
          assert summary["max_number"]==497
          assert summary["missing_numbers"]==[]

          missing={483,484,485,486,487,488,489}
          canon={
            173:"情感带师（万字大章）",
            259:"难道你也背叛了吗（）",
            300:"情报及时的重要性（居然都三百章了）",
            328:"黄金树之影（）",
            351:"一路向北，离开有你的季节（）",
          }

          heading_re=re.compile(r"(?m)^(第\s*(\d+)\s*章[^\n]*)$")
          matches=list(heading_re.finditer(text))
          assert len(matches)==497, len(matches)

          manifest=[]
          for i,m in enumerate(matches):
              n=int(m.group(2))
              end=matches[i+1].start() if i+1<len(matches) else len(text)
              block=text[m.start():end].strip()+"\n"
              lines=block.splitlines()
              if n in canon:
                  lines[0]=f"第{n}章 {canon[n]}"
                  block="\n".join(lines).strip()+"\n"
              body="\n".join(block.splitlines()[1:]).strip()
              is_missing=(n in missing)
              if is_missing:
                  # The mirror exposes only its missing-resource notice for these chapters.
                  pass
              else:
                  assert len(body)>=500, (n,len(body))
              target=chapters/f"{n:03d}.txt"
              target.write_text(block,encoding="utf-8")
              manifest.append({
                  "number":n,
                  "path":str(target),
                  "chars":len(block),
                  "body_chars":len(body),
                  "missing_resource":is_missing,
                  "sha256":hashlib.sha256(block.encode("utf-8")).hexdigest(),
              })

          assert [x["number"] for x in manifest]==list(range(1,498))
          (root/"manifest.json").write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          shutil.copy2(src,root/"full-504-paginated.txt")
          shutil.copy2(Path("work/summary.json"),root/"summary.json")
          print(json.dumps({
              "chapters":len(manifest),
              "complete":sum(not x["missing_resource"] for x in manifest),
              "missing":[x["number"] for x in manifest if x["missing_resource"]],
          },ensure_ascii=False))
          PY

      - name: Commit persisted corpus
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/witch-75248/paginated
          git diff --cached --quiet && exit 0
          git commit -m "Persist verified paginated witch RAW corpus"
          git push
