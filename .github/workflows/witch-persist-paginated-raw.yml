name: Persist witch paginated RAW

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/witch-persist-paginated-raw.yml"

permissions:
  contents: write
  actions: read

jobs:
  persist:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Download verified paginated corpus artifact
        run: |
          set -euo pipefail
          mkdir -p work
          gh run download 37825482184 \
            --repo "${{ github.repository }}" \
            --name witch-fullraw-paginated \
            --dir work
          test -s work/witch-jiangchen-paginated-504.txt
          test -s work/summary.json

      - name: Persist verified full chapters 1-416
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import importlib.util
          import json
          import hashlib
          import shutil
          import sys

          parser_path=Path("tools/novel-ingest/extract_chapter.py")
          spec=importlib.util.spec_from_file_location("extract_chapter",parser_path)
          mod=importlib.util.module_from_spec(spec)
          sys.modules[spec.name]=mod
          assert spec.loader is not None
          spec.loader.exec_module(mod)

          src=Path("work/witch-jiangchen-paginated-504.txt")
          text=src.read_text(encoding="utf-8")
          entries=mod.parse_book(text)
          numbered=[e for e in entries if e.entry_type=="chapter"]
          assert len(numbered)==497
          assert [e.author_number for e in numbered]==list(range(1,498))

          root=Path("sources/witch-75248/paginated")
          chapters=root/"chapters"
          chapters.mkdir(parents=True,exist_ok=True)

          complete=[]
          unresolved=[]
          for e in numbered:
              n=e.author_number
              body=e.body.strip()
              block=e.text
              if n<=416:
                  assert len(body)>=2000,(n,len(body))
                  target=chapters/f"{n:03d}.txt"
                  target.write_text(block,encoding="utf-8")
                  complete.append({
                      "number":n,
                      "path":str(target),
                      "body_chars":len(body),
                      "sha256":hashlib.sha256(block.encode("utf-8")).hexdigest(),
                  })
              else:
                  unresolved.append({
                      "number":n,
                      "heading":e.heading,
                      "body_chars":len(body),
                      "reason":"Jiangchen truncated/preview-only tail; requires alternate source",
                  })

          assert len(complete)==416
          assert len(unresolved)==81
          assert min(x["body_chars"] for x in complete)>=2000

          manifest={
              "complete_range":"1-416",
              "complete_count":len(complete),
              "unresolved_range":"417-497",
              "unresolved_count":len(unresolved),
              "complete":complete,
              "unresolved":unresolved,
          }
          (root/"manifest.json").write_text(
              json.dumps(manifest,ensure_ascii=False,indent=2)+"\n",
              encoding="utf-8"
          )
          shutil.copy2(src,root/"full-504-paginated.txt")
          shutil.copy2(Path("work/summary.json"),root/"crawler-summary.json")
          print(json.dumps({
              "complete_count":len(complete),
              "complete_min_body_chars":min(x["body_chars"] for x in complete),
              "unresolved_count":len(unresolved),
              "first_unresolved":unresolved[0],
              "last_unresolved":unresolved[-1],
          },ensure_ascii=False,indent=2))
          PY

      - name: Commit persisted corpus
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources/witch-75248/paginated
          git diff --cached --quiet && exit 0
          git commit -m "Persist verified full witch RAW 1-416"
          git push
