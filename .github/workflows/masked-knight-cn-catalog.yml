name: Masked Knight Chinese source index audit

on:
  pull_request:
    paths:
      - 'tools/novel-ingest/masked_knight_cn_catalog_audit.py'
      - 'tools/novel-ingest/test_masked_knight_cn_catalog_audit.py'
      - '.github/workflows/masked-knight-cn-catalog.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Parser and safety regressions
        run: python -m unittest discover -s tools/novel-ingest -p test_masked_knight_cn_catalog_audit.py -v
      - name: Check Chinese indexes without fetching chapter prose
        id: audit
        continue-on-error: true
        run: |
          python tools/novel-ingest/masked_knight_cn_catalog_audit.py \
            --out out/masked-knight-chinese --delay 2
      - name: Publish available catalog counts
        if: always()
        run: |
          if test -f out/masked-knight-chinese/summary.md; then
            cat out/masked-knight-chinese/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload source URLs, ordinal gaps and status only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: masked-knight-chinese-chapter-index
          path: out/masked-knight-chinese/**
          if-no-files-found: warn
          retention-days: 14
