name: Kakuyomu 56150 persist RAW

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kakuyomu-56150-persist.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  persist-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Fetch Kakuyomu RAW
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          import time
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup, Tag

          WORK_ID = "16816410413990086033"
          BASE = f"https://kakuyomu.jp/works/{WORK_ID}"
          OUT = Path(f"novels/kakuyomu/{WORK_ID}/raw")
          OUT.mkdir(parents=True, exist_ok=True)
          for p in OUT.glob("*.txt"):
              p.unlink()
          headers = {
              "User-Agent": "Mozilla/5.0 (compatible; BookArchive/1.0; +https://github.com/Lalalalendia/med)"
          }
          s = requests.Session()
          s.headers.update(headers)

          def get(url):
              r = s.get(url, timeout=30)
              r.raise_for_status()
              r.encoding = "utf-8"
              return r.text

          def strip_ruby(root):
              for ruby in root.find_all("ruby"):
                  parts = []
                  for child in list(ruby.children):
                      if isinstance(child, Tag):
                          if child.name == "rb":
                              parts.append(child.get_text())
                          elif child.name in ("rt", "rp"):
                              continue
                          else:
                              parts.append(child.get_text())
                      else:
                          parts.append(str(child))
                  ruby.replace_with("".join(parts))

          html = get(BASE)
          soup = BeautifulSoup(html, "lxml")
          data_el = soup.find(id="__NEXT_DATA__")
          if data_el is None:
              raise RuntimeError("Kakuyomu work page has no __NEXT_DATA__")

          data = json.loads(data_el.get_text())
          apollo = data["props"]["pageProps"]["__APOLLO_STATE__"]
          work = apollo[f"Work:{WORK_ID}"]

          episode_meta = []
          for toc_ref in work["tableOfContentsV2"]:
              toc = apollo[toc_ref["__ref"]]
              chapter = apollo[toc["chapter"]["__ref"]]
              section_title = chapter.get("title", "")
              for ep_ref in toc["episodeUnions"]:
                  ep = apollo[ep_ref["__ref"]]
                  episode_meta.append({
                      "episode_id": str(ep["id"]),
                      "title_hint": ep.get("title", ""),
                      "section": section_title,
                  })

          if len(episode_meta) != 85:
              raise RuntimeError(f"Expected 85 Kakuyomu episodes, got {len(episode_meta)}")

          chapters = []
          for ordinal, meta in enumerate(episode_meta, 1):
              ep_id = meta["episode_id"]
              url = f"{BASE}/episodes/{ep_id}"
              ep_html = get(url)
              ep_soup = BeautifulSoup(ep_html, "lxml")
              body = ep_soup.find(class_="widget-episodeBody")
              if body is None:
                  raise RuntimeError(f"No episode body: {url}")

              strip_ruby(body)
              title_el = ep_soup.find(class_="widget-episodeTitle") or ep_soup.find("h1")
              title = title_el.get_text(" ", strip=True) if title_el else meta["title_hint"]

              paragraphs = []
              for p in body.find_all("p"):
                  classes = p.get("class") or []
                  if "blank" in classes:
                      paragraphs.append("")
                      continue
                  for br in p.find_all("br"):
                      br.replace_with("\n")
                  text = p.get_text("", strip=False).replace("\r", "")
                  text = text.rstrip()
                  text = text.lstrip("\u3000")
                  paragraphs.append(text)

              while paragraphs and not paragraphs[0].strip():
                  paragraphs.pop(0)
              while paragraphs and not paragraphs[-1].strip():
                  paragraphs.pop()
              raw = "\n".join(paragraphs)

              m = re.match(r"^第\s*(\d+)\s*話", title)
              author_number = int(m.group(1)) if m else None
              kind = "main" if author_number is not None else "special"
              key = f"{author_number:03d}" if author_number is not None else "SP-01"
              chars_no_ws = len(re.sub(r"\s+", "", raw))

              item = {
                  "key": key,
                  "ordinal": ordinal,
                  "author_number": author_number,
                  "kind": kind,
                  "section": meta["section"],
                  "episode_id": ep_id,
                  "title_jp": title,
                  "source_url": url,
                  "chars_no_ws": chars_no_ws,
                  "raw": raw,
              }
              chapters.append(item)

              safe = re.sub(r'[\\/:*?"<>|]+', "_", title).strip()[:100]
              (OUT / f"{key}_{safe}.txt").write_text(
                  f"Key: {key}\nOrdinal: {ordinal}\nAuthor-Number: {author_number if author_number is not None else ''}\nType: {kind}\nSection: {meta['section']}\nSource: {url}\nJP-Title: {title}\nChars-No-WS: {chars_no_ws}\n\n{raw}\n",
                  encoding="utf-8",
              )
              time.sleep(0.15)

          main = [x for x in chapters if x["kind"] == "main"]
          special = [x for x in chapters if x["kind"] == "special"]
          nums = [x["author_number"] for x in main]
          if len(main) != 84 or nums != list(range(1, 85)):
              raise RuntimeError(f"Expected numbered chapters 1..84, got {len(main)} / {nums[:5]}..{nums[-5:] if nums else []}")
          if len(special) != 1:
              raise RuntimeError(f"Expected one special episode, got {len(special)}")

          (OUT / "chapters.json").write_text(
              json.dumps(chapters, ensure_ascii=False, indent=2), encoding="utf-8"
          )

          manifest_lines = ["key\tordinal\tauthor_number\ttype\tsection\ttitle_jp\tchars_no_ws\tsource_url"]
          for x in chapters:
              manifest_lines.append(
                  "\t".join([
                      x["key"],
                      str(x["ordinal"]),
                      "" if x["author_number"] is None else str(x["author_number"]),
                      x["kind"],
                      x["section"].replace("\t", " "),
                      x["title_jp"].replace("\t", " "),
                      str(x["chars_no_ws"]),
                      x["source_url"],
                  ])
              )
          (OUT / "manifest.tsv").write_text("\n".join(manifest_lines) + "\n", encoding="utf-8")

          combined = []
          for x in chapters:
              combined.extend([
                  f"===== {x['key']} | {x['title_jp']} =====",
                  f"Source: {x['source_url']}",
                  "",
                  x["raw"],
                  "",
              ])
          (OUT / "combined.txt").write_text("\n".join(combined), encoding="utf-8")

          total_chars = sum(x["chars_no_ws"] for x in chapters)
          summary = (
              "# Kakuyomu RAW snapshot\n\n"
              f"- Work ID: {WORK_ID}\n"
              f"- Source: {BASE}\n"
              f"- Episodes: {len(chapters)}\n"
              f"- Numbered main chapters: {len(main)} (1-84)\n"
              f"- Special episodes: {len(special)}\n"
              f"- Parsed non-whitespace JP characters: {total_chars}\n"
          )
          (OUT / "summary.md").write_text(summary, encoding="utf-8")
          print(summary)
          PY

      - name: Commit canonical RAW corpus
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add novels/kakuyomu/16816410413990086033/raw
          if git diff --cached --quiet; then
            echo "No corpus changes"
            exit 0
          fi
          git commit -m "Persist Kakuyomu 56150 RAW corpus"
          git push
