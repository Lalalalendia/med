name: MED Exorcist 530822 source 961 repair
on:
  push:
    branches: ["feat/med-530822-cleaned-961-20261118"]
    paths:
      - tools/novel-ingest/ixdzs_530822_tail.py
      - .github/workflows/ixdzs-530822-repair-961.yml
  workflow_dispatch:
    inputs:
      rights_confirmed:
        type: boolean
        required: true
        default: false
permissions:
  contents: read
jobs:
  recover:
    if: github.event_name == 'push' || inputs.rights_confirmed == true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Offline chapter collector tests
        run: python tools/novel-ingest/ixdzs_530822_tail.py --selftest
      - name: Fetch and verify all chapters including repaired 961
        run: python tools/novel-ingest/ixdzs_530822_tail.py --rights-confirmed --out out/exorcist-530822-961-repaired
      - name: Publish result status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exorcist-530822-961-repair-status
          path: out/exorcist-530822-961-repaired/status.json
          retention-days: 30
      - name: Publish corrected ZIP
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: exorcist-530822-961-repaired-cn
          path: out/exorcist-530822-961-repaired/ixdzs-530822-680-1456-cn.zip
          if-no-files-found: error
          retention-days: 30
