name: ReadNovel 1032797839 catalog and public chapter probe
on:
  push:
    paths: [.github/workflows/readnovel-1032797839-catalog.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests beautifulsoup4
      - name: Check catalog and sampled public chapters
        run: |
          python - <<'PY'
          import requests,json,re,time
          from urllib.parse import urljoin,urlsplit
          from pathlib import Path
          from bs4 import BeautifulSoup
          session=requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 (compatible; AuthorizedNovelPublicArchiver/1.0)","Accept-Language":"zh-CN,zh;q=0.9"})
          urls=[
          "https://m.readnovel.com/bookquery/zfrhskhvdyjd",
          "https://www.readnovel.com/bookquery/zfrhskhvdyjd",
          "https://m.qidian.com/book/1032797839/catalog/",
          "https://www.qidian.com/book/1032797839/",
          "https://m.qidian.com/book/1032797839/",
          "https://www.qidian.com/robots.txt",
          "https://m.qidian.com/robots.txt",
          "https://m.readnovel.com/robots.txt"
          ]
          report=[]
          for url in urls:
            entry={"url":url}
            try:
              r=session.get(url,timeout=25,allow_redirects=False)
              soup=BeautifulSoup(r.text,"html.parser")
              entry.update(status=r.status_code,bytes=len(r.content),location=r.headers.get("Location"),title=soup.title.get_text(" ",strip=True) if soup.title else None)
              if "robots.txt" in url:
                entry["robots"]=r.text[:1500]
              else:
                links=[]
                for a in soup.select("a[href]"):
                  link=urljoin(url,a["href"])
                  label=a.get_text(" ",strip=True)
                  if re.search(r'chapter|/reader/|/book/1032797839/|/bookquery/',link,re.I) and (label or "chapter" in link):
                    links.append({"text":label[:95],"url":link[:260]})
                entry["chapter_links"]=links[:20]
                entry["chapter_link_count"]=len(links)
                entry["chapterish_samples"]=re.findall(r'.{0,100}(?:chapterId|chapter_id|chapterName|章节目录|第.{1,12}章).{0,160}',r.text,re.I)[:8]
                entry["body_sample"]=soup.get_text(" ",strip=True)[-280:]
            except Exception as exc:
              entry["error"]=repr(exc)[:250]
            report.append(entry)
          Path("catalog-probe.json").write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(report,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: readnovel-1032797839-catalog-probe
          path: catalog-probe.json
          retention-days: 7
