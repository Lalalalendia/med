name: N9107EE authorized Japanese collection

on:
  push:
    branches:
      - feat/narou-n9107ee-authorized-import-20261116
    paths:
      - .github/workflows/n9107ee-authorized-collection.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout working branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Verify collector with offline tests
        run: python -m unittest discover -s tools/novel-ingest -p test_collect_authorized_narou.py -v

      - name: Collect Japanese text
        run: python tools/novel-ingest/collect_authorized_narou.py --out output/n9107ee --expected 217 --delay 3.5

      - name: Upload capture receipts and verified complete text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: n9107ee-ja-authorized-capture
          path: output/n9107ee/
          if-no-files-found: warn
          retention-days: 1
