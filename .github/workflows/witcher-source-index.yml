name: Witcher Chinese source chapter-600 metadata probe

on:
  pull_request:
    paths:
      - "tools/jiuxiao/witcher_index_probe.py"
      - "sources/witcher-wolf-school-600plus/**"
      - ".github/workflows/witcher-source-index.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  index-only:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect book catalog links only
        run: python tools/jiuxiao/witcher_index_probe.py
      - name: Summarize source chapter coverage
        if: always()
        run: |
          if test -s out/witcher-chapter600-index.json; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d=json.load(open('out/witcher-chapter600-index.json',encoding='utf-8'))
          print('# Witcher chapter 600 metadata preflight\n')
          print('| Source | Status | Chapter numbers observed in 595–610 |')
          print('|---|---|---|')
          for name,item in d['sources'].items():
              ids=', '.join(item.get('target_chapters',{}))
              print(f'| {name} | {item["status"]} | {ids or "none"} |')
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: witcher-chapter600-links-only
          path: out/witcher-chapter600-index.json
          retention-days: 7
