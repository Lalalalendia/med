name: Timotxt authorized collection
on:
  push:
    branches: [feature/timotxt-1913564134-cn-20261125]
    paths:
      - tools/novel-ingest/timotxt_1913564134.py
      - .github/workflows/timotxt-1913564134.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -m py_compile tools/novel-ingest/timotxt_1913564134.py
      - run: python -u tools/novel-ingest/timotxt_1913564134.py --rights-confirmed --out out/timotxt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: timotxt-status
          path: out/timotxt/status.json
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: timotxt-1913564134-001-135-zh
          path: out/timotxt/*.zip
          if-no-files-found: error
