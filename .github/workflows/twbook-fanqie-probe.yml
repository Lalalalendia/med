name: Fanqie fallback probe

on:
  push:
    branches:
      - twbook-public-deobfuscator
    paths:
      - "tools/twbook-public/probe_fanqie.py"
      - ".github/workflows/twbook-fanqie-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/twbook-public/probe_fanqie.py
