name: Aibenshu 141911 collect chapters 237-end
on:
  push:
    branches: ["collect/aibenshu-141911-from-237"]
    paths:
      - ".github/workflows/aibenshu-141911-collect.yml"
      - "tools/novel-ingest/aibenshu_141911.py"
  workflow_dispatch:
    inputs:
      start:
        description: "First chapter"
        default: "237"
        required: true
      end:
        description: "Last chapter (0 = latest)"
        default: "0"
        required: true
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Check Python syntax
        run: python -m py_compile tools/novel-ingest/aibenshu_141911.py
      - name: Collect and validate public chapters
        env:
          START: ${{ github.event_name == 'workflow_dispatch' && inputs.start || '237' }}
          END: ${{ github.event_name == 'workflow_dispatch' && inputs.end || '0' }}
        run: |
          python tools/novel-ingest/aibenshu_141911.py --start "$START" --end "$END" --delay 0.7 --output out/aibenshu-141911
      - name: Publish verification summary
        if: always()
        run: |
          if test -f out/aibenshu-141911/summary.md; then
            cat out/aibenshu-141911/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload chapters, combined TXT, and failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aibenshu-141911-237-end
          path: out/aibenshu-141911/**
          retention-days: 14
          if-no-files-found: warn
