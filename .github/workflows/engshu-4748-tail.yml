name: Engshu 4748 authorized tail 2600+
on:
  push:
    branches: [collect/engshu-4748-2600-tail]
    paths:
      - ".github/workflows/engshu-4748-tail.yml"
      - "tools/novel-ingest/engshu_4748_tail.py"
      - "tools/novel-ingest/test_engshu_4748_tail.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Offline tests
        run: python -m unittest tools/novel-ingest/test_engshu_4748_tail.py -v
      - name: Discover last chapter
        id: discover
        run: python tools/novel-ingest/engshu_4748_tail.py discover
      - name: Collect full chapter range
        run: python tools/novel-ingest/engshu_4748_tail.py collect --start 2600 --end ${{ steps.discover.outputs.last }} --out out/shard --delay 1.6
      - name: Build complete TXT and ZIP, reject missing or duplicate bodies
        run: python tools/novel-ingest/engshu_4748_tail.py verify --root out --out out/final --first 2600 --last ${{ steps.discover.outputs.last }}
      - name: Upload verified corpus
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: engshu-4748-tail-verified
          path: out/final/
          retention-days: 14
      - name: Preserve incomplete batch diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: engshu-4748-tail-partial
          path: out/
          retention-days: 14
          if-no-files-found: warn
