name: Jiuxiao resumable batches and deterministic assembly

on:
  push:
    branches: [main]
    paths:
      - "tools/jiuxiao/linked_collector.py"
      - "tools/jiuxiao/assemble_batches.py"
      - "tools/jiuxiao/test_linked.py"
      - ".github/workflows/jiuxiao-batch-resume.yml"
  pull_request:
    paths:
      - "tools/jiuxiao/linked_collector.py"
      - "tools/jiuxiao/assemble_batches.py"
      - "tools/jiuxiao/test_linked.py"
      - ".github/workflows/jiuxiao-batch-resume.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-two-batches:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Unit tests
        run: python -m unittest discover -s tools/jiuxiao -p 'test_*.py' -v
      - name: Pilot chapters 1-3
        run: |
          python tools/jiuxiao/linked_collector.py \
            --book-url "https://jiuxiaozw.com/sim/book/6ab99ea063213dfa71e9a016" \
            --expected-title "故事新编" \
            --limit 3 --delay 2 --out-dir out/jiuxiao/batches/part1
      - name: Resume chapters 4-9
        run: |
          NEXT_URL="$(python -c 'import json; print(json.load(open("out/jiuxiao/batches/part1/manifest.json"))["next_url"])')"
          test -n "$NEXT_URL"
          python tools/jiuxiao/linked_collector.py \
            --book-url "https://jiuxiaozw.com/sim/book/6ab99ea063213dfa71e9a016" \
            --expected-title "故事新编" \
            --start-url "$NEXT_URL" --start-ordinal 4 \
            --limit 6 --delay 2 --out-dir out/jiuxiao/batches/part2
      - name: Verify continuity and reconstruct complete book
        run: |
          python tools/jiuxiao/assemble_batches.py \
            out/jiuxiao/batches/part1 \
            out/jiuxiao/batches/part2 \
            --out-dir out/jiuxiao/assembled
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("out/jiuxiao/assembled")
          m=json.loads((p/"manifest.json").read_text(encoding="utf-8"))
          assert m["status"]=="SUCCESS" and m["chapters_collected"]==9
          assert m["batch_count"]==2
          b=(p/"book.txt").read_bytes()
          assert hashlib.sha256(b).hexdigest()==m["sha256_book_txt"]
          # Pinned to the verified one-shot pilot of this public-domain text.
          assert m["sha256_book_txt"]=="5a59ccb5623ae748777c6b52fac9a63f3bf5952893d50394ebde49c7ead338be"
          assert len(list((p/"chapters").glob("*.txt")))==9
          print("RESUME_PASS",m["chapters_collected"],m["text_characters"],m["sha256_book_txt"])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jiuxiao-resume-two-batches-public-domain
          path: out/jiuxiao/
          retention-days: 7
