name: TRXS 6783 complete Chinese text collection

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/trxs-6783-collect.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: trxs-6783-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Verify parser syntax
        run: python -m py_compile tools/novel-ingest/trxs_6783_collect.py
      - name: Probe index and first/middle/last page
        run: |
          python -u tools/novel-ingest/trxs_6783_collect.py \
            --probe --out novels/trxs/6783
      - name: Collect the full indexed text and verify all pages
        run: |
          python -u tools/novel-ingest/trxs_6783_collect.py \
            --workers 3 --delay 0.8 --out novels/trxs/6783
      - name: Publish verified text in the med repository
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          folder=Path("novels/trxs/6783")
          report=json.loads((folder/"manifest.json").read_text(encoding="utf-8"))
          assert report["status"]=="PASS"
          assert report["downloaded_pages"] == report["catalog_pages"]
          assert (folder/"combined-cn.txt").stat().st_size > 100000
          print(f"VERIFIED {report['downloaded_pages']}/{report['catalog_pages']} source pages")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add novels/trxs/6783/
          git commit -m "Add verified Chinese source text for TRXS 6783"
          git push origin HEAD:main
      - name: Attach snapshot or failure receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trxs-6783-collection
          path: |
            novels/trxs/6783/manifest.json
            novels/trxs/6783/README.md
            novels/trxs/6783/combined-cn.txt
          retention-days: 14
          if-no-files-found: warn
