name: IXDZS 642933 permitted TXT export (186-205)

on:
  push:
    branches: [main]
    paths:
      - ".github/ixdzs-642933-export-request.json"
  workflow_dispatch:
    inputs:
      rights_confirmed:
        description: "I hold the necessary rights or permission to copy and reproduce all 20 chapters"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - uses: actions/checkout@v4
      - name: Require scoped, explicit reproduction rights
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_RIGHTS: ${{ inputs.rights_confirmed }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          allowed = False
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              allowed = os.environ.get("DISPATCH_RIGHTS", "").lower() == "true"
          elif os.environ["EVENT_NAME"] == "push":
              f = Path(".github/ixdzs-642933-export-request.json")
              if f.is_file():
                  data = json.loads(f.read_text(encoding="utf-8"))
                  allowed = (
                      data.get("requested") is True
                      and data.get("rights_confirmed") is True
                      and data.get("source_index") == "https://ixdzs.tw/read/642933/"
                      and data.get("start") == 186 and data.get("end") == 205
                  )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"authorized={'true' if allowed else 'false'}\n")
          print("Request authorized:", allowed)
          PY

  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Verify extraction refusals on synthetic fixtures
        run: |
          python tools/novel-ingest/ixdzs_642933_probe.py --selftest
          python tools/novel-ingest/ixdzs_642933_export.py --selftest

  authorized-export:
    needs: [offline-tests, authorize]
    if: needs.authorize.outputs.authorized == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Export permitted original text for translation
        run: |
          python tools/novel-ingest/ixdzs_642933_export.py \
            --rights-confirmed --start 186 --end 205 \
            --out out/authorized-ixdzs-642933 --delay 2.0
      - name: Upload complete verified archive only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: authorized-ixdzs-642933-186-205-txt
          path: out/authorized-ixdzs-642933/ixdzs-642933-186-205-cn.zip
          if-no-files-found: error
          retention-days: 14
