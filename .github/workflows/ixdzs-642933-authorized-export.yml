name: IXDZS 642933 permitted TXT export (186-205)

on:
  push:
    branches: [probe/ixdzs-642933-186-205]
    paths:
      - "tools/novel-ingest/ixdzs_642933_export.py"
      - ".github/workflows/ixdzs-642933-authorized-export.yml"
  workflow_dispatch:
    inputs:
      rights_confirmed:
        description: "I hold the necessary rights or permission to copy and reproduce all 20 chapters"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Verify extraction refusals on synthetic fixtures
        run: |
          python tools/novel-ingest/ixdzs_642933_probe.py --selftest
          python tools/novel-ingest/ixdzs_642933_export.py --selftest

  authorized-export:
    needs: offline-tests
    if: github.event_name == 'workflow_dispatch' && inputs.rights_confirmed == true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Export permitted original text for translation
        run: |
          python tools/novel-ingest/ixdzs_642933_export.py \
            --rights-confirmed --start 186 --end 205 \
            --out out/authorized-ixdzs-642933 --delay 2.0
      - name: Upload complete verified archive only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: authorized-ixdzs-642933-186-205-txt
          path: out/authorized-ixdzs-642933/ixdzs-642933-186-205-cn.zip
          if-no-files-found: error
          retention-days: 14
