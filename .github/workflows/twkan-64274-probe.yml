name: Twkan 64274 chapter boundary probe

on:
  push:
    branches:
      - probe/twkan-64274-20261017
    paths:
      - 'tools/novel-ingest/twkan_64274_probe.py'
      - '.github/workflows/twkan-64274-probe.yml'
  pull_request:
    paths:
      - 'tools/novel-ingest/twkan_64274_probe.py'
      - '.github/workflows/twkan-64274-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  twkan-metadata-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Parser self-test
        run: python tools/novel-ingest/twkan_64274_probe.py --self-test
      - name: Fetch public catalog and sample chapter metadata
        run: python tools/novel-ingest/twkan_64274_probe.py --out out/twkan-64274 --targets 634 635 636 700 1000 1454 1455 1456 --delay 1.5
      - name: Assert catalog was accessible
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("out/twkan-64274/report.json")
          report = json.loads(p.read_text(encoding="utf-8"))
          if report.get("state") != "catalog_parsed":
              raise SystemExit("TWKAN_PROBE_INCOMPLETE: " + str(report.get("state")))
          print("TWKAN_CATALOG_PARSED")
          PY
      - name: Job summary
        if: always()
        run: |
          if test -f out/twkan-64274/summary.md; then
            cat out/twkan-64274/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twkan-64274-metadata
          path: out/twkan-64274/
          if-no-files-found: warn
          retention-days: 7
