name: Ultron native catalog search
on:
  push:
    branches: [probe/faloo-ultron-20261014]
    paths:
      - 'tools/novel-ingest/ultron_native_site_search.py'
      - '.github/workflows/ultron-native-site-search.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m py_compile tools/novel-ingest/ultron_native_site_search.py
      - name: Search public site directories
        run: python tools/novel-ingest/ultron_native_site_search.py
      - name: Show report summary
        if: always()
        run: |
          if test -f out/ultron-native-search/manifest.json; then
            python - <<'PY'
          import json,os
          d=json.load(open('out/ultron-native-search/manifest.json',encoding='utf-8'))
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a',encoding='utf-8') as f:
            f.write(f"# Native novel site search\n\nCandidates: {d['count']}\n")
            for x in d['candidate_urls'][:30]:
              f.write(f"- {x['site']}: {x['title']} — {x['url']}\n")
          PY
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ultron-native-site-search-manifest
          path: out/ultron-native-search/manifest.json
          if-no-files-found: warn
          retention-days: 7
