name: Novel543 632945 latest chapters source probe
on:
  push:
    branches: [feat/novel543-632945-tail-20261120]
    paths:
      - "tools/novel-ingest/novel543_632945_tail_probe.py"
      - ".github/workflows/novel543-632945-tail-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect public index and selected chapter accessibility
        run: python tools/novel-ingest/novel543_632945_tail_probe.py
      - name: Preserve source availability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: novel543-632945-tail-361-368-source-probe
          path: out/novel543-632945-source-probe.json
          if-no-files-found: warn
          retention-days: 7
