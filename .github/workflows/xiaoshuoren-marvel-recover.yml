name: Xiaoshuoren - recover six missing chapter bodies
on:
  push:
    branches: ["collect/xiaoshuoren-marvel-20261121"]
    paths:
      - "tools/novel-ingest/xiaoshuoren_marvel_recover.py"
      - ".github/workflows/xiaoshuoren-marvel-recover.yml"
  pull_request:
    paths:
      - "tools/novel-ingest/xiaoshuoren_marvel_recover.py"
      - ".github/workflows/xiaoshuoren-marvel-recover.yml"
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python -m py_compile tools/novel-ingest/xiaoshuoren_marvel_recover.py
      - name: Recover only exact title-matched chapters
        run: python tools/novel-ingest/xiaoshuoren_marvel_recover.py
      - name: Upload verified recovered bodies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xiaoshuoren-marvel-recovery-${{ github.run_id }}
          path: |
            out/xiaoshuoren-marvel-recovered/**
            out/xiaoshuoren-marvel-recovered.zip
          retention-days: 14
          if-no-files-found: warn
