name: Masked Knight full source collection (authorized request)

on:
  push:
    branches:
      - audit/masked-knight-availability-20261024
    paths:
      - '.github/masked-knight-export-request.json'
      - '.github/workflows/masked-knight-request-run.yml'

permissions:
  contents: read

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact book-specific export request and permission
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          obj = json.loads(Path(".github/masked-knight-export-request.json").read_text())
          required = {
              "book_key": "masked-knight",
              "source": "webnovel",
              "source_book_url": "https://www.webnovel.com/book/6831835502000105/catalog",
              "requested": True,
              "rights_confirmed": True,
              "expected_chapters": 338,
          }
          for key, value in required.items():
              if obj.get(key) != value:
                  raise SystemExit("Not authorized to fetch: invalid " + key)
          if not str(obj.get("rights_basis", "")).strip():
              raise SystemExit("Missing rights provenance")
          delay = obj.get("delay_seconds", 3)
          if not isinstance(delay, (int, float)) or not 1.5 <= delay <= 10:
              raise SystemExit("Invalid request pacing")
          Path("out").mkdir(exist_ok=True)
          Path("out/masked-knight-validated-delay.txt").write_text(str(delay))
          print("Authorized request for 338 Masked Knight Webnovel chapters.")
          PY
      - name: Dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Export regression tests
        run: python -m unittest discover -s tools/novel-ingest -p test_masked_knight_full_export.py -v
      - name: Fetch all 338 numbered chapters and verify full corpus
        id: ingest
        run: |
          python tools/novel-ingest/masked_knight_full_export.py \
            --rights-confirmed \
            --delay "$(cat out/masked-knight-validated-delay.txt)" \
            --out-dir out/masked-knight-export
      - name: Summarize verified coverage
        if: always()
        run: |
          if test -f out/masked-knight-export/manifest.json; then
            python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path("out/masked-knight-export/manifest.json").read_text(encoding="utf-8"))
          lines=[
              "# Masked Knight source collection",
              "Status: " + m["status"],
              "Verified: " + str(m["verified_chapters"]) + "/" + str(m["expected_chapters"]),
              "Missing: " + str(m["missing"][:45]),
              "Failures: " + str(m["failures"][:15]),
          ]
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"],"a") as f:
              f.write("\n".join(lines)+"\n")
          PY
          else
            echo 'Source collection stopped before manifest was produced (see logs)' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload verified RAW only if complete (7 day retention)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: masked-knight-338-authorized-text
          path: out/masked-knight-export/**
          if-no-files-found: error
          retention-days: 7
      - name: Upload metadata on partial or blocked run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: masked-knight-partial-receipts
          path: out/masked-knight-export/manifest.json
          if-no-files-found: warn
          retention-days: 14
