name: TWKAN 110079 - validated collection
on:
  pull_request:
    paths:
      - '.github/workflows/fanqie-7624963512988617753-catalog.yml'
      - 'tools/novel-ingest/twkan_110079.py'
permissions:
  contents: read
concurrency:
  group: twkan-110079-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate and collect permitted public chapters
        run: python tools/novel-ingest/twkan_110079.py
      - name: Encrypt archive for the authorized recipient
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=out/twkan-110079
          test -f "$d/manifest.json" || exit 0
          if ! find "$d/raw" -type f -name '*.txt' -print -quit | grep -q .; then exit 0; fi
          umask 077
          trap 'rm -f "$RUNNER_TEMP/twkan-110079.zip"' EXIT
          cat > "$RUNNER_TEMP/twkan-recipient.pem" <<'PEM'
          -----BEGIN CERTIFICATE-----
