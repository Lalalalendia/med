name: Catalog audit - Fanqie 7624963512988617753
on:
  pull_request:
    paths:
      - '.github/workflows/fanqie-7624963512988617753-catalog.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 opencc-python-reimplemented
      - name: Audit public table of contents only
        run: |
          python - <<'PY'
          import json, re, hashlib, unicodedata
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.robotparser import RobotFileParser
          import requests
          from bs4 import BeautifulSoup
          from opencc import OpenCC

          out = Path('catalog-audit')
          out.mkdir()
          agent = 'NovelCatalogAudit/1.0'
          cc = OpenCC('t2s')
          rx = re.compile(r'^第\s*(\d{1,4})\s*章\s*(\S.{0,100})$')
          sources = {
              'fanqie': ('https://fanqienovel.com/page/7624963512988617753',
                         [n for n in range(1,294) if n not in (158,277)]),
              'twkan': ('https://twkan.com/book/110079/index.html',
                        list(range(1,292))),
          }

          def norm(s):
              return re.sub(r'[\W_]+', '', cc.convert(unicodedata.normalize('NFKC', s)))

          def fetch(url):
              return requests.get(url, headers={'User-Agent': agent},
                                  timeout=25, allow_redirects=False)

          def audit(url, expected):
              host = urlsplit(url).netloc
              robots_url = 'https://' + host + '/robots.txt'
              r = fetch(robots_url)
              if r.status_code != 200:
                  return {'status': 'ROBOTS_UNVERIFIED', 'http_status': r.status_code}
              rp = RobotFileParser()
              rp.parse(r.text.splitlines())
              if not rp.can_fetch(agent, url):
                  return {'status': 'ROBOTS_DISALLOWED'}
              r = fetch(url)
              if r.status_code != 200:
                  return {'status': 'HTTP_ERROR', 'http_status': r.status_code}
              soup = BeautifulSoup(r.content, 'html.parser')
              for node in soup.select('script,style,noscript'):
                  node.decompose()
              found = {}
              conflicts = {}
              candidates = list(soup.stripped_strings)
              candidates += [x.get_text(' ', strip=True) for x in soup.select('a, li, span, p')]
              for text in candidates:
                  m = rx.fullmatch(' '.join(text.split()))
                  if not m:
                      continue
                  number, title = int(m[1]), m[2]
                  if number not in expected:
                      continue
                  title = re.sub(r'\s*20\d\d-\d\d-\d\d$', '', title).strip()
                  if number in found and norm(found[number]) != norm(title):
                      conflicts.setdefault(number, set()).update((found[number], title))
                  else:
                      found[number] = title
              missing = sorted(set(expected)-set(found))
              return {
                  'status': 'COMPLETE' if not missing and not conflicts else 'PARTIAL_OR_CONFLICT',
                  'count': len(found), 'expected_count': len(expected),
                  'missing_numbers': missing,
                  'conflicting_titles': {str(k): sorted(v) for k,v in conflicts.items()},
                  'catalog': [{'number': n, 'title': found[n]} for n in sorted(found)],
              }

          result = {'mode': 'catalog_only', 'chapter_bodies_downloaded': 0, 'sources': {}}
          for name, (url, expected) in sources.items():
              try:
                  value = audit(url, expected)
              except Exception as exc:
                  value = {'status': 'ERROR', 'error': str(exc)}
              value['url'] = url
              result['sources'][name] = value
          a = {x['number']: x['title'] for x in result['sources']['fanqie'].get('catalog', [])}
          b = {x['number']: x['title'] for x in result['sources']['twkan'].get('catalog', [])}
          comparisons = []
          for i, n in enumerate(sources['fanqie'][1], 1):
              if n in a and i in b:
                  comparisons.append({'ordinal': i, 'fanqie_number': n, 'twkan_number': i,
                                      'title_match': norm(a[n]) == norm(b[i])})
          result['comparison'] = {'pairs': len(comparisons),
                                  'matches': sum(x['title_match'] for x in comparisons),
                                  'rows': comparisons}
          p = out / 'catalog-audit.json'
          p.write_text(json.dumps(result, ensure_ascii=False, indent=2)+'\n', encoding='utf-8')
          (out/'SHA256SUMS').write_text(hashlib.sha256(p.read_bytes()).hexdigest()+'  '+p.name+'\n')
          for k,v in result['sources'].items():
              print(k, v['status'], v.get('count', 0))
          print('Comparable positions:', len(comparisons))
          print('Chapter body requests: 0')
          if any(v['status'] != 'COMPLETE' for v in result['sources'].values()) or len(comparisons) != 291 or not all(x['title_match'] for x in comparisons):
              raise SystemExit('Catalog comparison incomplete; see report')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fanqie-7624963512988617753-catalog-audit
          path: catalog-audit/
          if-no-files-found: warn
          retention-days: 7
