name: TWKAN 110079 - validated collection
on:
  pull_request:
    paths:
      - '.github/workflows/fanqie-7624963512988617753-catalog.yml'
      - 'tools/novel-ingest/twkan_110079.py'
permissions:
  contents: read
concurrency:
  group: twkan-110079-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Validate and collect permitted public chapters
        run: python tools/novel-ingest/twkan_110079.py
      - name: Upload verification manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twkan-110079-verification
          path: |
            out/twkan-110079/manifest.json
            out/twkan-110079/SHA256SUMS
          if-no-files-found: warn
          retention-days: 7
