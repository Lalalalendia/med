name: Biquge 5195354 authorized chapters 867 onward
on:
  push:
    branches: ["feat/biquge-5195354-867-tail-20261117"]
    paths: ["tools/novel-ingest/biquge_5195354.py", ".github/workflows/biquge-5195354-867-export.yml"]
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Collect verified chapters from 867 to catalog end
        run: python tools/novel-ingest/biquge_5195354.py --rights-confirmed --start 867 --end 0 --delay 1.5 --out out/biquge-5195354
      - name: Publish status even on source failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biquge-5195354-867-tail-status
          path: out/biquge-5195354/status.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verified text only after complete success
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: biquge-5195354-867-tail-cn
          path: out/biquge-5195354/biquge-5195354-*-cn.zip
          if-no-files-found: error
          retention-days: 30
