name: Build witch full corpus

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/witch-corpus-build.yml"

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Build manifest from Jiangchen
        run: |
          set -euo pipefail
          mkdir -p out
          curl --compressed --fail --location --retry 3             --user-agent "Mozilla/5.0"             "https://www.jiangchenxs.com/du_75248/"             -o index.html
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin
          import json
          from pathlib import Path

          html=Path("index.html").read_text(encoding="utf-8")
          main=html.split("《魔女大人，请按剧本黑化！》正文",1)[1]

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.in_dd=False; self.href=None; self.text=[]; self.rows=[]
              def handle_starttag(self,tag,attrs):
                  tag=tag.lower()
                  if tag=="dd": self.in_dd=True
                  elif tag=="a" and self.in_dd:
                      self.href=dict(attrs).get("href"); self.text=[]
              def handle_data(self,data):
                  if self.href is not None: self.text.append(data)
              def handle_endtag(self,tag):
                  tag=tag.lower()
                  if tag=="a" and self.href is not None:
                      self.rows.append((self.href,"".join(self.text).strip()))
                      self.href=None; self.text=[]
                  elif tag=="dd": self.in_dd=False

          p=P(); p.feed(main)
          rows=[]; seen=set()
          for href,title in p.rows:
              if not href or href in seen: continue
              seen.add(href)
              rows.append({"ordinal":len(rows)+1,"url":urljoin("https://www.jiangchenxs.com/du_75248/",href),"heading":title})

          assert len(rows)==504, len(rows)
          Path("out/manifest.json").write_text(json.dumps(rows,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print("manifest_entries",len(rows))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: witch-manifest
          path: out/manifest.json
          retention-days: 2

  crawl:
    needs: manifest
    strategy:
      fail-fast: false
      matrix:
        chunk: [0,1,2,3,4,5,6,7]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: witch-manifest
          path: work
      - name: Fetch chunk
        env:
          CHUNK: ${{ matrix.chunk }}
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import json, os, subprocess, time

          rows=json.loads(Path("work/manifest.json").read_text(encoding="utf-8"))
          chunk=int(os.environ["CHUNK"])
          selected=[r for r in rows if (r["ordinal"]-1)%8==chunk]
          out=Path("out")

          def fetch(row):
              target=out/f"{row['ordinal']:03d}.html"
              cmd=[
                  "curl","--compressed","--fail","--location","--silent","--show-error",
                  "--connect-timeout","8","--max-time","25","--retry","4","--retry-delay","1",
                  "--user-agent","Mozilla/5.0",row["url"],"-o",str(target)
              ]
              p=subprocess.run(cmd,capture_output=True,text=True)
              if p.returncode!=0 or not target.exists() or target.stat().st_size<1500:
                  raise RuntimeError(f"ordinal={row['ordinal']} rc={p.returncode} err={p.stderr.strip()}")
              return row["ordinal"],target.stat().st_size

          done=0; total=0
          with ThreadPoolExecutor(max_workers=10) as ex:
              futs=[ex.submit(fetch,r) for r in selected]
              for fut in as_completed(futs):
                  ordinal,size=fut.result(); done+=1; total+=size
                  if done%10==0 or done==len(selected):
                      print(f"chunk={chunk} fetched={done}/{len(selected)} bytes={total}")
          assert done==len(selected)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: witch-pages-${{ matrix.chunk }}
          path: out/*.html
          retention-days: 2

  combine:
    needs: [manifest, crawl]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: witch-pages-*
          path: work/pages
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: witch-manifest
          path: work
      - name: Build normalized TXT
        run: |
          set -euo pipefail
          mkdir -p out
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import json, re

          rows=json.loads(Path("work/manifest.json").read_text(encoding="utf-8"))

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.in_content=False; self.depth=0; self.buf=[]; self.parts=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs); tag=tag.lower()
                  if tag=="div" and d.get("id")=="content":
                      self.in_content=True; self.depth=1; return
                  if self.in_content:
                      if tag=="div": self.depth+=1
                      if tag=="br": self.parts.append("\n")
              def handle_data(self,data):
                  if self.in_content: self.parts.append(data)
              def handle_endtag(self,tag):
                  if self.in_content and tag.lower()=="div":
                      self.depth-=1
                      if self.depth==0:self.in_content=False

          blocks=[]; empty=[]
          for row in rows:
              path=Path(f"work/pages/{row['ordinal']:03d}.html")
              html=path.read_text(encoding="utf-8",errors="replace")
              p=P(); p.feed(html)
              body="".join(p.parts)
              body=re.sub(r"如果此书侵犯了您的权益.*?$","",body,flags=re.S)
              body=re.sub(r"小主子，这个章节后面还有哦.*?$","",body,flags=re.S)
              body=re.sub(r"[ \t]+\n","\n",body)
              body=re.sub(r"\n{3,}","\n\n",body).strip()
              if not body: empty.append(row["ordinal"])
              blocks.append(row["heading"]+"\n\n"+body)
          assert not empty, empty
          txt="\n\n".join(blocks)+"\n"
          Path("out/witch-jiangchen-504.txt").write_text(txt,encoding="utf-8")
          print("entries",len(rows),"chars",len(txt))
          PY
      - name: Summary
        run: |
          python - <<'PY' > out/summary.json
          import json,re
          from pathlib import Path
          txt=Path("out/witch-jiangchen-504.txt").read_text(encoding="utf-8")
          heads=[x for x in txt.splitlines() if re.match(r"^(第\d+章|上架感言|群炸了|电脑炸了|请假条|没办法再请天假|罪己诏|新书已发)",x)]
          numbered=[h for h in heads if re.match(r"^第\d+章",h)]
          print(json.dumps({
            "entries_detected":len(heads),
            "numbered_detected":len(numbered),
            "first":numbered[0] if numbered else None,
            "last":numbered[-1] if numbered else None,
            "txt_chars":len(txt)
          },ensure_ascii=False,indent=2))
          PY
          cat out/summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: witch-full-corpus
          path: |
            out/witch-jiangchen-504.txt
            out/summary.json
          retention-days: 7
