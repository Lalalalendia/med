name: Verify witch Jiangchen corpus

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/witch-txt-probe.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch index and build canonical manifest
        run: |
          set -euo pipefail
          mkdir -p work/pages out
          curl --compressed --fail --location --retry 3 \
            --user-agent "Mozilla/5.0" \
            "https://www.jiangchenxs.com/du_75248/" \
            -o work/index.html
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urljoin
          import json
          import re

          html = Path("work/index.html").read_text(encoding="utf-8")
          marker = "《魔女大人，请按剧本黑化！》正文"
          if marker not in html:
              raise SystemExit("Main corpus marker not found.")
          main = html.split(marker, 1)[1]

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_dd = False
                  self.href = None
                  self.text = []
                  self.rows = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "dd":
                      self.in_dd = True
                  elif tag.lower() == "a" and self.in_dd:
                      self.href = dict(attrs).get("href")
                      self.text = []
              def handle_data(self, data):
                  if self.href is not None:
                      self.text.append(data)
              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag == "a" and self.href is not None:
                      self.rows.append((self.href, "".join(self.text).strip()))
                      self.href = None
                      self.text = []
                  elif tag == "dd":
                      self.in_dd = False

          p = P()
          p.feed(main)
          rows = []
          seen = set()
          for href, heading in p.rows:
              if not href or href in seen:
                  continue
              seen.add(href)
              rows.append({
                  "ordinal": len(rows) + 1,
                  "url": urljoin("https://www.jiangchenxs.com/du_75248/", href),
                  "heading": heading,
              })

          numbered = [r for r in rows if re.match(r"^第\s*\d+\s*章", r["heading"])]
          non_numbered = [r for r in rows if r not in numbered]
          nums = [int(re.match(r"^第\s*(\d+)\s*章", r["heading"]).group(1)) for r in numbered]
          missing = [n for n in range(1, max(nums) + 1) if n not in set(nums)]

          print(f"manifest_entries={len(rows)}")
          print(f"manifest_numbered={len(numbered)}")
          print(f"manifest_non_numbered={len(non_numbered)}")
          print(f"manifest_max={max(nums)} missing={missing}")
          print("manifest_non_numbered_headings=" + json.dumps(
              [r["heading"] for r in non_numbered], ensure_ascii=False
          ))

          assert len(rows) == 504
          assert len(numbered) == 497
          assert len(non_numbered) == 7
          assert max(nums) == 497
          assert not missing

          Path("work/manifest.json").write_text(
              json.dumps(rows, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Crawl all 504 corpus pages
        run: |
          set -euo pipefail
          python - <<'PY'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import json
          import subprocess
          import time

          rows = json.loads(Path("work/manifest.json").read_text(encoding="utf-8"))
          out = Path("work/pages")
          out.mkdir(parents=True, exist_ok=True)

          def fetch(row):
              target = out / f"{row['ordinal']:03d}.html"
              cmd = [
                  "curl",
                  "--compressed",
                  "--fail",
                  "--location",
                  "--silent",
                  "--show-error",
                  "--connect-timeout", "10",
                  "--max-time", "40",
                  "--retry", "3",
                  "--retry-delay", "1",
                  "--user-agent", "Mozilla/5.0",
                  row["url"],
                  "-o", str(target),
              ]
              last = None
              for attempt in range(1, 4):
                  p = subprocess.run(cmd, capture_output=True, text=True)
                  if p.returncode == 0 and target.exists() and target.stat().st_size > 1000:
                      return row["ordinal"], target.stat().st_size
                  last = p.stderr.strip()
                  time.sleep(attempt)
              raise RuntimeError(
                  f"Failed ordinal={row['ordinal']} url={row['url']} error={last}"
              )

          done = 0
          total_bytes = 0
          with ThreadPoolExecutor(max_workers=6) as ex:
              futures = {ex.submit(fetch, row): row for row in rows}
              for fut in as_completed(futures):
                  ordinal, size = fut.result()
                  done += 1
                  total_bytes += size
                  if done % 50 == 0 or done == len(rows):
                      print(f"fetched={done}/{len(rows)} bytes={total_bytes}")

          assert done == len(rows)
          PY

      - name: Build temporary TXT from crawled pages
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import hashlib
          import json

          rows = json.loads(Path("work/manifest.json").read_text(encoding="utf-8"))

          class ChapterParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_h1 = False
                  self.h1 = []
                  self.in_content = False
                  self.content_depth = 0
                  self.current = []
                  self.paragraphs = []
              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  d = dict(attrs)
                  if tag == "h1" and not self.in_content:
                      self.in_h1 = True
                      self.h1 = []
                  if tag == "div" and d.get("id") == "content":
                      self.in_content = True
                      self.content_depth = 1
                      return
                  if self.in_content:
                      if tag == "div":
                          self.content_depth += 1
                      if tag in ("p", "br"):
                          if self.current:
                              text = "".join(self.current).strip()
                              if text:
                                  self.paragraphs.append(text)
                              self.current = []
              def handle_data(self, data):
                  if self.in_h1:
                      self.h1.append(data)
                  if self.in_content:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag == "h1" and self.in_h1:
                      self.in_h1 = False
                  if self.in_content:
                      if tag in ("p", "br") and self.current:
                          text = "".join(self.current).strip()
                          if text:
                              self.paragraphs.append(text)
                          self.current = []
                      if tag == "div":
                          self.content_depth -= 1
                          if self.content_depth == 0:
                              if self.current:
                                  text = "".join(self.current).strip()
                                  if text:
                                      self.paragraphs.append(text)
                                  self.current = []
                              self.in_content = False

          blocks = []
          mismatches = []
          empty = []
          boilerplate_removed = 0

          for row in rows:
              html = Path(f"work/pages/{row['ordinal']:03d}.html").read_text(
                  encoding="utf-8", errors="replace"
              )
              p = ChapterParser()
              p.feed(html)
              page_heading = "".join(p.h1).strip()
              if page_heading and page_heading != row["heading"]:
                  mismatches.append({
                      "ordinal": row["ordinal"],
                      "manifest": row["heading"],
                      "page": page_heading,
                  })

              paras = []
              for text in p.paragraphs:
                  if text.startswith("如果此书侵犯了您的权益"):
                      boilerplate_removed += 1
                      continue
                  if "小主子，这个章节后面还有哦" in text:
                      boilerplate_removed += 1
                      continue
                  paras.append(text)

              body = "\n".join(paras).strip()
              if not body:
                  empty.append(row)
              blocks.append(row["heading"] + "\n\n" + body + "\n")

          combined = "\n".join(blocks)
          Path("work/book.txt").write_text(combined, encoding="utf-8")
          print(f"combined_chars={len(combined)}")
          print(f"combined_sha256={hashlib.sha256(combined.encode('utf-8')).hexdigest()}")
          print(f"heading_mismatches={len(mismatches)}")
          if mismatches:
              print(json.dumps(mismatches[:20], ensure_ascii=False, indent=2))
          print(f"empty_bodies={len(empty)}")
          if empty:
              print(json.dumps(empty[:20], ensure_ascii=False, indent=2))
          print(f"boilerplate_removed={boilerplate_removed}")

          assert not mismatches
          assert not empty
          PY

      - name: Run production parser over reconstructed TXT
        run: |
          set -euo pipefail
          python - <<'PY' | tee out/corpus-summary.json
          import importlib.util
          import json
          import pathlib
          import sys

          source = pathlib.Path("tools/novel-ingest/extract_chapter.py")
          spec = importlib.util.spec_from_file_location("extract_chapter", source)
          mod = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = mod
          assert spec.loader is not None
          spec.loader.exec_module(mod)

          text = pathlib.Path("work/book.txt").read_text(encoding="utf-8")
          entries = mod.parse_book(text)
          numbered = [e for e in entries if e.entry_type == "chapter"]
          extras = [e for e in entries if e.entry_type == "extra"]
          service = [e for e in entries if e.entry_type == "service"]
          nums = [e.author_number for e in numbered]
          max_no = max(nums) if nums else 0
          present = set(nums)
          missing = [n for n in range(1, max_no + 1) if n not in present]

          summary = {
              "source": "Jiangchen HTML corpus reconstructed in GitHub Actions",
              "total_entries": len(entries),
              "numbered_chapters": len(numbered),
              "extra_entries": len(extras),
              "service_entries": len(service),
              "non_numbered_entries": len(extras) + len(service),
              "max_author_number": max_no,
              "missing_author_numbers": missing,
              "first_numbered_heading": numbered[0].heading if numbered else None,
              "last_numbered_heading": numbered[-1].heading if numbered else None,
              "extra_headings": [e.heading for e in extras],
              "service_headings": [e.heading for e in service],
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))

          assert len(entries) == 504, summary
          assert len(numbered) == 497, summary
          assert len(service) == 7, summary
          assert len(extras) == 0, summary
          assert max_no == 497, summary
          assert not missing, summary
          PY

      - name: Upload verification metadata
        uses: actions/upload-artifact@v4
        with:
          name: witch-jiangchen-corpus-verification
          path: |
            out/corpus-summary.json
            work/manifest.json
          if-no-files-found: error
          retention-days: 7
