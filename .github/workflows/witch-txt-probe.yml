name: Probe witch novel TXT source

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/witch-txt-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Fetch Jiangchen download page
        run: |
          set -euo pipefail
          curl --compressed --fail --location --retry 3 \
            --user-agent "Mozilla/5.0" \
            "https://www.jiangchenxs.com/xiazai_75248.html" \
            -o download.html
          echo "bytes=$(wc -c < download.html)"
          python - <<'PY'
          from html.parser import HTMLParser
          from urllib.parse import urljoin

          base = "https://www.jiangchenxs.com/xiazai_75248.html"
          html = open("download.html", "r", encoding="utf-8", errors="replace").read()

          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.forms = []
                  self.scripts = []
                  self._a = None
                  self._a_text = []
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  tag = tag.lower()
                  if tag == "a":
                      self._a = d.get("href", "")
                      self._a_text = []
                  elif tag == "form":
                      self.forms.append((d.get("action", ""), d.get("method", "")))
                  elif tag == "script" and d.get("src"):
                      self.scripts.append(d["src"])
              def handle_data(self, data):
                  if self._a is not None:
                      self._a_text.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "a" and self._a is not None:
                      self.links.append((self._a, "".join(self._a_text).strip()))
                      self._a = None
                      self._a_text = []

          p = P()
          p.feed(html)
          print("LINKS:")
          for href, text in p.links:
              full = urljoin(base, href)
              if href:
                  print(f"{text!r}\t{full}")
          print("FORMS:")
          for action, method in p.forms:
              print(method, urljoin(base, action))
          print("SCRIPTS:")
          for src in p.scripts:
              print(urljoin(base, src))
          PY

      - name: Upload probe page
        uses: actions/upload-artifact@v4
        with:
          name: witch-txt-download-page
          path: download.html
          if-no-files-found: error
          retention-days: 1
