name: Probe witch chapter HTML

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/witch-txt-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - name: Fetch first chapter
        run: |
          set -euo pipefail
          curl --compressed --fail --location --retry 3 \
            --user-agent "Mozilla/5.0" \
            "https://www.jiangchenxs.com/du_75248/11093480.html" \
            -o chapter.html
          echo "bytes=$(wc -c < chapter.html)"
          python - <<'PY'
          from html.parser import HTMLParser

          html = open("chapter.html", "r", encoding="utf-8", errors="replace").read()

          class P(HTMLParser):
              def handle_starttag(self, tag, attrs):
                  d = dict(attrs)
                  if tag in ("div", "article", "main", "section", "h1", "h2"):
                      ident = d.get("id", "")
                      cls = d.get("class", "")
                      if ident or cls or tag in ("article", "main", "h1", "h2"):
                          print(f"TAG {tag} id={ident!r} class={cls!r}")
          P().feed(html)

          for needle in ("系统脑袋怎么尖尖的", "content", "chapter", "read", "正文"):
              i = html.find(needle)
              print(f"NEEDLE {needle!r} at {i}")
              if i >= 0:
                  print(html[max(0, i-600):i+1200])
          PY

      - name: Upload chapter HTML
        uses: actions/upload-artifact@v4
        with:
          name: witch-chapter-1-html
          path: chapter.html
          if-no-files-found: error
          retention-days: 1
