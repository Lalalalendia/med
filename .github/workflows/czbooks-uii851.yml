name: CZBooks uii851 verified export
on:
  push:
    branches: [collect/czbooks-uii851]
    paths:
      - ".github/workflows/czbooks-uii851.yml"
      - "tools/novel-ingest/czbooks_uii851.py"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - run: python tools/novel-ingest/czbooks_uii851.py --self-test
      - run: python -u tools/novel-ingest/czbooks_uii851.py --rights-confirmed --delay 1.8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: uii851-verification
          path: out/uii851/manifest.json
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: czbooks-uii851-001-272-cn
          path: out/uii851/czbooks-uii851-001-272-cn.zip
          if-no-files-found: error
          retention-days: 7
