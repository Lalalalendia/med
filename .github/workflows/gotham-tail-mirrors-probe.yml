name: Probe Gotham tail mirrors v2

on:
  push:
    paths:
      - ".github/workflows/gotham-tail-mirrors-probe.yml"
      - "tools/gotham-tail/probe_mirrors.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/gotham-tail/probe_mirrors.py
