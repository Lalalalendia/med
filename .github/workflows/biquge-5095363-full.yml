name: Biquge 5095363 full authorized Chinese collection

on:
  push:
    branches:
      - feature/biquge-5095363-full-cn-20261123
    paths:
      - tools/novel-ingest/biquge_5095363.py
      - .github/workflows/biquge-5095363-full.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Check Python syntax
        run: python -m py_compile tools/novel-ingest/biquge_5095363.py
      - name: Collect chapters 1-229 with verification
        run: python -u tools/novel-ingest/biquge_5095363.py --rights-confirmed --start 1 --end 229 --delay 1.0 --out out/biquge-5095363
      - name: Publish status and partial files for diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biquge-5095363-collection-status
          path: |
            out/biquge-5095363/status.json
            out/biquge-5095363/summary.md
          if-no-files-found: warn
          retention-days: 30
      - name: Publish verified complete Chinese archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: biquge-5095363-001-229-zh
          path: out/biquge-5095363/biquge-5095363-001-229-zh.zip
          if-no-files-found: error
          retention-days: 30
