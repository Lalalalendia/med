name: IXDZS 632945 — catalog audit and rights-gated export

on:
  push:
    branches: [feat/ixdzs-632945-authorized-20261120]
    paths:
      - "tools/novel-ingest/ixdzs_632945_export.py"
      - ".github/workflows/ixdzs-632945-authorized-export.yml"
  workflow_dispatch:
    inputs:
      rights_confirmed:
        description: "I confirm I have the rights or permission to reproduce chapters 1-360"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: ixdzs-632945-export
  cancel-in-progress: false

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/novel-ingest/ixdzs_632945_export.py --selftest
  catalog:
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Audit source chapter links (metadata only)
        run: python tools/novel-ingest/ixdzs_632945_export.py --catalog-only --out out/ixdzs-632945
      - name: Publish catalog metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixdzs-632945-catalog-metadata
          path: out/ixdzs-632945/catalog.json
          retention-days: 30
          if-no-files-found: warn
  export:
    # One-time authorized collection on the PR branch; manual dispatch remains rights-gated.
    if: (github.event_name == 'workflow_dispatch' && inputs.rights_confirmed == true) || (github.event_name == 'push' && github.ref == 'refs/heads/feat/ixdzs-632945-authorized-20261120')
    needs: selftest
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Collect rights-confirmed Chinese chapters 1-360
        run: python tools/novel-ingest/ixdzs_632945_export.py --rights-confirmed --delay 2.0 --out out/authorized-ixdzs-632945
      - name: Publish status (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ixdzs-632945-export-status
          path: out/authorized-ixdzs-632945/status.json
          retention-days: 30
          if-no-files-found: warn
      - name: Publish archive only after validation succeeds
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ixdzs-632945-001-360-verified-cn
          path: out/authorized-ixdzs-632945/ixdzs-632945-1-360-cn.zip
          retention-days: 30
          if-no-files-found: error
