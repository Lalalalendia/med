name: Probe ReadNovel mobile reading API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/witch-qidian-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Fetch mobile bundle
        run: |
          set -euo pipefail
          mkdir -p out
          curl --compressed --fail --location --retry 3 \
            --user-agent "Mozilla/5.0 (Linux; Android 14)" \
            "https://yuxseocdn.yuewen.com/pro/readnovel_m/_prelease/hongxium/modern-js/bqx/index-c1d8654fc0.js" \
            -o out/mobile-bqx.js
          echo "js=$(wc -c < out/mobile-bqx.js)"

      - name: Inspect routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("out/mobile-bqx.js").read_text(encoding="utf-8",errors="replace")
          print("chars",len(s))
          vals=[]
          pats=[
            r'https?://[^"\x27]+',
            r'["\x27](/[^"\x27]{0,200}(?:api|ajax|chapter|read|content|catalog|book)[^"\x27]{0,200})["\x27]',
          ]
          for pat in pats:
            for m in re.finditer(pat,s,re.I):
              v=m.group(1) if m.groups() else m.group(0)
              if v not in vals:vals.append(v)
          print("CANDIDATES")
          for v in vals[:500]:print(v)
          for needle in ["chapter","content","ajax","api","bookId","chapterId","m.qidian","getJSON","fetch(","axios","request"]:
            print("\n###",needle)
            pos=[m.start() for m in re.finditer(re.escape(needle),s,re.I)]
            print("count",len(pos))
            for i in pos[:12]:
              print(s[max(0,i-500):i+1100])
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: witch-readnovel-mobile-api
          path: out/
          retention-days: 1
