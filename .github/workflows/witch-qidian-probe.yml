name: Probe ReadNovel chapter API

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/witch-qidian-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    steps:
      - name: Fetch frontend assets
        run: |
          set -euo pipefail
          mkdir -p out
          curl --compressed --fail --location --retry 3 \
            --user-agent "Mozilla/5.0" \
            "https://www.readnovel.com/bqx/qbdykg" -o out/book.html
          curl --compressed --fail --location --retry 3 \
            --user-agent "Mozilla/5.0" \
            "https://yuxseocdn.yuewen.com/pro/readnovel_pc/_prelease/js/bookquery/index.2dca4.js" \
            -o out/bookquery.js
          echo "book=$(wc -c < out/book.html) js=$(wc -c < out/bookquery.js)"

      - name: Find API and reading routes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("out/bookquery.js").read_text(encoding="utf-8",errors="replace")
          print("JS chars",len(s))
          vals=[]
          for pat in [
              r'https?://[^"\x27]+',
              r'["\x27](/[^"\x27]*(?:api|ajax|chapter|read|content|catalog)[^"\x27]*)["\x27]',
              r'["\x27]([^"\x27]*(?:chapterInfo|chapterContent|bookInfo|catalog|chapterList)[^"\x27]*)["\x27]',
          ]:
              for m in re.finditer(pat,s,re.I):
                  v=m.group(1) if m.groups() else m.group(0)
                  if v not in vals:vals.append(v)
          print("CANDIDATES")
          for x in vals[:400]:print(x)
          for needle in ["chapterContent","chapterInfo","chapterId","bookId","ajax","api","read","content"]:
              print("\nNEEDLE",needle)
              start=0
              for _ in range(8):
                  i=s.lower().find(needle.lower(),start)
                  if i<0:break
                  print(s[max(0,i-400):i+900])
                  start=i+len(needle)
          PY

      - name: Probe mobile book page
        run: |
          set -euo pipefail
          curl --compressed --fail --location --retry 3 \
            --user-agent "Mozilla/5.0 (Linux; Android 14)" \
            "https://m.readnovel.com/bqx/qbdykg" -o out/mobile.html
          echo "mobile=$(wc -c < out/mobile.html)"
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path("out/mobile.html").read_text(encoding="utf-8",errors="replace")
          for pat in [r'https?://[^"\x27 <]+', r'(?:src|href)=["\x27]([^"\x27]+)["\x27]']:
              vals=[]
              for m in re.finditer(pat,s,re.I):
                  v=m.group(1) if m.groups() else m.group(0)
                  if any(k in v.lower() for k in ("js","chapter","read","api")) and v not in vals:
                      vals.append(v)
              for v in vals[:150]:print(v)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: witch-readnovel-api-probe
          path: out/
          retention-days: 1
