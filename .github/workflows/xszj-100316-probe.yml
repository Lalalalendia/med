name: Rulate 100316 - public HTML shape probe
on:
  pull_request:
    paths:
      - "sources/rulate-100316/**"
      - "tools/novel-ingest/xszj_probe.py"
      - ".github/workflows/xszj-100316-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded probe dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Verify chapter metadata without network
        run: python sources/rulate-100316/validate_index.py
      - name: Diagnose public 370 and 450 HTML structure (metadata only)
        run: |
          python tools/novel-ingest/xszj_probe.py \
            --manifest sources/rulate-100316/continuation-370-450.json \
            --ordinals 370 450 \
            --out out/xszj-probe/report.json
      - name: Archive shape diagnostics, never chapter text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rulate-100316-page-shape
          path: out/xszj-probe/report.json
          if-no-files-found: warn
          retention-days: 7
