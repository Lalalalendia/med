name: Narou N3988KA RAW collection
on:
  push:
    branches: [research/narou-n3988ka-ingest]
    paths:
      - 'tools/novel-ingest/narou_ingest.py'
      - 'tools/novel-ingest/test_narou_ingest.py'
      - '.github/workflows/narou-n3988ka-raw.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Offline parser and boundary tests
        run: python -m unittest discover -s tools/novel-ingest -p test_narou_ingest.py -v
      - name: Collect all 58 Narou entries
        id: ingest
        continue-on-error: true
        run: |
          python tools/novel-ingest/narou_ingest.py \
            --ncode n3988ka --expected 58 --delay 1.5 \
            --out-dir out/narou-n3988ka
      - name: Show report
        if: always()
        run: |
          if [ -f out/narou-n3988ka/summary.md ]; then
            cat out/narou-n3988ka/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive chapter bodies and exact receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: narou-n3988ka-raw-001-058
          path: out/narou-n3988ka/**
          if-no-files-found: warn
          retention-days: 7
      - name: Fail on incomplete collection
        if: steps.ingest.outcome != 'success'
        run: exit 1
