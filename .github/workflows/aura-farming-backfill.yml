name: Aura Farming missing RAW backfill

on:
  pull_request:
    paths:
      - '.github/novel-batches/aura-farming-backfill.json'
      - '.github/workflows/aura-farming-backfill.yml'
      - 'tools/novel-ingest/aura_farming_backfill.py'
      - 'tools/novel-ingest/test_aura_farming_backfill.py'
  push:
    branches: [main]
    paths:
      - '.github/novel-batches/aura-farming-backfill.json'
      - '.github/workflows/aura-farming-backfill.yml'
      - 'tools/novel-ingest/aura_farming_backfill.py'
      - 'tools/novel-ingest/test_aura_farming_backfill.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aura-farming-raw-backfill
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Offline extractor and backfill tests
        run: |
          python -m unittest discover -s tools/novel-ingest -p test_source_ingest.py -v
          python -m unittest discover -s tools/novel-ingest -p test_aura_farming_backfill.py -v
  collect:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Collect only missing chapters 026-095 and 097
        id: ingest
        continue-on-error: true
        run: python tools/novel-ingest/aura_farming_backfill.py --out-dir out/aura-farming
      - name: Source receipt
        if: always()
        run: |
          if test -f out/aura-farming/summary.md; then cat out/aura-farming/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Archive English RAW, integrity manifest, and failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aura-farming-raw-missing-026-095-097
          path: out/aura-farming/**
          if-no-files-found: error
          retention-days: 30
      - name: Reject incomplete corpus
        if: steps.ingest.outcome != 'success'
        run: exit 1
