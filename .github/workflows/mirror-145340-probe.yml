name: Book 145340 five-mirror source probe

on:
  push:
    branches: [probe/mirrors-145340-20261017]
    paths:
      - 'tools/novel-ingest/mirror_145340_probe.py'
      - '.github/workflows/mirror-145340-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirrors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HTML parser
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Verify local parser
        run: python tools/novel-ingest/mirror_145340_probe.py --self-test
      - name: Smoke-check IXDZS chapter 635 in normal Chrome
        run: python tools/novel-ingest/ixdzs_browser_635_probe.py
      - name: Probe five given mirrors and candidate chapters
        run: python tools/novel-ingest/mirror_145340_probe.py --delay 1.5 --out-dir out/mirror-145340
      - name: Publish diagnostics summary
        if: always()
        run: |
          if test -f out/mirror-145340/summary.md; then
            cat out/mirror-145340/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload metadata diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mirror-145340-metadata
          path: out/mirror-145340/
          if-no-files-found: warn
          retention-days: 7
