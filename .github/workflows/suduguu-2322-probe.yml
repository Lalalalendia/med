name: Probe Suduguu 2322

on:
  push:
    paths:
      - ".github/workflows/suduguu-2322-probe.yml"
      - "tools/suduguu/probe_2322.py"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/suduguu/probe_2322.py
