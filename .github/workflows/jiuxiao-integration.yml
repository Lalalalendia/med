name: Jiuxiao serial integration

on:
  push:
    branches: [main]
    paths:
      - "tools/jiuxiao/**"
      - ".github/workflows/jiuxiao-integration.yml"
  pull_request:
    paths:
      - "tools/jiuxiao/**"
      - ".github/workflows/jiuxiao-integration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Unit tests for URLs, parsing, and bounded retry
        run: python -m unittest discover -s tools/jiuxiao -p 'test_*.py' -v

      # All live requests use one job and are sequential, so they do not
      # overload the site with overlapping GitHub Actions runners.
      - name: Probe source availability and content metadata
        run: python tools/jiuxiao/source_probe.py --out-dir out/jiuxiao/metadata
      - name: Check large-book next chapter navigation (metadata only)
        run: python tools/jiuxiao/probe_large_catalog.py

      # Text artifact is ONLY the public-domain work of Lu Xun.
      - name: Collect public-domain pilot, chapters 1-3
        run: |
          python tools/jiuxiao/linked_collector.py \
            --book-url "https://jiuxiaozw.com/sim/book/6ab99ea063213dfa71e9a016" \
            --expected-title "故事新编" --limit 3 --delay 2 \
            --out-dir out/jiuxiao/batches/part1
      - name: Resume public-domain pilot, chapters 4-9
        run: |
          NEXT_URL="$(python -c 'import json; print(json.load(open("out/jiuxiao/batches/part1/manifest.json"))["next_url"])')"
          test -n "$NEXT_URL"
          python tools/jiuxiao/linked_collector.py \
            --book-url "https://jiuxiaozw.com/sim/book/6ab99ea063213dfa71e9a016" \
            --expected-title "故事新编" --start-url "$NEXT_URL" \
            --start-ordinal 4 --limit 6 --delay 2 \
            --out-dir out/jiuxiao/batches/part2
      - name: Assemble and verify SHA-256 against accepted pilot
        run: |
          python tools/jiuxiao/assemble_batches.py \
            out/jiuxiao/batches/part1 \
            out/jiuxiao/batches/part2 \
            --out-dir out/jiuxiao/assembled
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path("out/jiuxiao/assembled")
          m=json.loads((p/"manifest.json").read_text(encoding="utf-8"))
          assert m["status"]=="SUCCESS" and m["chapters_collected"]==9
          assert m["batch_count"]==2
          b=(p/"book.txt").read_bytes()
          assert hashlib.sha256(b).hexdigest()==m["sha256_book_txt"]
          assert m["sha256_book_txt"]=="5a59ccb5623ae748777c6b52fac9a63f3bf5952893d50394ebde49c7ead338be"
          assert len(list((p/"chapters").glob("*.txt")))==9
          print("SERIAL_INTEGRATION_SUCCESS",m["title"],m["chapters_collected"],m["text_characters"])
          PY
      - name: Publish source and book metrics
        if: success()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          source=json.loads(Path("out/jiuxiao/metadata/report.json").read_text())
          book=json.loads(Path("out/jiuxiao/assembled/manifest.json").read_text())
          print("# Jiuxiao serial integration\n")
          print("Metadata pages:",len(source["pages"]),"Errors:",len(source["errors"]))
          print("Public-domain chapters:",book["chapters_collected"],"Characters:",book["text_characters"])
          print("SHA-256:",book["sha256_book_txt"])
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jiuxiao-serial-public-domain-and-metadata
          path: |
            out/jiuxiao/metadata/
            out/jiuxiao/assembled/
          retention-days: 7
