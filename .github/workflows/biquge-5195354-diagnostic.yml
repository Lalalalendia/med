name: Biquge 5195354 catalog structure diagnosis
on:
  push:
    branches: ["feat/biquge-5195354-867-tail-20261117"]
    paths: ["tools/novel-ingest/biquge_5195354_diagnostic.py", ".github/workflows/biquge-5195354-diagnostic.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - run: python tools/novel-ingest/biquge_5195354_diagnostic.py
