name: Aibenshu 141911 catalog probe

on:
  push:
    branches: ["collect/aibenshu-141911-from-237"]
    paths: [".github/workflows/aibenshu-141911-probe.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  catalog-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect Aibenshu catalog and chapter links
        run: |
          python - <<'PY'
          import json, re, requests
          from collections import Counter
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin, urlparse
          from pathlib import Path
          url = 'https://www.aibenshu.com/book/141911/'
          s = requests.Session()
          s.headers.update({'User-Agent': 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36', 'Accept-Language':'zh-CN,zh;q=0.9,en;q=0.6'})
          report = {}
          for target in (url, url.replace('www.aibenshu.com', 'aibenshu.com')):
              try:
                  r=s.get(target, timeout=25)
                  r.encoding = r.apparent_encoding or r.encoding
                  soup=BeautifulSoup(r.text, 'html.parser')
                  links=[]
                  for a in soup.select('a[href]'):
                      label=a.get_text(' ',strip=True)
                      href=urljoin(r.url, a.get('href',''))
                      if href.startswith('https://') or href.startswith('http://'):
                          links.append({'text': label[:100], 'href': href})
                  booklinks=[a for a in links if '141911' in a['href']]
                  chapterlinks=[a for a in links if re.search(r'第\s*(?:237|二百三十七)\s*[章节]',a['text'])]
                  data={'request':target,'status':r.status_code,'url':r.url,'bytes':len(r.content),'title':str(soup.title.get_text(' ',strip=True) if soup.title else '')[:150],'h1':[x.get_text(' ',strip=True)[:100] for x in soup.select('h1')[:3]], 'total_links':len(links),'book_links_count':len(booklinks), 'book_link_samples':booklinks[:6]+booklinks[-6:], 'chapter_237':chapterlinks[:6], 'host_counts':Counter(urlparse(a['href']).hostname for a in links).most_common(10), 'selectors':{sel:len(soup.select(sel)) for sel in ('#content','#chaptercontent','.read-content','.booklist','.listmain','.chapterlist','.chapter-list','dd','dt','h1')},'html_start':r.text[:500].replace('\n',' ')}
                  report[target]=data
                  print(json.dumps(data,ensure_ascii=False,indent=2))
                  if r.status_code==200 and chapterlinks:
                      for item in chapterlinks[:1]:
                          try:
                              rr=s.get(item['href'],timeout=25)
                              rr.encoding=rr.apparent_encoding or rr.encoding
                              cc=BeautifulSoup(rr.text,'html.parser')
                              print('CHAPTER237',json.dumps({'url':rr.url,'status':rr.status_code,'bytes':len(rr.content),'title':cc.title.get_text(' ',strip=True) if cc.title else None,'h1':[n.get_text(' ',strip=True) for n in cc.select('h1')[:3]],'selectors':{sel:len(cc.select(sel)) for sel in ('#content','#chaptercontent','.read-content','.content','.txtnav','article','main')},'paragraphs':len(cc.select('p')),'html_start':rr.text[:300]},ensure_ascii=False))
                          except Exception as exc:
                              print('CHAPTER237 ERROR:',repr(exc))
              except Exception as exc:
                  report[target]={'error':repr(exc)}
                  print('FETCH ERROR',target,repr(exc))
          Path('probe.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aibenshu-141911-probe
          path: probe.json
          if-no-files-found: warn
          retention-days: 7
