name: Czbooks s6654j verified collection
on:
  push:
    branches: [collect/czbooks-s6654j]
    paths:
      - tools/novel-ingest/czbooks_ingest.py
      - tools/novel-ingest/test_czbooks_ingest.py
      - .github/workflows/czbooks-s6654j.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - run: python -m unittest discover -s tools/novel-ingest -p test_czbooks_ingest.py -v
  collect:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - {start: 1, end: 257}
          - {start: 258, end: 514}
          - {start: 515, end: 771}
          - {start: 772, end: 1028}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Fetch and validate chapter shard
        id: collect
        continue-on-error: true
        run: |
          python tools/novel-ingest/czbooks_ingest.py collect --start ${{ matrix.start }} --end ${{ matrix.end }} --out-dir out/shard --expected 1028 --delay 2.5
      - name: Summarize
        if: always()
        run: if test -f out/shard/summary.md; then cat out/shard/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: czbooks-part-${{ matrix.start }}
          path: out/shard/**
          if-no-files-found: warn
          retention-days: 7
      - if: steps.collect.outcome != 'success'
        run: exit 1
  merge:
    if: always() && needs.test.result == 'success'
    needs: [test, collect]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - uses: actions/download-artifact@v4
        with:
          pattern: czbooks-part-*
          path: out/parts
      - name: Merge strictly after SHA256 and 1028/1028 checks
        id: closure
        continue-on-error: true
        run: python tools/novel-ingest/czbooks_ingest.py merge --parts-root out/parts --out-dir out/merged --expected 1028
      - name: Summary
        if: always()
        run: if test -f out/merged/summary.md; then cat out/merged/summary.md >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: czbooks-s6654j-combined
          path: out/merged/**
          if-no-files-found: warn
          retention-days: 7
      - if: steps.closure.outcome != 'success'
        run: exit 1
