name: Suduguu 303 HTML preflight
on:
  push:
    branches: [raw/suduguu-303-650-855]
    paths:
      - ".github/workflows/suduguu-303-probe.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Inspect chapter structure without logging copyright text
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          S = requests.Session()
          S.headers['User-Agent']='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/129 Safari/537.36'
          url='https://www.suduguu.com/303/'
          r=S.get(url,timeout=35);print('CATALOG_STATUS',r.status_code,'SIZE',len(r.content),'URL',r.url,flush=True);r.raise_for_status()
          soup=BeautifulSoup(r.content,'html.parser')
          print('TITLE_OK','百世修仙' in (soup.title.get_text() if soup.title else ''),flush=True)
          items=[]
          for a in soup.find_all('a',href=True):
              t=a.get_text(' ',strip=True)
              m=re.match(r'^第\s*(\d+)\s*章',t)
              u=urljoin(url,a['href'])
              if m and '/303/' in u:items.append((int(m.group(1)),u,t))
          print('NUMBERED_LINKS',len(items),'UNIQUE_URLS',len(set(x[1] for x in items)),'MIN',min((i[0] for i in items),default=0),'MAX',max((i[0] for i in items),default=0))
          for k in (649,650,651,700,852,853,854,855):
              rows=[i for i in items if i[0]==k]
              print('CATALOG_ENTRY',k,[(u,t[:75]) for _,u,t in rows],flush=True)
          for n in (650,651,853,854):
              rows=[i for i in items if i[0]==n]
              for _no,u,t in rows[:2]:
                  r=S.get(u,timeout=35)
                  s=BeautifulSoup(r.content,'html.parser')
                  print('PAGE',n,'STATUS',r.status_code,'LEN',len(r.content),'TITLE',repr(s.title.get_text(' ',strip=True)[:95] if s.title else None),flush=True)
                  for sel in ('#chaptercontent','#content','.content','.chapter-content','article','main','body'):
                      els=s.select(sel)
                      print('ELEMENT',n,sel,[(len(x.get_text(' ',strip=True)),x.name,x.get('id'),x.get('class')) for x in els[:2]],flush=True)
                  nav=[(a.get_text(' ',strip=True)[:16],urljoin(u,a['href'])) for a in s.find_all('a',href=True) if '下' in a.get_text(' ',strip=True) and ('页' in a.get_text(' ',strip=True) or '頁' in a.get_text(' ',strip=True))]
                  print('PAGE_NEXT',n,nav[:8],flush=True)
                  print('CHINESE_CHARS',n,len(re.findall(r'[\u4e00-\u9fff]',s.get_text(' ',strip=True))),flush=True)
          for number in (650,854):
              url=next((u for n,u,t in items if n==number),None)
              if not url:continue
              response=S.get(url,timeout=35)
              tree=BeautifulSoup(response.content,'html.parser')
              print('STRUCTURE_START',number,flush=True)
              for child in list(tree.body.children):
                  if getattr(child,'name',None):
                      print('BODY_CHILD',child.name,child.get('id'),child.get('class'),'length',len(child.get_text(' ',strip=True)), 'links',len(child.find_all('a')),flush=True)
              for tag in tree.body.find_all(True):
                  if tag.name in ('p','div','section','article','main','h1','h2','h3','dl','dd','font','span','table'):
                      own=tag.find_all(['p','div','section','article','main','h1','h2','h3','dl','dd','font','span','table'],recursive=False)
                      ln=len(tag.get_text(' ',strip=True))
                      if (ln>350 and len(own)<15) or tag.name.startswith('h'):
                          print('NODE',tag.name,'id',tag.get('id'),'class',tag.get('class'),'style',str(tag.get('style'))[:100],'length',ln,'direct_children',len(own),'hrefs',len(tag.find_all('a')),flush=True)
              for j, root in enumerate(tree.select('div.container')[:2]):
                  print('CONTAINER',number,j,'length',len(root.get_text(' ',strip=True)),flush=True)
                  for child in root.find_all(True):
                      depth=len(list(child.parents))-len(list(root.parents))
                      if depth<=3:
                          print('SUBNODE',number,j,'depth',depth,'tag',child.name,'id',child.get('id'),'class',child.get('class'),'chars',len(child.get_text(' ',strip=True)),'links',len(child.find_all('a')),flush=True)
              c=0
              cur=url
              while cur and c<16:
                  r=S.get(cur,timeout=35)
                  q=BeautifulSoup(r.content,'html.parser')
                  nxt=[urljoin(cur,a.get('href','')) for a in q.find_all('a',href=True) if a.get_text(' ',strip=True) in ('下一页','下一頁')]
                  print('PART',number,c+1,'url',cur,'html_len',len(r.content),'bodylen',len(q.body.get_text(' ',strip=True)),'next',nxt[:2],flush=True)
                  cur=nxt[0] if nxt and nxt[0]!=cur else None
                  c+=1
              print('STRUCTURE_END',number,flush=True)
          PY
      - name: Cross-check canonical chapter titles in other sources
        run: |
          python - <<'PY'
          import re
          import requests
          from bs4 import BeautifulSoup
          urls=[
            'https://m.kudushu.org/book/1076685/',
            'https://www.xs8.cn/bookquery/fobpskdylwcl',
            'https://www.xiaoshuo.com.tw/883717/',
            'https://www.hongxiu.com/bookquery/qbxamilwskyc'
          ]
          s=requests.Session()
          s.headers['User-Agent']='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/129 Safari/537.36'
          for url in urls:
              try:
                  r=s.get(url,timeout=30); print('ALT_STATUS',url,r.status_code,'BYTES',len(r.content),'FINAL',r.url,flush=True)
                  soup=BeautifulSoup(r.content,'html.parser')
                  print('ALT_TITLE',url,repr(soup.title.get_text(' ',strip=True)[:120] if soup.title else ''),flush=True)
                  anchors=[]
                  for a in soup.find_all('a',href=True):
                      t=re.sub(r'\s+',' ',a.get_text(' ',strip=True))
                      m=re.search(r'第\s*(\d+)\s*章\s*(.+)',t)
                      if m:
                          anchors.append((int(m.group(1)),m.group(2).strip(),requests.compat.urljoin(r.url,a['href'])))
                  print('ALT_LINKS',url,'count',len(anchors),'unique',len(set(x[0] for x in anchors)),'min',min((x[0] for x in anchors),default=None),'max',max((x[0] for x in anchors),default=None),flush=True)
                  for n in (649,650,651,652,750,758,769,770,771,772,773,774,853,854,855):
                      matches=[x for x in anchors if x[0]==n][:1]
                      if matches:print('ALT_MATCH',url,n,matches,flush=True)
              except Exception as e:print('ALT_ERROR',url,type(e).__name__,str(e)[:250],flush=True)
          PY

      - name: Reconcile all canonical 650-855 chapters against Suduguu titles
        run: |
          python - <<'PY'
          import re, unicodedata, collections, requests
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin
          s=requests.Session()
          s.headers['User-Agent']='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/129 Safari/537.36'
          def links(url):
              r=s.get(url,timeout=45);r.raise_for_status()
              o=[]
              for a in BeautifulSoup(r.content,'html.parser').find_all('a',href=True):
                  m=re.match(r'^第\s*(\d+)\s*章\s*(.+)$',a.get_text(' ',strip=True))
                  if m: o.append((int(m.group(1)),m.group(2).strip(),urljoin(r.url,a['href'])))
              return o
          def norm(t):
              return ''.join(x for x in unicodedata.normalize('NFKC',t) if x.isalnum())
          ref=links('https://www.xs8.cn/bookquery/fobpskdylwcl')
          source=links('https://www.suduguu.com/303/')
          expected=set(range(650,856))
          canonical={}
          for n,t,u in ref:
              if n in expected:
                  if n in canonical and canonical[n][0]!=t:print('REF_CONFLICT',n,canonical[n][0],t,flush=True)
                  canonical[n]=(t,u)
          print('REF_MISSING',sorted(expected-set(canonical)),flush=True)
          used=set()
          matches={}
          for n in sorted(canonical):
              t,_=canonical[n]
              candidates=[(sn,st,u) for sn,st,u in source if norm(st)==norm(t) and abs(sn-n)<=5 and u not in used]
              candidates=list(dict((u,(sn,st,u)) for sn,st,u in candidates).values())
              if len(candidates)==1:
                  matches[n]=candidates[0];used.add(candidates[0][2])
              else:print('MATCH_PROBLEM',n,t,candidates[:6],flush=True)
          print('MATCH_TOTAL',len(matches),'EXPECTED',len(expected),'UNMATCHED',sorted(expected-set(matches)),flush=True)
          offsets=collections.Counter(n-v[0] for n,v in matches.items())
          print('OFFSETS',dict(offsets),flush=True)
          for n in (650,651,652,659,660,720,723,724,740,750,760,769,770,771,772,773,774,800,851,852,853,854,855):
              print('RECONCILED',n,canonical.get(n),matches.get(n),flush=True)
          PY
