name: OA EN MTL bridge 221-290 - manual

on:
  pull_request:
    paths:
      - 'tools/fanmtl-bridge/**'
      - '.github/workflows/oa-mtl-bridge.yml'
  workflow_dispatch:
    inputs:
      source:
        description: "Public EN MTL source"
        required: true
        type: choice
        options:
          - fanmtl
          - wuxiabox
        default: fanmtl
      story_start:
        required: true
        default: "221"
      story_end:
        required: true
        default: "225"

permissions:
  contents: read

concurrency:
  group: oa-mtl-${{ github.ref }}-${{ inputs.source }}-${{ inputs.story_start }}-${{ inputs.story_end }}
  cancel-in-progress: false

jobs:
  verify-and-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Run fetcher unit tests
        run: python -m unittest discover -s tools/fanmtl-bridge -p 'test_*.py' -v
      - name: Fetch selected EN chapters
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE: ${{ inputs.source }}
          STORY_START: ${{ inputs.story_start }}
          STORY_END: ${{ inputs.story_end }}
        run: |
          python tools/fanmtl-bridge/fetch_fanmtl_bridge.py \
            --book oa --source "$SOURCE" \
            --story-start "$STORY_START" --story-end "$STORY_END" \
            --delay 1.5 --strict --out-dir out/oa-mtl
      - name: Fetch OA 226-235 from confirmed public Wuxiabox source
        if: github.event_name == 'pull_request' && github.head_ref == 'feature/oa-mtl-bridge-221-290'
        run: |
          python tools/fanmtl-bridge/fetch_fanmtl_bridge.py \
            --book oa --source wuxiabox \
            --story-start 226 --story-end 235 \
            --delay 2.0 --strict --out-dir out/oa-mtl
      - name: Summarize findings
        if: always()
        run: |
          if [ -f out/oa-mtl/summary.md ]; then
            cat out/oa-mtl/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Archive extraction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oa-mtl-${{ github.event_name }}-${{ github.run_id }}
          path: out/oa-mtl/**
          retention-days: 7
          if-no-files-found: warn
