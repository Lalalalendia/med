name: Hongyeshuzhal 156757 - verified public original
on:
  push:
    branches: [collect/hongyeshuzhal-156757-20261125]
    paths: [.github/workflows/hongyeshuzhal-156757-collect.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Collect and verify public chapter text
        run: |
          python - <<'PY'
          import hashlib, json, re, time, unicodedata
          from pathlib import Path
          from urllib.parse import urljoin, urlsplit, urldefrag
          import requests
          from bs4 import BeautifulSoup

          base = 'https://hongyeshuzhal.com/shuzhai/156757/'
          out = Path('out/hongyeshuzhal-156757')
          out.mkdir(parents=True, exist_ok=True)
          (out/'chapters').mkdir(exist_ok=True)
          session = requests.Session()
          session.headers.update({'User-Agent':'med-authorized-collection/1.0', 'Accept-Language':'zh-CN,zh;q=0.9'})
          records, errors, catalog = [], [], []
          cn = '零〇一二三四五六七八九十百千万兩两'
          chapter_re = re.compile(r'第\s*([0-9'+cn+r']+)\s*[章回節节]')
          han = re.compile(r'[\u3400-\u9fff]')
          allowed_host = {'hongyeshuzhal.com','www.hongyeshuzhal.com'}
          def norm(s):
              return re.sub(r'\s+',' ',unicodedata.normalize('NFKC',s)).strip()
          def ordinal(t):
              m=chapter_re.search(norm(t))
              if not m: return None
              s=m.group(1)
              if s.isdecimal(): return int(s)
              d=dict(zip('零一二三四五六七八九',range(10)))
              d.update({'〇':0,'兩':2,'两':2})
              if all(c in d for c in s): return int(''.join(str(d[c]) for c in s))
              total=section=num=0
              for c in s:
                  if c in d: num=d[c]
                  elif c in '十百千':
                      section+=(num or 1)*{'十':10,'百':100,'千':1000}[c];num=0
                  elif c=='万':
                      total+=(section+num)*10000;section=num=0
                  else: return None
              return total+section+num
          def safe(u):
              u=urldefrag(u)[0]
              p=urlsplit(u)
              return p.scheme=='https' and p.hostname in allowed_host
          class AccessStop(Exception): pass
          def get(u):
              if not safe(u): raise AccessStop('outside authorized source: '+u)
              time.sleep(1.0)
              r=session.get(u,timeout=(12,30),allow_redirects=False)
              for _ in range(4):
                  if r.is_redirect:
                      u=urljoin(u,r.headers['Location'])
                      if not safe(u): raise AccessStop('redirect outside authorized source: '+u)
                      time.sleep(1.0)
                      r=session.get(u,timeout=(12,30),allow_redirects=False)
                  else: break
              if r.status_code in (401,403,429,451,503):
                  raise AccessStop('HTTP '+str(r.status_code)+' at '+u)
              r.raise_for_status()
              if r.status_code!=200: raise RuntimeError('HTTP '+str(r.status_code))
              soup=BeautifulSoup(r.content,'html.parser')
              if soup.title and re.search(r'captcha|access denied|just a moment|verify you are human',soup.title.get_text(),re.I):
                  raise AccessStop('access challenge at '+u)
              return soup,r.url
          def links(soup,url):
              def extract(node):
                  items=[]
                  for a in node.select('a[href]'):
                      t=norm(a.get_text(' ',strip=True))
                      v=urldefrag(urljoin(url,a['href']))[0]
                      if not t or not safe(v) or v==url or not re.fullmatch(r'/shuzhai/156757/[0-9]+\.html',urlsplit(v).path):
                          continue
                      if re.fullmatch(r'(?:开始阅读|開始閱讀|立即阅读|立即閱讀|最新章节|最新章節|加入书架|加入書架|点击阅读|點擊閱讀|继续阅读|繼續閱讀|阅读|閱讀|[0-9]+)',t):
                          continue
                      items.append((ordinal(t),t,v))
                  return items
              all_items=extract(soup)
              candidates=[]
              for node in soup.select('dl,ul,ol,div,section,article,main'):
                  if len(node.find_all('a',href=True,limit=10))<10: continue
                  rows=extract(node)
                  if rows:
                      candidates.append((len({r[2] for r in rows}),-len(rows),-len(node.find_all('a',href=True)),rows))
              if candidates:
                  best=max(candidates,key=lambda x:x[:3])
                  if best[0]==len({r[2] for r in all_items}):
                      all_items=best[3]
              dedup={}
              for row in all_items:
                  dedup.setdefault(row[2],row)
              return list(dedup.values())
          def catalog_pages(soup,url):
              for a in soup.select('a[href]'):
                  t=norm(a.get_text(' ',strip=True))
                  v=urljoin(url,a['href'])
                  p=urlsplit(v)
                  if not safe(v) or not p.path.startswith('/shuzhai/156757'): continue
                  if ordinal(t) is not None: continue
                  if re.fullmatch(r'下一[页頁]|下[一]?頁|下一页[>»›]*|[0-9]+|[>»›]+',t) and (p.query or re.search(r'(?:index|list|page)[_-]?\d',p.path,re.I)):
                      yield urldefrag(v)[0]
          def body(soup):
              selectors=['#chaptercontent','#nr1','#chapter_body','#articlecontent','.article-content','.chapter-body','#chapterContent','#chapter_content','#content','#txtcontent','#txtContent','#readcontent','#readContent','.chapter-content','.chapter_content','.read-content','.readcontent','.read-content-text','.txtcontent','.book-content','.content']
              candidates=[]
              for sel in selectors:
                  for node in soup.select(sel):
                      copy=BeautifulSoup(str(node),'html.parser')
                      for z in copy.select('script,style,iframe,ins,nav,header,footer,button,form,.ads,.ad,.advertisement,.pagination,.page,.bottem,.bottom,.chapter-nav,h1,h2'):
                          z.decompose()
                      for z in copy.select('a'):
                          if len(z.get_text(strip=True))<60: z.decompose()
                      raw=copy.get_text('\n',strip=True)
                      lines=[norm(x) for x in raw.splitlines()]
                      lines=[x for x in lines if x and not re.fullmatch(r'(?:上一[章页頁]|下一[章页頁]|返回目[录錄]|加入書架|加入书架|目[录錄]|上一章下一章)[\s>»›<]*',x)]
                      content='\n\n'.join(lines)
                      count=len(han.findall(content))
                      if count>=100 and count>=0.4*len(re.sub(r'\s','',content)):
                          candidates.append((sel,content,count))
              if not candidates: raise RuntimeError('no reliable body selector')
              return candidates[0]
          def chapter_page(n,title,u,strict_title=False):
              seen=set(); pieces=[]; pages=[]; selectors=[]
              for _ in range(40):
                  if u in seen: raise RuntimeError('pagination loop')
                  seen.add(u)
                  soup,actual=get(u)
                  headings=[norm(z.get_text(' ',strip=True)) for z in soup.select('h1,h2,.chapter-title,.chapter_title,.title')]
                  headings += [norm(soup.title.get_text(' ',strip=True))] if soup.title else []
                  ords={ordinal(t) for t in headings if ordinal(t) is not None}
                  compact=lambda t: re.sub(r'[\W_]+','',norm(t))
                  title_ok=any(compact(title) and compact(title) in compact(h) for h in headings)
                  if n is not None and n not in ords and not title_ok: raise RuntimeError('chapter heading ordinal not verified: '+str(sorted(ords)))
                  if (n is None or strict_title) and not title_ok: raise RuntimeError('chapter title not verified: '+str(headings[:3]))
                  selector,content,count=body(soup)
                  if content in pieces: raise RuntimeError('duplicate pagination body')
                  pieces.append(content);pages.append(actual);selectors.append(selector)
                  more=[]
                  for a in soup.select('a[href]'):
                      t=norm(a.get_text(' ',strip=True))
                      if re.fullmatch(r'(?:下一[页頁]|下[一]?頁|下页|下頁)[\s>»›]*',t):
                          v=urldefrag(urljoin(actual,a['href']))[0]
                          if safe(v) and v not in seen and '/shuzhai/156757/' in urlsplit(v).path: more.append(v)
                  more=list(dict.fromkeys(more))
                  if len(more)>1: raise RuntimeError('ambiguous next page')
                  if not more:
                      if re.search(r'(?:本章未完|本章尚未完|请点击下一页|請點擊下一頁|未完待续|未完待續)',content[-180:]) and re.search(r'下一[页頁]',content[-180:]):
                          raise RuntimeError('possible truncated chapter')
                      break
                  u=more[0]
              else: raise RuntimeError('pagination limit')
              text='\n\n'.join(pieces)
              if len(han.findall(text))<250: raise RuntimeError('short chapter; manual review required')
              return text,pages,selectors

          status='failed'
          title='unknown'
          anomalies={}
          deadline=time.monotonic()+45*60
          try:
              soup,actual=get(base)
              title=norm(soup.select_one('h1').get_text(' ',strip=True)) if soup.select_one('h1') else norm(soup.title.get_text(' ',strip=True)) if soup.title else 'unknown'
              print('BOOK',title,'URL',actual)
              queue=[(soup,actual)]; visited=set(); entries=[]
              while queue:
                  page,url=queue.pop(0)
                  if url in visited: continue
                  visited.add(url)
                  if len(visited)>100: raise RuntimeError('catalog pagination limit')
                  entries.extend(links(page,url))
                  for v in catalog_pages(page,url):
                      if v not in visited and not any(v==q[1] for q in queue):
                          s,p=get(v);queue.append((s,p))
              by_url={}
              for n,t,u in entries:
                  if u not in by_url or (by_url[u][0] is None and n is not None):
                      by_url[u]=(n,t)
              catalog=[{'sequence':i,'ordinal':n,'title':t,'url':u} for i,(u,(n,t)) in enumerate(by_url.items(),1)]
              if not catalog: raise RuntimeError('no chapter catalog links; inspect source layout')
              by_num={}
              for row in catalog:
                  if row['ordinal'] is not None:
                      by_num.setdefault(row['ordinal'],[]).append(row)
              if not by_num: raise RuntimeError('no numbered chapters in discovered links')
              ords=[r['ordinal'] for r in catalog if r['ordinal'] is not None]
              rises=sum(a<b for a,b in zip(ords,ords[1:]))
              falls=sum(a>b for a,b in zip(ords,ords[1:]))
              if falls>10*max(rises,1):
                  catalog.reverse()
                  for i,row in enumerate(catalog,1): row['sequence']=i
                  rises,falls=falls,rises
              duplicates={n:[{'title':r['title'],'url':r['url']} for r in rows] for n,rows in by_num.items() if len(rows)>1}
              gaps=sorted(set(range(1,max(by_num)+1))-set(by_num))
              unnumbered=[{'sequence':r['sequence'],'title':r['title'],'url':r['url']} for r in catalog if r['ordinal'] is None]
              anomalies={'missing_printed_ordinals':gaps,'repeated_printed_ordinals':duplicates,'unnumbered_entries':unnumbered,'order_rises':rises,'order_falls':falls}
              (out/'catalog.json').write_text(json.dumps(catalog,ensure_ascii=False,indent=2),encoding='utf-8')
              (out/'catalog-anomalies.json').write_text(json.dumps(anomalies,ensure_ascii=False,indent=2),encoding='utf-8')
              print('CATALOG',len(catalog),'pages',len(visited),'unique numbered',len(by_num),'max',max(by_num),flush=True)
              print('ANOMALIES',json.dumps(anomalies,ensure_ascii=False),flush=True)
              print('CATALOG_FIRST',json.dumps(catalog[:5],ensure_ascii=False),flush=True)
              print('CATALOG_LAST',json.dumps(catalog[-5:],ensure_ascii=False),flush=True)
              if falls>max(10,rises*0.15): raise RuntimeError('catalog order inconsistent; manual review required')
              hashes=set()
              for row in catalog:
                  n,t,u=row['ordinal'],row['title'],row['url']
                  seq=row['sequence']
                  if time.monotonic()>deadline:
                      errors.append({'sequence':seq,'error':'time budget reached'});break
                  try:
                      content,pages,selectors=chapter_page(n,t,u,strict_title=n in duplicates)
                      digest=hashlib.sha256(content.encode()).hexdigest()
                      if digest in hashes: raise RuntimeError('duplicate chapter body')
                      hashes.add(digest)
                      filename=f'{seq:05d}.txt'
                      (out/'chapters'/filename).write_text(t+'\n\n'+content+'\n',encoding='utf-8')
                      records.append({**row,'status':'verified','file':filename,'chars':len(content),'han':len(han.findall(content)),'sha256_body':digest,'pages':pages,'selectors':selectors})
                      if len(records)%5==0: print('VERIFIED',len(records),'of',len(catalog),flush=True)
                  except AccessStop as e:
                      errors.append({'sequence':seq,'ordinal':n,'error':str(e)});break
                  except Exception as e:
                      errors.append({'sequence':seq,'ordinal':n,'error':str(e)})
                      if len(errors)<=10: print('CHAPTER_ERROR',seq,n,str(e),flush=True)
                      if seq>=5 and not records: break
              status='verified_catalog' if len(records)==len(catalog) and not errors else 'partial' if records else 'failed'
          except Exception as e:
              errors.append({'error':str(e)})
              print('STOP',type(e).__name__,str(e))
          finally:
              if records:
                  name='original-verified.txt' if status=='verified_catalog' else 'original-partial.txt'
                  (out/name).write_text('\n\n'.join((out/'chapters'/r['file']).read_text(encoding='utf-8').rstrip() for r in records)+'\n',encoding='utf-8')
              manifest={'source':base,'title':title,'status':status,'catalog_count':len(catalog),'verified_count':len(records),'unverified_sequences':sorted({r['sequence'] for r in catalog}-{r['sequence'] for r in records}),'catalog_anomalies':anomalies,'chapters':records,'errors':errors,'note':'Verified against discovered public catalog only; no claim about unpublished or undiscovered chapters.'}
              (out/'manifest.json').write_text(json.dumps(manifest,ensure_ascii=False,indent=2),encoding='utf-8')
              summary=f'# {title}\n\nStatus: {status}\n\nVerified: {len(records)}/{len(catalog)}\n\nErrors: {len(errors)}\n'
              (out/'summary.md').write_text(summary,encoding='utf-8')
              print(summary)
          if status!='verified_catalog': raise SystemExit(1)
          PY
      - name: Publish summary
        if: always()
        run: |
          if test -f out/hongyeshuzhal-156757/summary.md; then
            cat out/hongyeshuzhal-156757/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload collection or failure receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hongyeshuzhal-156757-verified-original
          path: out/hongyeshuzhal-156757/**
          if-no-files-found: error
          retention-days: 14
