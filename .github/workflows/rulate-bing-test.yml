name: Rulate Bing test

on:
  push:
    paths:
      - '.github/workflows/rulate-bing-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Query Bing
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import quote_plus
          q='site:tl.rulate.ru/book Atarax переводчики Модератор'
          u='https://www.bing.com/search?q='+quote_plus(q)+'&count=50&setlang=ru'
          r=requests.get(u,headers={'User-Agent':'Mozilla/5.0'},timeout=30)
          print('STATUS',r.status_code,len(r.text),r.url)
          soup=BeautifulSoup(r.text,'html.parser')
          for i,h2 in enumerate(soup.select('li.b_algo h2')[:25],1):
              a=h2.find('a',href=True)
              if a: print(i,'|',' '.join(a.stripped_strings),'|',a['href'])
          PY
