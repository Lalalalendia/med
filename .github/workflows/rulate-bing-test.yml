name: Rulate search test

on:
  push:
    paths:
      - '.github/workflows/rulate-bing-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Query search engines
        run: |
          python - <<'PY'
          import requests
          from bs4 import BeautifulSoup
          from urllib.parse import quote_plus, urlparse, parse_qs, unquote
          q='site:tl.rulate.ru/book "Atarax" "Модератор"'
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36'}

          # DuckDuckGo HTML
          u='https://html.duckduckgo.com/html/?q='+quote_plus(q)
          r=requests.get(u,headers=H,timeout=30)
          print('DDG',r.status_code,len(r.text),r.url)
          s=BeautifulSoup(r.text,'html.parser')
          for i,a in enumerate(s.select('a.result__a')[:30],1):
              href=a.get('href','')
              qs=parse_qs(urlparse(href).query)
              if 'uddg' in qs: href=unquote(qs['uddg'][0])
              print('D',i,'|',' '.join(a.stripped_strings),'|',href)

          # Google
          u='https://www.google.com/search?q='+quote_plus(q)+'&num=100&hl=ru'
          r=requests.get(u,headers=H,timeout=30)
          print('GOOGLE',r.status_code,len(r.text),r.url)
          s=BeautifulSoup(r.text,'html.parser')
          for i,a in enumerate(s.select('a')[:300],1):
              h=a.get('href','')
              if h.startswith('/url?q='): h=h.split('/url?q=',1)[1].split('&',1)[0]
              if 'tl.rulate.ru/book/' in h:
                  print('G',i,'|',' '.join(a.stripped_strings),'|',h)
          PY
