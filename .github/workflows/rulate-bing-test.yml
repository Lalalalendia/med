name: Rulate form inspect
on:
  push:
    paths:
      - '.github/workflows/rulate-bing-test.yml'
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Inspect search form
        run: |
          python - <<'PY'
          import requests, re
          from bs4 import BeautifulSoup
          r=requests.get('https://tl.rulate.ru/search',headers={'User-Agent':'Mozilla/5.0','Accept-Language':'ru-RU,ru;q=0.9'},timeout=30)
          print('STATUS',r.status_code,len(r.text))
          s=BeautifulSoup(r.text,'html.parser')
          for form in s.find_all('form'):
              txt=' '.join(form.stripped_strings)
              if 'Автор/Переводчик' in txt or 'Поиск переводов' in txt:
                  print('FORM_ACTION',form.get('action'),'METHOD',form.get('method'))
                  for tag in form.find_all(['input','select','option']):
                      print(tag.name, 'name=',tag.get('name'),'type=',tag.get('type'),'value=',tag.get('value'),'id=',tag.get('id'),'text=', ' '.join(tag.stripped_strings)[:80])
          idx=r.text.find('Автор/Переводчик')
          print('RAW_AROUND',r.text[max(0,idx-2500):idx+2500])
          PY
