name: Faloo 1239043 persist RAW 1-54

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/faloo-1239043-persist.yml"

permissions:
  contents: write

jobs:
  persist-raw:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install parser dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch public RAW 1-54
        run: |
          set -euo pipefail
          rm -rf out/faloo
          python tools/faloo-public/fetch_public_chapters.py \
            --book-id "1239043" \
            --start "1" \
            --end "54" \
            --delay "0.5" \
            --out-dir out/faloo

      - name: Clean Faloo page chrome
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          src = Path("out/faloo/chapters")
          dst = Path("novels/faloo/1239043/raw")
          dst.mkdir(parents=True, exist_ok=True)

          stop_markers = {
              "飞卢小说，飞要你好看！",
              "读书三件事：阅读，收藏，加打赏！",
              "开启懒人阅读模式",
          }

          manifest = []
          for p in sorted(src.glob("*.txt")):
              lines = p.read_text(encoding="utf-8").splitlines()
              chapter = int(p.stem)
              source = next((x.split("Source: ", 1)[1] for x in lines if x.startswith("Source: ")), "")
              title_meta = next((x.split("Title: ", 1)[1] for x in lines if x.startswith("Title: ")), "")

              try:
                  start = lines.index("从本章开始听") + 1
              except ValueError:
                  start = 0

              end = len(lines)
              for i in range(start, len(lines)):
                  if lines[i].strip() in stop_markers:
                      end = i
                      break

              body = [x.rstrip() for x in lines[start:end]]
              while body and not body[0].strip():
                  body.pop(0)
              while body and not body[-1].strip():
                  body.pop()

              # Extract the displayed chapter title from Faloo metadata.
              m = re.search(r"(第\d+章[:：][^（]+)", title_meta)
              cn_title = m.group(1).strip() if m else f"第{chapter}章"

              out = [
                  f"Chapter: {chapter}",
                  f"Source: {source}",
                  f"CN-Title: {cn_title}",
                  "",
                  *body,
                  "",
              ]
              (dst / f"{chapter:03d}.txt").write_text("\n".join(out), encoding="utf-8")
              manifest.append(f"{chapter:03d}\t{cn_title}\t{source}")

          (dst / "manifest.tsv").write_text("\n".join(manifest) + "\n", encoding="utf-8")
          PY

      - name: Commit canonical RAW corpus
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add novels/faloo/1239043/raw
          if git diff --cached --quiet; then
            echo "No corpus changes"
            exit 0
          fi
          git commit -m "Persist Faloo 1239043 RAW chapters 1-54"
          git push
