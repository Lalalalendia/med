name: Chinese chapter metadata census

on:
  pull_request:
    paths:
      - 'tools/novel-ingest/chapter_coverage_census.py'
      - '.github/workflows/chinese-chapter-census.yml'
  workflow_dispatch:
    inputs:
      book:
        description: 'Which book to audit'
        type: choice
        options:
          - all
          - never-decrypt
          - three-laws
        default: all
      limit:
        description: 'Chapter bodies per book (0 means full)'
        default: '0'
        required: true

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Verify parser with local fixtures
        run: python tools/novel-ingest/chapter_coverage_census.py --self-test
      - name: Audit public metadata only
        if: github.event_name == 'workflow_dispatch'
        run: |
          python tools/novel-ingest/chapter_coverage_census.py \
            --book "${{ inputs.book }}" \
            --limit "${{ inputs.limit }}" \
            --delay 2 \
            --out out/chapter-census
      - name: Publish status summary
        if: always()
        run: |
          if test -f out/chapter-census/summary.md; then
            cat out/chapter-census/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-coverage-census
          path: out/chapter-census/
          if-no-files-found: warn
          retention-days: 14
