name: Marvel Troll 221692 - CN RAW 006-010
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/marvel-troll-221692-next5.yml"
      - "tools/novel-ingest/marvel_troll_221692_next5.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Fetch chapter pages 006-010
        run: python tools/novel-ingest/marvel_troll_221692_next5.py
      - name: Upload manifest and chapter texts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: marvel-troll-221692-cn-006-010
          path: out/marvel-troll-221692/006-010/
          if-no-files-found: warn
          retention-days: 7
