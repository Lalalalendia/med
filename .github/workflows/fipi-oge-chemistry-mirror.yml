name: FIPI OGE chemistry selected qids - mirror audit

on:
  push:
    branches:
      - feat/fipi-oge-chemistry-46-20261119
    paths:
      - "tools/fipi_oge_chemistry_46_mirror.py"
      - ".github/workflows/fipi-oge-chemistry-mirror.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - name: Probe third-party mirror for selected qids
        run: python tools/fipi_oge_chemistry_46_mirror.py --limit 46
      - name: Upload third-party results with provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fipi-oge-chemistry-mirror-46
          path: artifacts/fipi-oge-chemistry-46-mirror/
          if-no-files-found: warn
          retention-days: 30
