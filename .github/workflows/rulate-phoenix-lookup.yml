name: Rulate phoenix lookup

on:
  push:
    paths:
      - '.github/workflows/rulate-phoenix-lookup.yml'

jobs:
  lookup:
    runs-on: ubuntu-latest
    steps:
      - run: python -m pip install --quiet requests beautifulsoup4
      - name: Yahoo lookup
        run: |
          python - <<'PY'
          import requests, re, html
          from bs4 import BeautifulSoup
          from urllib.parse import quote_plus, urlparse, parse_qs, unquote
          H={'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124 Safari/537.36','Accept-Language':'ru-RU,ru;q=0.9,en;q=0.8'}
          S=requests.Session(); S.headers.update(H)
          queries=[
            '"Marvel: Сила Феникса"',
            '"Marvel: Сила Феникса" tl.rulate.ru',
            'site:tl.rulate.ru "Marvel: Сила Феникса"',
            '"Phoenix Force from an American Comic" "Marvel: Сила Феникса"',
            'site:tl.rulate.ru/book "Phoenix Force" "193"',
            'site:tl.rulate.ru/book "Luo Yang" Phoenix',
          ]
          for q in queries:
            u='https://search.yahoo.com/search?p='+quote_plus(q)+'&n=100'
            r=S.get(u,timeout=30)
            print('\nQUERY',q,'STATUS',r.status_code,'LEN',len(r.text))
            s=BeautifulSoup(r.text,'html.parser')
            for a in s.find_all('a',href=True):
              txt=' '.join(a.stripped_strings).strip()
              h=html.unescape(a.get('href',''))
              if 'rulate.ru' in h.lower() or 'rulate' in txt.lower() or 'феникс' in txt.lower() or 'phoenix' in txt.lower():
                print('RES',txt[:400],'|',h[:900])
            for m in re.finditer(r'https?%3a%2f%2ftl\.rulate\.ru%2fbook%2f(\d+)',r.text,re.I):
              print('ENCODED_BOOK',m.group(1))
            for m in re.finditer(r'https?://tl\.rulate\.ru/book/(\d+)',html.unescape(r.text),re.I):
              print('BOOK',m.group(1))
          PY
